<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Attendreem</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<style>
    html, body { margin: 0; padding: 0; min-height: 100%; background: linear-gradient(135deg, #1309f5, #5752fa); }
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1309f5, #5752fa); padding: 20px; box-sizing: border-box; }
.login-card { width: 100%; max-width: 360px; background: #fff; border-radius: 24px; padding: 32px 28px; box-shadow: 0 20px 50px rgba(0,0,0,.15); box-sizing: border-box; }
.login-logo { width: 56px; height: 56px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; border-radius: 16px; overflow: hidden; }
.login-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; display: block; }
.login-brand { text-align: center; font-size: 20px; font-weight: 700; color: #20243a; margin-bottom: 4px; }
.login-tagline { text-align: center; font-size: 13px; color: #888; margin-bottom: 28px; }
.login-field { margin-bottom: 14px; }
.login-field label { display: block; font-size: 12px; color: #64748b; margin-bottom: 6px; font-weight: 600; }
.login-field input { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; background: #fafafa; }
.pwd-wrap { position: relative; }
.pwd-wrap input { padding-right: 42px; }
.pwd-eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8; font-size: 14px; background: none; border: none; padding: 0; }
.login-btn { width: 100%; padding: 13px; margin-top: 6px; border: none; border-radius: 12px; background: linear-gradient(135deg, #1309f5, #5752fa); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(37,65,255,.25); }
.login-btn:disabled { opacity: 0.6; cursor: default; }
</style>
</head>

<body>

<div class="login-wrap">
    <div class="login-card">

        <div class="login-logo"><img src="favicon.png" alt="Attendreem"></div>
        <div class="login-brand">Attendreem</div>
        <div class="login-tagline">Masuk untuk mencatat kehadiranmu</div>

        <div class="login-field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="nama@sekolah.id">
        </div>

        <div class="login-field">
            <label for="password">Password</label>
            <div class="pwd-wrap">
                <input type="password" id="password" placeholder="••••••••">
               <button type="button" class="pwd-eye" id="togglePwd">
    <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none">
        <path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
    </svg>
</button>
            </div>
        </div>

        <button type="button" class="login-btn" id="loginBtn" onclick="loginUser()">
            Login
        </button>

        <button type="button" id="forgotPwdLink" onclick="toggleForgotPanel()" style="display:block;width:100%;text-align:center;background:none;border:none;color:#1309f5;font-size:12.5px;font-weight:600;margin-top:14px;cursor:pointer;padding:4px">
            Forgot password?
        </button>

        <div id="forgotPanel" style="display:none;margin-top:10px;padding-top:14px;border-top:1px solid #f1f1f6">
            <div class="login-field">
                <label for="forgotEmail">Enter your email to get a reset link</label>
                <input type="email" id="forgotEmail" placeholder="nama@sekolah.id">
            </div>
            <button type="button" class="login-btn" id="forgotBtn" onclick="sendResetEmail()" style="background:#fff;color:#1309f5;border:1px solid #e2e8f0;box-shadow:none">
                Send Reset Link
            </button>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>

document.getElementById("togglePwd").addEventListener("click", function () {
    const pwd = document.getElementById("password");
    const isHidden = pwd.type === "password";
    pwd.type = isHidden ? "text" : "password";

    document.getElementById("eyeIcon").innerHTML = isHidden
        ? '<path d="M3 3L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.9 5.1C10.6 5 11.3 5 12 5C18.5 5 22 12 22 12C21.5 13 20.6 14.3 19.3 15.5M6.7 6.7C4 8.3 2 12 2 12C2 12 5.5 19 12 19C13.7 19 15.2 18.6 16.4 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 14.1C9.3 13.5 9 12.8 9 12C9 10.3 10.3 9 12 9C12.8 9 13.5 9.3 14.1 9.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
        : '<path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>';
});

function toggleForgotPanel() {
    const panel = document.getElementById("forgotPanel");
    const isHidden = panel.style.display === "none";
    panel.style.display = isHidden ? "block" : "none";
    if (isHidden) {
        document.getElementById("forgotEmail").value = document.getElementById("email").value;
        document.getElementById("forgotEmail").focus();
    }
}

async function sendResetEmail() {
    const email = document.getElementById("forgotEmail").value.trim();
    const btn = document.getElementById("forgotBtn");

    if (!email) {
        showToast("Please enter your email.", "error");
        return;
    }

    btn.disabled = true;
    btn.textContent = "Sending...";

    const redirectTo = window.location.href.replace(/login\.html.*$/, "reset-password.html");

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: redirectTo
    });

    btn.disabled = false;
    btn.textContent = "Send Reset Link";

    if (error) {
        showToast("Failed to send reset link: " + error.message, "error");
        return;
    }

    showToast("Reset link sent. Check your email.", "success");
}

async function loginUser() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("loginBtn");

    if (!email || !password) {
        showToast("Please enter your email and password.", "error");
        return;
    }

    btn.disabled = true;
    btn.textContent = "Logging in...";

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        console.error(error);
        showToast("Login failed: " + error.message, "error");
        btn.disabled = false;
        btn.textContent = "Login";
        return;
    }

    const { data: profile, error: profileError } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", data.user.id)
        .single();

    if (profileError || !profile) {
        console.error("Profile not found:", profileError);
        showToast("Login succeeded, but no profile was found for this account. Contact your admin.", "error");
        btn.disabled = false;
        btn.textContent = "Login";
        return;
    }

    if (profile.role === "admin") {
        window.location.href = "index.html";
    } else {
        window.location.href = "index.html";
    }

}

</script>

</body>
</html>
