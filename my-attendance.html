<!-- JAVASCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/auth.js"></script>

<script>
const myStatusIcon = { Hadir: "✓", Izin: "!", Sakit: "+", Alpa: "!" };
const myStatusKeyMap = { Hadir: "status_present", Izin: "status_permission", Sakit: "status_sick", Alpa: "status_absent" };
function tr(key) {
    const lang = getLang();
    return (translations[key] && translations[key][lang]) || key;
}
function myStatusLabelOf(status) {
    return tr(myStatusKeyMap[status]) || status;
}

function renderScore(data) {
    const total = data.length;
    const hadir = data.filter(i => i.status === "Hadir").length;
    const izin = data.filter(i => i.status === "Izin").length;
    const sakit = data.filter(i => i.status === "Sakit").length;
    const alpa = data.filter(i => i.status === "Alpa").length;
    const percent = total > 0 ? Math.round((hadir / total) * 100) : 0;

    document.getElementById("scorePercent").textContent = percent + "%";
    document.getElementById("scoreProgressFill").style.width = percent + "%";
    document.getElementById("myHadir").textContent = hadir;
    document.getElementById("myIzin").textContent = izin;
    document.getElementById("mySakit").textContent = sakit;
    document.getElementById("myAlpa").textContent = alpa;

    const descEl = document.getElementById("scoreDesc");
    if (total === 0) descEl.textContent = tr("score_no_data");
    else if (percent >= 90) descEl.textContent = tr("score_excellent");
    else if (percent >= 75) descEl.textContent = tr("score_good");
    else descEl.textContent = tr("score_needs_improvement");
}

function renderQuickStats(data) {
    const sorted = data.slice().sort((a, b) => new Date(b.date) - new Date(a.date));

    let streak = 0;
    for (let i = 0; i < sorted.length; i++) {
        if (sorted[i].status === "Hadir") streak++;
        else break;
    }

    const now = new Date();
    const activeDays = data.filter(function (item) {
        const d = new Date(item.date);
        return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }).length;

    const daysUnitLabel = translations.unit_days[getLang()];
    document.getElementById("myStreak").textContent = streak + " " + daysUnitLabel;
    document.getElementById("myActiveDays").textContent = activeDays + " " + daysUnitLabel;
}

function renderActivity(data) {
    const sorted = data.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
    const container = document.getElementById("myActivityList");

    if (sorted.length === 0) {
        container.innerHTML = '<div class="empty-attendance"><span>📋</span><p>' + tr("no_activity_yet") + '</p></div>';
        return;
    }

    const todayStr = new Date().toDateString();
    const yestStr = new Date(Date.now() - 86400000).toDateString();

    container.innerHTML = sorted.map(function (item) {
        const d = new Date(item.date);
        let label;
        if (d.toDateString() === todayStr) label = tr("label_today");
        else if (d.toDateString() === yestStr) label = tr("label_yesterday");
        else label = dayMonthLabel(d).toUpperCase();

        const cls = item.status.toLowerCase();
        const sub = item.status === "Hadir"
            ? dayMonthLabel(d) + " · " + (item.time || "-")
            : (item.time || "-") + " · " + (item.reason || myStatusLabelOf(item.status));

        return `
            <div class="activity-group">
                <p class="activity-date">${label}</p>
                <div class="activity-card">
                    <div class="activity-status-icon ${cls}">${myStatusIcon[item.status] || "?"}</div>
                    <div class="activity-content">
                        <strong>${myStatusLabelOf(item.status)}</strong>
                        <span>${sub}</span>
                    </div>
                    <span class="activity-arrow">›</span>
                </div>
            </div>
        `;
    }).join("");
}

function renderCalendar(data) {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();

    document.getElementById("calendarMonthLabel").textContent =
        monthYearLabel(now);

    const statusByDay = {};
    data.forEach(function (item) {
        const d = new Date(item.date);
        if (d.getFullYear() === year && d.getMonth() === month) {
            statusByDay[d.getDate()] = item.status;
        }
    });

    const daysInMonth = new Date(year, month + 1, 0).getDate();
    let firstWeekday = new Date(year, month, 1).getDay();
    firstWeekday = firstWeekday === 0 ? 6 : firstWeekday - 1;

    let html = "";
    for (let i = 0; i < firstWeekday; i++) html += '<span class="empty"></span>';

    const todayNum = now.getDate();

    for (let day = 1; day <= daysInMonth; day++) {
        const status = statusByDay[day];
        let cls = "";
        if (status === "Izin") cls = "izin-day";
        else if (status === "Sakit") cls = "sakit-day";
        else if (status === "Alpa") cls = "alpa-day";
        else if (status === "Hadir") cls = "hadir-day";
        if (day === todayNum) cls += " today-day";
        html += `<span class="${cls.trim()}">${day}</span>`;
    }

    document.getElementById("myCalendarDays").innerHTML = html;
}

function renderInsight(data) {
    const total = data.length;
    const hadir = data.filter(i => i.status === "Hadir").length;
    const percent = total > 0 ? Math.round((hadir / total) * 100) : 0;

    const titleEl = document.getElementById("myInsightTitle");
    const textEl = document.getElementById("myInsightText");

    if (total === 0) {
        titleEl.textContent = tr("no_attendance_insight_title");
        textEl.textContent = tr("no_attendance_insight_text");
    } else if (percent >= 90) {
        titleEl.textContent = tr("great_insight_title");
        textEl.textContent = tr("great_insight_text");
    } else if (percent >= 75) {
        titleEl.textContent = tr("good_insight_title");
        textEl.textContent = tr("good_insight_text");
    } else {
        titleEl.textContent = tr("improve_insight_title");
        textEl.textContent = tr("improve_insight_text");
    }
}

async function loadMyAttendance() {
      const { data, error } = await getMyAttendance();
    if (error) {
        console.error("My Attendance error:", error);
        return;
    }

    renderScore(data);
    renderQuickStats(data);
    renderActivity(data);
    renderCalendar(data);
    renderInsight(data);
}

loadMyAttendance();
window.addEventListener("tabshow", loadMyAttendance);
</script>

<script>
let touchStartX = 0;
let touchEndX = 0;

document.addEventListener("touchstart", function (event) {
    touchStartX = event.changedTouches[0].screenX;
});

document.addEventListener("touchend", function (event) {
    touchEndX = event.changedTouches[0].screenX;

    const swipeDistance = touchEndX - touchStartX;

    // Swipe kanan → History
    if (swipeDistance > 80) {
        window.location.href = "history.html";
    }
});
</script>
