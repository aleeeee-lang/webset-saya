<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Attendly</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="attendance-page">

    <section class="attendance-intro">
        <h2>Settings</h2>
    </section>

    <section class="attendance-card" id="accountInfoCard">
        <div class="card-label">Account Info</div>
        <div style="display:flex;flex-direction:column;gap:4px">
            <span style="font-size:14px;color:#20243a" id="settingsName">-</span>
            <span style="font-size:12px;color:#888" id="settingsEmail">-</span>
            <span style="font-size:12px;color:#888" id="settingsClass"></span>
        </div>
    </section>

    <section class="attendance-card" style="padding:8px 16px">

        <a href="change-password.html" style="display:flex;align-items:center;gap:12px;padding:12px 0;text-decoration:none;color:#20243a;border-bottom:1px solid #f0f0f5">
            <span style="width:34px;height:34px;border-radius:10px;background:#f8f8ff;display:flex;align-items:center;justify-content:center;font-size:15px">🔒</span>
            <span style="flex:1;font-size:13px">Change Password</span>
            <span style="color:#aaa;font-size:16px">›</span>
        </a>

        <a href="#" style="display:flex;align-items:center;gap:12px;padding:12px 0;text-decoration:none;color:#20243a">
            <span style="width:34px;height:34px;border-radius:10px;background:#f8f8ff;display:flex;align-items:center;justify-content:center;font-size:15px">ℹ️</span>
            <span style="flex:1;font-size:13px">About Attendly</span>
            <span style="color:#aaa;font-size:16px">›</span>
        </a>

    </section>

    <section class="attendance-card" style="padding:8px 16px">

        <button type="button" onclick="logoutUser()" style="width:100%;display:flex;align-items:center;gap:12px;padding:12px 0;background:none;border:none;cursor:pointer;text-align:left;font-family:inherit">
            <span style="width:34px;height:34px;border-radius:10px;background:#ffe8eb;display:flex;align-items:center;justify-content:center;font-size:15px">🚪</span>
            <span style="flex:1;font-size:13px;color:#dc3545">Logout</span>
        </button>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

<script>

async function loadAccountInfo() {

    const user = await requireLogin();
    if (!user) return;

    const { data: profile } = await supabaseClient
        .from("profiles")
        .select("name, class, role")
        .eq("id", user.id)
        .single();

    document.getElementById("settingsEmail").textContent = user.email;

    if (profile) {
        document.getElementById("settingsName").textContent = profile.name || "-";
        document.getElementById("settingsClass").textContent =
            profile.role === "admin" ? "Admin" : (profile.class || "-");
    }

}

loadAccountInfo();

</script>

</body>
</html>

<a href="#" style="display:flex;align-items:center;gap:12px;padding:12px 0;text-decoration:none;color:#20243a">
    <span style="width:34px;height:34px;border-radius:10px;background:#f8f8ff;display:flex;align-items:center;justify-content:center;font-size:15px">ℹ️</span>
    <span style="flex:1;font-size:13px">About Attendly</span>
    <span style="color:#aaa;font-size:16px">›</span>
</a>
