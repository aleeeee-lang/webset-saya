<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Academic Calendar - Attendreem</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="theme-color" content="#14162B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=20261102f">
<script src="js/theme.js?v=20261102f"></script>
<script src="js/lang.js?v=20261102f"></script>
<script src="js/toast.js?v=20261102f"></script>
<script src="js/fit.js?v=20261102f" defer></script>
</head>

<body>

<main class="attendance-page">

    <section class="attendance-intro" style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
        <button type="button" onclick="goBack()" aria-label="Back" style="width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:10px;background:transparent;color:#20243a;cursor:pointer;padding:0">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <h2 style="margin:0" data-i18n="menu_academic_calendar">Academic Calendar</h2>
    </section>

    <!-- MONTHLY CALENDAR -->
    <section class="monthly-calendar-card">

        <div class="calendar-header">
            <div>
                <span data-i18n="monthly_overview_label">MONTHLY OVERVIEW</span>
                <h2 id="calendarMonthLabel">-</h2>
            </div>
            <div class="calendar-nav">
                <button type="button" class="calendar-arrow" id="calendarPrevBtn" aria-label="Previous month">‹</button>
                <button type="button" class="calendar-arrow" id="calendarNextBtn" aria-label="Next month">›</button>
            </div>
        </div>

        <div class="calendar-week">
            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
        </div>

        <div class="calendar-days" id="calendarDays"></div>

        <div class="calendar-legend">
            <span><i class="legend red"></i><span id="lgRed">Tanggal merah</span></span>
            <span><i class="legend cuti"></i><span id="lgCuti">Cuti bersama</span></span>
            <span><i class="legend holiday"></i><span data-i18n="type_holiday">Holiday</span></span>
            <span><i class="legend spp"></i><span data-i18n="type_spp">SPP Payment</span></span>
            <span><i class="legend exam"></i><span data-i18n="type_exam">Exam</span></span>
            <span><i class="legend event"></i><span data-i18n="type_event">School Event</span></span>
            <span><i class="legend note"></i><span data-i18n="legend_my_notes">My notes</span></span>
        </div>

    </section>

    <!-- admin: weekly days off for the whole school -->
    <section class="attendance-card cal-off" id="calOffCard" hidden>
        <div class="cal-off-head"><b id="calOffTitle">Libur tiap minggu</b><small id="calOffHint"></small></div>
        <div class="cal-off-days" id="calOffDays"></div>
    </section>

    <!-- UPCOMING EVENTS -->
    <section class="attendance-card" style="margin-top:22px">
        <div class="card-label" data-i18n="label_upcoming_events">Upcoming Events</div>
        <div id="upcomingEventsList" style="display:flex;flex-direction:column;gap:8px;margin-top:10px"></div>

        <button type="button" id="viewAllScheduleBtn" onclick="toggleAllSchedule()" style="width:100%;margin-top:14px;border:1px solid #e2e8f0;background:#fff;border-radius:12px;padding:10px;font-size:13px;font-weight:600;color:#3F6212;cursor:pointer" data-i18n="btn_view_all_schedule">
            View All Schedule
        </button>
    </section>

    <!-- FULL SCHEDULE (ALL EVENTS, GROUPED BY TYPE) -->
    <section class="attendance-card" id="fullScheduleCard" style="margin-top:22px;display:none">
        <div class="card-label" data-i18n="label_full_schedule">Full Academic Schedule</div>
        <div id="fullScheduleList" style="display:flex;flex-direction:column;gap:18px;margin-top:10px"></div>
    </section>

    <!-- ASK US (WHATSAPP) -->
    <a href="https://wa.me/6285707379753?text=Halo%2C%20saya%20mau%20bertanya%20tentang%20kalender%20akademik" target="_blank" rel="noopener" style="position:fixed;right:20px;bottom:24px;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:#14162B;color:#fff;text-decoration:none;font-size:14px;font-weight:700;box-shadow:0 8px 20px rgba(20,22,43,.3);z-index:50">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.35 5.07L2 22l5.1-1.33A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.2 14.1c-.22.62-1.27 1.19-1.75 1.24-.45.05-.86.22-2.9-.6-2.46-.98-4.03-3.46-4.15-3.62-.12-.16-.99-1.31-.99-2.5 0-1.19.62-1.77.85-2.01.22-.24.48-.3.64-.3.16 0 .32 0 .46.01.15.01.35-.06.55.42.2.5.68 1.72.74 1.84.06.12.1.27.02.43-.08.16-.12.26-.24.4-.12.14-.26.31-.37.42-.12.12-.25.25-.11.49.14.24.62 1.02 1.33 1.65.91.81 1.68 1.06 1.92 1.18.24.12.38.1.52-.06.14-.16.6-.7.76-.94.16-.24.32-.2.54-.12.22.08 1.4.66 1.64.78.24.12.4.18.46.28.06.1.06.58-.16 1.2z"/></svg>
        <span data-i18n="btn_ask_us">Tanya Kami</span>
    </a>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20261102f"></script>
<script src="js/auth.js?v=20261102f"></script>
<script src="js/my-notes.js?v=20261102f"></script>
<script src="js/lessons.js?v=20261102f"></script>

<script>

let calendarViewYear = attNow().getFullYear();
let calendarViewMonth = attNow().getMonth();
let allEvents = [];
let eventByDate = {};
let weeklyOff = [], isAdmin = false, redByDate = {};
const CL = function (id, en) { return getLang() === "id" ? id : en; };
function isoOf(key) { return new Date(key + "T00:00:00").getDay() || 7; }
// a weekly day off, unless the admin opened that date (make-up day)
function isOffDay(key) { const ev = eventByDate[key]; return weeklyOff.indexOf(isoOf(key)) !== -1 && !(ev && ev.attendance_open === true); }
// national red dates (national_holidays, from the SKB 3 Menteri): shown for everyone, no admin needed
async function loadRed() {
    const r = await supabaseClient.from("national_holidays").select("date,name,kind").order("date");
    redByDate = {};
    ((!r.error && r.data) || []).forEach(function (n) { redByDate[n.date] = n; });
}

const eventTypeMeta = {
    holiday: { labelKey: "type_holiday" },
    spp: { labelKey: "type_spp" },
    exam: { labelKey: "type_exam" },
    event: { labelKey: "type_event" }
};

function monthYearLabel(date) {
    const lang = getLang();
    return date.toLocaleDateString(lang === "id" ? "id-ID" : "en-US", { month: "long", year: "numeric" });
}

function dayMonthYearLabel(date) {
    const lang = getLang();
    return date.toLocaleDateString(lang === "id" ? "id-ID" : "en-US", { day: "numeric", month: "short", year: "numeric" });
}

async function loadEvents() {
    const { data, error } = await supabaseClient
        .from("holidays")
        .select("*")
        .order("date", { ascending: true });

    if (error || !data) {
        allEvents = [];
    } else {
        allEvents = data;
    }

    eventByDate = {};
    allEvents.forEach(function (e) { eventByDate[e.date] = e; });
}

function renderCalendar() {
    const year = calendarViewYear;
    const month = calendarViewMonth;
    const now = attNow();

    document.getElementById("calendarMonthLabel").textContent = monthYearLabel(new Date(year, month, 1));

    const daysInMonth = new Date(year, month + 1, 0).getDate();
    let firstWeekday = new Date(year, month, 1).getDay();
    firstWeekday = firstWeekday === 0 ? 6 : firstWeekday - 1;

    let html = "";
    for (let i = 0; i < firstWeekday; i++) html += '<span class="empty"></span>';

    const isCurrentMonth = year === now.getFullYear() && month === now.getMonth();
    const todayNum = now.getDate();

    for (let day = 1; day <= daysInMonth; day++) {
        const key = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
        const ev = eventByDate[key];

        let cls = "";
        const red = redByDate[key];
        if (ev) cls = (ev.type || "holiday") + "-day";
        else if (red) cls = red.kind === "cuti" ? "cuti-day" : "red-day";
        else if (isOffDay(key)) cls = "holiday-day off-day";
        if (red && red.kind !== "cuti") cls += " red-num";
        if (isCurrentMonth && day === todayNum) cls += " today-day";

        html += `<span class="${cls.trim()}" data-date="${key}" onclick="showEventInfo('${key}')" style="cursor:pointer">${day}</span>`;
    }

    const box = document.getElementById("calendarDays");
    box.innerHTML = html;
    if (window.AttNotes) AttNotes.mark(box);
}

// admin: tap a weekly day off -> make that one date a school day (e.g. make-up Saturday), tap again -> undo
let sheetLoad = null;
function needSheet() {
    if (window.attConfirm) return Promise.resolve();
    if (!sheetLoad) sheetLoad = new Promise(function (ok, bad) { const sc = document.createElement("script"); sc.src = "js/avatarcrop.js?v=" + (window.attAppVer ? window.attAppVer() : "1"); sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc); });
    return sheetLoad;
}
async function adminDayTap(key) {
    const ev = eventByDate[key], red = redByDate[key] && redByDate[key].kind === "libur", offDay = red || weeklyOff.indexOf(isoOf(key)) !== -1;
    if (!offDay) return false;
    const madeOpen = ev && ev.attendance_open === true && ev.type === "event";
    if (ev && !madeOpen) return false;
    await needSheet();
    const when = new Date(key + "T00:00:00").toLocaleDateString(getLang() === "id" ? "id-ID" : "en-US", { weekday: "long", day: "numeric", month: "long" });
    if (!madeOpen) {
        const ok = await attConfirm({ title: CL("Jadikan hari masuk?", "Make it a school day?"),
            text: CL(when + (red ? " tanggal merah: " + redByDate[key].name : " biasanya libur") + ". Kalau dijadikan hari masuk, absen dibuka dan jadwal pelajaran hari itu muncul untuk semua.", when + " is normally a day off. As a school day, check-in opens and that day's lessons show for everyone."),
            ok: CL("Jadikan hari masuk", "Make school day"), tone: "primary" });
        if (!ok) return true;
        const r = await supabaseClient.from("holidays").insert({ date: key, label: CL("Masuk sekolah", "School day"), type: "event", attendance_open: true });
        if (r.error) { showToast(CL("Gagal menyimpan: ", "Save failed: ") + r.error.message, "error"); return true; }
        showToast(CL(when + " jadi hari masuk", when + " is now a school day"), "success");
    } else {
        const ok = await attConfirm({ title: CL("Kembalikan jadi libur?", "Back to a day off?"), text: CL(when + " akan libur lagi seperti biasa.", when + " goes back to being a day off."), ok: CL("Jadikan libur", "Make day off") });
        if (!ok) return true;
        const r = await supabaseClient.from("holidays").delete().eq("id", ev.id);
        if (r.error) { showToast(CL("Gagal menyimpan: ", "Save failed: ") + r.error.message, "error"); return true; }
        showToast(CL(when + " libur lagi", when + " is a day off again"), "success");
    }
    await loadEvents(); renderCalendar(); renderUpcomingEvents();
    return true;
}

function renderOffCard() {
    const card = document.getElementById("calOffCard");
    if (!isAdmin) { card.hidden = true; return; }
    card.hidden = false;
    document.getElementById("calOffTitle").textContent = CL("Libur tiap minggu", "Weekly days off");
    document.getElementById("calOffHint").textContent = CL("Libur setiap minggu untuk semua kelas. Mau tetap masuk di salah satu tanggalnya? Ketuk tanggal itu di kalender.",
        "Off every week for every class. Need school on one of those dates? Tap it in the calendar.");
    document.getElementById("calOffDays").innerHTML = [1, 2, 3, 4, 5, 6, 7].map(function (d) {
        const on = weeklyOff.indexOf(d) !== -1;
        return '<button type="button" data-d="' + d + '" class="' + (on ? "on" : "") + '" aria-pressed="' + on + '">' + Lessons.dayShort(d) + '</button>';
    }).join("");
}
document.getElementById("calOffDays").addEventListener("click", async function (e) {
    const b = e.target.closest("[data-d]");
    if (!b || b.disabled) return;
    const d = Number(b.getAttribute("data-d")), next = weeklyOff.indexOf(d) !== -1 ? weeklyOff.filter(function (x) { return x !== d; }) : weeklyOff.concat(d).sort();
    b.disabled = true;
    const r = await supabaseClient.from("attendance_period_settings").upsert({ id: "global", weekly_off: next, updated_at: new Date().toISOString() }, { onConflict: "id" });
    b.disabled = false;
    if (r.error) { showToast(/weekly_off/.test(r.error.message || "") ? CL("Jalankan kalender_libur.sql dulu di Supabase.", "Run kalender_libur.sql in Supabase first.") : CL("Gagal menyimpan: ", "Save failed: ") + r.error.message, "error"); return; }
    weeklyOff = next;
    renderOffCard(); renderCalendar();
    showToast(next.length ? CL("Libur tiap minggu: ", "Weekly days off: ") + next.map(function (x) { return Lessons.dayName(x); }).join(", ") : CL("Tidak ada libur rutin", "No weekly days off"), "success");
});

async function showEventInfo(dateKey) {
    if (isAdmin && await adminDayTap(dateKey)) return;
    const lang = getLang();
    const ev = eventByDate[dateKey];
    if (window.AttNotes) {
        // day sheet: the school agenda of that day + the student's own notes
        const info = [];
        if (ev) {
            const m = eventTypeMeta[ev.type || "holiday"] || eventTypeMeta.holiday;
            const tl = translations[m.labelKey] ? translations[m.labelKey][lang] : ev.type;
            info.push({ text: ev.label ? tl + " — " + ev.label : tl, dot: ev.type || "holiday" });
        }
        const red = redByDate[dateKey];
        if (red) info.push({ text: (red.kind === "cuti" ? CL("Cuti bersama — ", "Joint leave — ") : CL("Tanggal merah — ", "National holiday — ")) + red.name, dot: red.kind === "cuti" ? "cuti" : "red" });
        else if (!ev && isOffDay(dateKey)) info.push({ text: CL("Libur rutin tiap minggu", "Weekly day off"), dot: "holiday" });
        AttNotes.open(dateKey, { info: info, onChange: function () { AttNotes.mark(document.getElementById("calendarDays")); } });
        return;
    }
    if (!ev) return;

    const meta = eventTypeMeta[ev.type || "holiday"] || eventTypeMeta.holiday;
    const typeLabel = translations[meta.labelKey] ? translations[meta.labelKey][lang] : ev.type;
    const dateLabel = dayMonthYearLabel(new Date(dateKey + "T00:00:00"));
    const message = ev.label ? (typeLabel + " — " + ev.label + " (" + dateLabel + ")") : (typeLabel + " (" + dateLabel + ")");
    showToast(message, "info");
}

function renderUpcomingEvents() {
    const lang = getLang();
    const container = document.getElementById("upcomingEventsList");
    const todayKey = localDateStr();

    const nat = Object.keys(redByDate).filter(function (d) { return !eventByDate[d]; }).map(function (d) { const n = redByDate[d]; return { date: d, label: n.name, type: n.kind === "cuti" ? "cuti" : "red", nat: true }; });
    const upcoming = allEvents.concat(nat).filter(function (e) { return e.date >= todayKey; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; }).slice(0, 15);

    if (upcoming.length === 0) {
        container.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_no_upcoming_events[lang] + "</p>";
        return;
    }

    container.innerHTML = upcoming.map(function (e) {
        const meta = eventTypeMeta[e.type || "holiday"] || eventTypeMeta.holiday;
        const typeLabel = e.nat ? (e.type === "cuti" ? CL("Cuti bersama", "Joint leave") : CL("Tanggal merah", "National holiday")) : (translations[meta.labelKey] ? translations[meta.labelKey][lang] : e.type);
        return `
            <div class="am-row" style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:#f8f8ff;border-radius:12px">
                <i class="legend ${e.type || "holiday"}" style="width:8px;height:8px;border-radius:50%;flex-shrink:0"></i>
                <div style="flex:1;min-width:0">
                    <strong style="display:block;font-size:13px;color:#20243a">${escapeHTML(e.label || "-")}</strong>
                    <span style="display:block;margin-top:2px;font-size:12px;color:#888">${dayMonthYearLabel(new Date(e.date + "T00:00:00"))} · ${typeLabel}</span>
                </div>
            </div>
        `;
    }).join("");
}

let fullScheduleShown = false;

function toggleAllSchedule() {
    const lang = getLang();
    const card = document.getElementById("fullScheduleCard");
    const btn = document.getElementById("viewAllScheduleBtn");

    fullScheduleShown = !fullScheduleShown;

    if (fullScheduleShown) {
        renderFullSchedule();
        card.style.display = "block";
        btn.textContent = translations.btn_hide_all_schedule[lang];
        card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    } else {
        card.style.display = "none";
        btn.textContent = translations.btn_view_all_schedule[lang];
    }
}

function renderFullSchedule() {
    const lang = getLang();
    const container = document.getElementById("fullScheduleList");

    if (allEvents.length === 0) {
        container.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_no_upcoming_events[lang] + "</p>";
        return;
    }

    const groups = { holiday: [], exam: [], spp: [], event: [] };
    allEvents.forEach(function (e) {
        const type = groups[e.type] ? e.type : "holiday";
        groups[type].push(e);
    });

    const order = ["holiday", "exam", "spp", "event"];

    container.innerHTML = order.filter(function (type) { return groups[type].length > 0; }).map(function (type) {
        const meta = eventTypeMeta[type];
        const typeLabel = translations[meta.labelKey] ? translations[meta.labelKey][lang] : type;
        const rows = groups[type].map(function (e) {
            return `
                <div class="am-row" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#f8f8ff;border-radius:12px">
                    <span style="font-size:13px;color:#20243a">${escapeHTML(e.label || "-")}</span>
                    <span style="font-size:12px;color:#888;flex-shrink:0">${dayMonthYearLabel(new Date(e.date + "T00:00:00"))}</span>
                </div>
            `;
        }).join("");

        return `
            <div>
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
                    <i class="legend ${type}" style="width:8px;height:8px;border-radius:50%"></i>
                    <strong style="font-size:13px;color:#20243a">${typeLabel}</strong>
                </div>
                <div style="display:flex;flex-direction:column;gap:6px">${rows}</div>
            </div>
        `;
    }).join("");
}

function prevCalendarMonth() {
    calendarViewMonth--;
    if (calendarViewMonth < 0) { calendarViewMonth = 11; calendarViewYear--; }
    renderCalendar();
}

function nextCalendarMonth() {
    calendarViewMonth++;
    if (calendarViewMonth > 11) { calendarViewMonth = 0; calendarViewYear++; }
    renderCalendar();
}

// the arrow you last pressed is the one that lights up
function markCalendarArrow(btn) {
    document.querySelectorAll(".calendar-arrow").forEach(function (b) { b.classList.toggle("on", b === btn); });
}
// back on the current month: no arrow box
function calendarOnThisMonth() {
    const n = attNow();
    return calendarViewYear === n.getFullYear() && calendarViewMonth === n.getMonth();
}
// the school clock arrived (other time zone / phone clock off): redraw "today"
window.addEventListener("attclock", function () { calendarViewYear = attNow().getFullYear(); calendarViewMonth = attNow().getMonth(); markCalendarArrow(null); renderCalendar(); renderUpcomingEvents(); });
document.getElementById("calendarPrevBtn").addEventListener("click", function () { prevCalendarMonth(); markCalendarArrow(calendarOnThisMonth() ? null : this); });
document.getElementById("calendarNextBtn").addEventListener("click", function () { nextCalendarMonth(); markCalendarArrow(calendarOnThisMonth() ? null : this); });

async function checkUser() {
    const user = await requireLogin();
    if (!user) return;

    const [, , set, prof] = await Promise.all([
        loadEvents(), loadRed(),
        supabaseClient.from("attendance_period_settings").select("weekly_off").eq("id", "global").maybeSingle(),
        attMyProfile(user.id)
    ]);
    weeklyOff = ((set && !set.error && set.data && set.data.weekly_off) || []).map(Number);
    isAdmin = !!(prof && prof.role === "admin");
    document.getElementById("lgRed").textContent = CL("Tanggal merah", "National holiday");
    document.getElementById("lgCuti").textContent = CL("Cuti bersama", "Joint leave");
    renderOffCard();
    renderCalendar();
    renderUpcomingEvents();
    if (window.AttNotes) AttNotes.load().then(function () { AttNotes.mark(document.getElementById("calendarDays")); });
}

checkUser();

function goBack() {
    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        history.back();
    } else {
        window.location.href = "index.html";
    }
}

</script>

</body>
</html>
