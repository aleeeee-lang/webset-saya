<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Leave Request - Attendreem</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="theme-color" content="#14162B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=20261030d">
<script src="js/theme.js?v=20261030d"></script>
<script src="js/lang.js?v=20261030d"></script>
<script src="js/toast.js?v=20261030d"></script>
<script src="js/fit.js?v=20261030d" defer></script>
</head>

<body class="v2-page">

<main class="v2-wrap v3-page lv-page">

    <header class="v2-head v3-head">
        <button type="button" class="v2-back v3-back" onclick="goBack()" aria-label="Kembali"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <h1 id="lvTitle">Izin &amp; sakit</h1>
    </header>

    <section class="ts-card lv-card">
        <select id="leaveType" hidden aria-hidden="true" tabindex="-1">
            <option value="Izin">Izin</option>
            <option value="Sakit">Sakit</option>
        </select>
        <div class="lv-seg" id="lvSeg" role="radiogroup">
            <button type="button" role="radio" data-v="Izin" class="on" aria-checked="true" data-i18n="status_permission">Izin</button>
            <button type="button" role="radio" data-v="Sakit" aria-checked="false" data-i18n="status_sick">Sakit</button>
        </div>

        <div class="lv-dates">
            <label class="tc-field"><span id="lvFrom">Dari</span><input type="date" id="leaveStartDate"></label>
            <label class="tc-field"><span id="lvTo">Sampai</span><input type="date" id="leaveEndDate"></label>
        </div>

        <label class="tc-field"><span id="lvWhy">Alasan</span><textarea id="leaveReason" rows="3" placeholder="Contoh: demam sejak semalam"></textarea></label>

        <!-- photo of a letter (js/att-proof.js) -->
        <section class="v2-proof lv-proof" id="proofBox" hidden>
            <div class="v2-proof-head"><b id="proofTitle">Foto surat / bukti</b><small id="proofHint"></small></div>
            <div class="v2-proof-empty" id="proofEmpty">
                <button type="button" class="v2-proof-btn" id="proofCam"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><span id="proofCamTxt">Ambil foto</span></button>
                <button type="button" class="v2-proof-btn" id="proofGal"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg><span id="proofGalTxt">Dari galeri</span></button>
            </div>
            <div class="v2-proof-full" id="proofFull" hidden>
                <img id="proofImg" alt="">
                <div class="v2-proof-act">
                    <button type="button" class="v2-proof-link" id="proofChange">Ganti</button>
                    <button type="button" class="v2-proof-x" id="proofRemove"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
                </div>
            </div>
            <input type="file" id="proofCamIn" accept="image/*" capture="environment" hidden>
            <input type="file" id="proofGalIn" accept="image/*" hidden>
        </section>

        <p class="lv-hint" data-i18n="hint_leave_request">Bisa untuk hari ini atau hari lain.</p>
    </section>

    <h2 class="v3-sec" id="lvMineH">Pengajuan saya</h2>
    <div class="tc-list" id="leaveRequestsList"><div class="tc-empty">&nbsp;</div></div>

    <div class="ts-add-wrap"><button type="button" class="ts-add" id="submitLeaveBtn" onclick="submitLeaveRequest()" data-i18n="btn_submit_leave_request">Kirim pengajuan</button></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20261030d"></script>
<script src="js/auth.js?v=20261030d"></script>
<script src="js/att-proof.js?v=20261030d"></script>

<script>

const LV = (id, en) => getLang() === "id" ? id : en;
document.getElementById("lvTitle").textContent = LV("Izin & sakit", "Leave & sick");
document.getElementById("lvFrom").textContent = LV("Dari", "From");
document.getElementById("lvTo").textContent = LV("Sampai", "To");
document.getElementById("lvWhy").textContent = LV("Alasan", "Reason");
document.getElementById("lvMineH").textContent = LV("Pengajuan saya", "My requests");
document.getElementById("leaveReason").placeholder = LV("Contoh: acara keluarga di luar kota", "e.g. family event out of town");

let currentUser = null;
let myProfile = null;
let myLeaveRequests = [];

async function checkUser() {
    const user = await requireLogin();
    if (!user) return;
    currentUser = user;

    const { data: profile } = await supabaseClient
        .from("profiles")
        .select("name,class")
        .eq("id", user.id)
        .single();

    myProfile = profile;

    // usually it is just today (sick this morning): both dates start on today
    document.getElementById("leaveStartDate").value = localDateStr();
    document.getElementById("leaveEndDate").value = localDateStr();
    syncLeaveEndMin();

    await loadMyLeaveRequests();
}

async function loadMyLeaveRequests() {
    const { data } = await supabaseClient
        .from("leave_requests")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

    myLeaveRequests = data || [];
    renderLeaveRequests();
}

function localTodayStr() {
    const now = attNow();
    return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
}

// Pending and rejected requests can be deleted any time. Approved ones
// only once the leave period is over (the day after end_date), so the
// list doesn't pile up; the attendance records it created stay.
function canDeleteLeave(r) {
    if (r.status === "pending" || r.status === "rejected") return true;
    if (r.status === "approved") return (r.end_date || r.start_date) < localTodayStr();
    return false;
}

function renderLeaveRequests() {
    const lang = getLang();
    const container = document.getElementById("leaveRequestsList");

    if (myLeaveRequests.length === 0) {
        container.innerHTML = '<div class="tc-empty">' + translations.text_no_leave_requests[lang] + '</div>';
        return;
    }

    const MON = LV("Jan Feb Mar Apr Mei Jun Jul Agu Sep Okt Nov Des", "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec").split(" ");
    const dm = function (x) { const d = new Date(x + "T00:00:00"); return d.getDate() + " " + MON[d.getMonth()]; };
    container.innerHTML = myLeaveRequests.map(function (r) {
        const typeLabel = r.type === "Sakit" ? translations.status_sick[lang] : translations.status_permission[lang];
        const statusLabel = translations["badge_leave_" + r.status][lang];
        const range = (!r.end_date || r.start_date === r.end_date) ? dm(r.start_date) : dm(r.start_date) + " – " + dm(r.end_date);
        const sub = [r.reason, r.proof_url ? LV("📎 ada surat", "📎 letter") : "", r.status !== "pending" && r.reviewed_by_name ? LV("oleh ", "by ") + r.reviewed_by_name : ""].filter(Boolean).join(" · ");
        const tone = r.status === "approved" ? "ok" : r.status === "rejected" ? "no" : "izin";
        return `<div class="ts-row"><div class="ts-row-t"><b>${escapeHTML(typeLabel + " · " + range)}</b>${sub ? `<small>${escapeHTML(sub)}</small>` : ""}</div><span class="tc-pill ${tone}">${escapeHTML(statusLabel)}</span>${canDeleteLeave(r) ? `<button type="button" class="ts-del" onclick="deleteLeaveRequest('${r.id}')" aria-label="${LV("Hapus", "Delete")}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>` : ""}</div>`;
    }).join("");
}

async function deleteLeaveRequest(id) {
    const lang = getLang();
    if (!confirm(translations.confirm_delete_leave_request[lang])) return;

    const { data, error } = await supabaseClient
        .from("leave_requests")
        .delete()
        .eq("id", id)
        .select("id");

    if (error) {
        showToast(translations.toast_delete_failed[lang] + error.message, "error");
        return;
    }
    if (!data || data.length === 0) {
        showToast(translations.toast_delete_not_allowed[lang], "error");
        return;
    }

    showToast(translations.toast_leave_request_deleted[lang], "success");
    await loadMyLeaveRequests();
}

// the end date can't be before the start date
let lvPrevStart = "";
function syncLeaveEndMin() {
    const st = document.getElementById("leaveStartDate").value;
    const en = document.getElementById("leaveEndDate");
    en.min = st || "";
    // a one-day request follows the start date; an end before the start moves along
    if (st && (!en.value || en.value < st || en.value === lvPrevStart)) en.value = st;
    lvPrevStart = st;
    syncLeaveBtn();
}
// the button can only be pressed once both dates are chosen and a reason is written
function syncLeaveBtn() {
    const btn = document.getElementById("submitLeaveBtn");
    if (btn.dataset.busy) return;
    btn.disabled = !(document.getElementById("leaveStartDate").value && document.getElementById("leaveEndDate").value
        && document.getElementById("leaveReason").value.trim());
}
document.getElementById("leaveReason").addEventListener("input", function () { syncLeaveBtn(); });
// photo of a letter: shown for both types, the hint follows the type
function syncProof() { if (window.attProofShow) attProofShow(document.getElementById("leaveType").value); }
document.getElementById("leaveType").addEventListener("change", syncProof);
document.getElementById("lvSeg").addEventListener("click", function (e) {
    const b = e.target.closest("button[data-v]");
    if (!b) return;
    this.querySelectorAll("button").forEach(function (x) { const on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-checked", on); });
    const sel = document.getElementById("leaveType");
    sel.value = b.dataset.v;
    sel.dispatchEvent(new Event("change"));
    document.getElementById("leaveReason").placeholder = b.dataset.v === "Sakit" ? LV("Contoh: demam sejak semalam", "e.g. fever since last night") : LV("Contoh: acara keluarga di luar kota", "e.g. family event out of town");
});
syncProof();
document.getElementById("leaveStartDate").addEventListener("change", syncLeaveEndMin);
document.getElementById("leaveStartDate").addEventListener("input", syncLeaveEndMin);
document.getElementById("leaveEndDate").addEventListener("change", syncLeaveBtn);
document.getElementById("leaveEndDate").addEventListener("input", syncLeaveBtn);

async function submitLeaveRequest() {
    const lang = getLang();
    const type = document.getElementById("leaveType").value;
    const startDate = document.getElementById("leaveStartDate").value;
    const endDate = document.getElementById("leaveEndDate").value;
    const reason = document.getElementById("leaveReason").value.trim();
    const btn = document.getElementById("submitLeaveBtn");

    if (!startDate || !endDate) {
        showToast(translations.toast_select_leave_date[lang], "error");
        return;
    }

    if (endDate < startDate) {
        showToast(translations.toast_invalid_date_range[lang], "error");
        return;
    }

    if (!reason) {
        showToast(translations.toast_leave_reason_needed[lang], "error");
        return;
    }

    btn.disabled = true; btn.dataset.busy = "1";
    btn.textContent = translations.btn_submitting[lang];

    // photo of a letter (attendance_proof.sql), in the student's own folder
    let proofPath = null;
    const proof = window.attProofBlob ? attProofBlob() : null;
    if (proof) {
        proofPath = currentUser.id + "/leave_" + Date.now() + ".jpg";
        const up = await supabaseClient.storage.from("attendance-photos").upload(proofPath, proof, { contentType: "image/jpeg" });
        if (up.error) {
            delete btn.dataset.busy;
            btn.textContent = translations.btn_submit_leave_request[lang];
            syncLeaveBtn();
            showToast(translations.toast_proof_upload_failed[lang] + up.error.message, "error");
            return;
        }
    }

    const row = {
            user_id: currentUser.id,
            name: myProfile ? myProfile.name : null,
            class: myProfile ? myProfile.class : null,
            type: type,
            start_date: startDate,
            end_date: endDate,
            reason: reason || null
        };
    if (proofPath) row.proof_url = proofPath;
    let { error } = await supabaseClient.from("leave_requests").insert(row);
    // database without attendance_proof.sql yet: send it without the photo
    if (error && proofPath && /proof_url/.test(error.message || "")) {
        delete row.proof_url;
        ({ error } = await supabaseClient.from("leave_requests").insert(row));
    }

    delete btn.dataset.busy;
    btn.textContent = translations.btn_submit_leave_request[lang];
    syncLeaveBtn();

    if (error) {
        showToast(translations.toast_save_failed[lang] + error.message, "error");
        return;
    }

    document.getElementById("leaveReason").value = "";
    document.getElementById("leaveStartDate").value = localDateStr();
    document.getElementById("leaveEndDate").value = localDateStr();
    syncLeaveEndMin();
    if (window.attProofReset) attProofReset();
    syncLeaveBtn();

    showToast(translations.toast_leave_request_submitted[lang], "success");
    await loadMyLeaveRequests();
}

checkUser();

function goBack() {
    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        history.back();
    } else {
        window.location.href = "my-attendance.html";
    }
}

</script>

</body>
</html>
