<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reset Password - Attendreem</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="theme-color" content="#14162B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=20261030h">
<script src="js/theme.js?v=20261030h"></script>
<script src="js/toast.js?v=20261030h"></script>
<script src="js/fit.js?v=20261030h" defer></script>
<style>
    html, body { margin: 0; padding: 0; min-height: 100%; background: #14162B; }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #14162B; padding: 20px; box-sizing: border-box; }
    .login-card { width: 100%; max-width: 360px; background: #fff; border-radius: 24px; padding: 32px 28px; box-shadow: 0 20px 50px rgba(0,0,0,.15); box-sizing: border-box; }
    .login-logo { width: 56px; height: 56px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; border-radius: 16px; overflow: hidden; }
    .login-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; display: block; }
    .login-brand { text-align: center; font-size: 20px; font-weight: 700; color: #20243a; margin-bottom: 4px; }
    .login-tagline { text-align: center; font-size: 13px; color: #888; margin-bottom: 28px; }
    .login-field { margin-bottom: 14px; }
    .login-field label { display: block; font-size: 12px; color: #64748b; margin-bottom: 6px; font-weight: 600; }
    .login-field input { width: 100%; box-sizing: border-box; padding: 12px 46px 12px 14px; border: 1px solid #e2e8f0; border-radius: 12px; font-family: inherit; font-size: 14px; background: #fafafa !important; color: #14162B !important; -webkit-text-fill-color: #14162B; caret-color: #14162B; outline: none; }
    .login-field input::placeholder { color: #9aa0b4 !important; -webkit-text-fill-color: #9aa0b4; }
    .login-field input:focus { border-color: #14162B; background: #fff !important; }
    .pwd-wrap { position: relative; }
    .pwd-eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; cursor: pointer; color: #8A8FA8; background: none !important; border: none; padding: 0; display: flex; align-items: center; justify-content: center; }
    .login-btn { width: 100%; padding: 13px; margin-top: 6px; border: none; border-radius: 12px; background: #14162B; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(20,22,43,.25); }
    .login-btn:disabled { opacity: 0.6; cursor: default; }
</style>
</head>

<body>

<div class="login-wrap">
    <div class="login-card">

        <div class="login-logo"><img src="favicon.svg?v=4" alt="Attendreem"></div>
        <div class="login-brand">Attendreem</div>
        <div class="login-tagline" id="pageTagline">Set your new password</div>

        <div id="formArea">
            <div class="login-field">
                <label for="newPass">New Password</label>
                <div class="pwd-wrap"><input type="password" id="newPass" placeholder="At least 8 characters, letters and numbers"><button type="button" class="pwd-eye" aria-label="Show password" onclick="rpEye(this)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg></button></div>
            </div>

            <div class="login-field">
                <label for="confirmPass">Confirm New Password</label>
                <div class="pwd-wrap"><input type="password" id="confirmPass" placeholder="Repeat new password"><button type="button" class="pwd-eye" aria-label="Show password" onclick="rpEye(this)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg></button></div>
            </div>

            <button type="button" class="login-btn" id="saveBtn" data-needs="newPass,confirmPass" onclick="savePassword()">
                Save New Password
            </button>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20261030h"></script>

<script>

function rpEye(btn) {
    var inp = btn.previousElementSibling, show = inp.type === "password";
    inp.type = show ? "text" : "password";
    btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
    btn.querySelector("svg").innerHTML = show
        ? '<path d="M3 3L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.9 5.1C10.6 5 11.3 5 12 5C18.5 5 22 12 22 12C21.5 13 20.6 14.3 19.3 15.5M6.7 6.7C4 8.3 2 12 2 12C2 12 5.5 19 12 19C13.7 19 15.2 18.6 16.4 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 14.1C9.3 13.5 9 12.8 9 12C9 10.3 10.3 9 12 9C12.8 9 13.5 9.3 14.1 9.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
        : '<path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>';
}

let recoveryReady = false;

// Supabase puts the recovery token in the URL hash and fires this event
// once it has turned that into a temporary logged-in session.
supabaseClient.auth.onAuthStateChange(function (event, session) {
    if (event === "PASSWORD_RECOVERY") {
        recoveryReady = true;
    }
});

// Fallback: if the link already produced a session before this listener
// attached, allow the form once a session is confirmed.
(async function () {
    const { data } = await supabaseClient.auth.getSession();
    if (data && data.session) {
        recoveryReady = true;
    } else {
        setTimeout(async function () {
            const { data: retry } = await supabaseClient.auth.getSession();
            if (!retry || !retry.session) {
                document.getElementById("pageTagline").textContent = "This reset link is invalid or has expired.";
                document.getElementById("formArea").style.display = "none";
            }
        }, 1500);
    }
})();

async function savePassword() {

    const newPass = document.getElementById("newPass").value;
    const confirmPass = document.getElementById("confirmPass").value;
    const btn = document.getElementById("saveBtn");

    if (!newPass || newPass.length < 8 || !/[A-Za-z]/.test(newPass) || !/[0-9]/.test(newPass)) {
        showToast("Password must be at least 8 characters, with letters and numbers.", "error");
        return;
    }

    if (newPass !== confirmPass) {
        showToast("Passwords do not match.", "error");
        return;
    }

    btn.disabled = true;
    btn.textContent = "Saving...";

    const { error } = await supabaseClient.auth.updateUser({ password: newPass });

    if (error) {
        showToast("Failed to update password: " + error.message, "error");
        btn.disabled = false;
        btn.textContent = "Save New Password";
        return;
    }

    try { localStorage.removeItem("attendreem-weakpw"); } catch (e) {}
    showToast("Password updated. You can log in now.", "success");

    setTimeout(async function () {
        await supabaseClient.auth.signOut();
        window.location.href = "login.html";
    }, 1200);
}

</script>

</body>
</html>
