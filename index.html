<script>
function homeT(key) {
    const e = translations[key];
    return (e && e[getLang()]) || key;
}

function homeTime(t) {
    return (t || "").slice(0, 5).replace(":", ".");
}

function homeChip(text, kind) {
    return '<span class="v2-chip ' + (kind || "") + '">' + text + '</span>';
}

function homeGreetingKey() {
    const h = attNow().getHours();
    if (h < 11) return "greet_morning";
    if (h < 15) return "greet_afternoon";
    if (h < 18) return "greet_evening";
    return "greet_night";
}

function renderHomeAvatar(name, url) {
    const el = document.getElementById("homeAvatar");
    if (url) {
        el.innerHTML = '<img src="' + safeURL(url) + '" alt="">';
    } else {
        el.textContent = (name || "?").trim().charAt(0).toUpperCase() || "?";
    }
}

function renderHomeHeader() {
    const now = attNow();
    const days = { en: ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"], id: ["MINGGU","SENIN","SELASA","RABU","KAMIS","JUMAT","SABTU"] };
    const lang = getLang();
    document.getElementById("homeDate").textContent = (days[lang] || days.en)[now.getDay()] + " · " + dayMonthLabel(now).toUpperCase();
    const g = document.getElementById("homeGreeting");
    g.setAttribute("data-i18n", homeGreetingKey());
    g.textContent = homeT(homeGreetingKey());
}

function renderHomeStatus(todayRecord, schedule, holidayToday, dayRulesChecked) {
    const title = document.getElementById("homeTitle");
    const chips = document.getElementById("homeChips");
    const cta = document.getElementById("homeCta");
    const ctaLabel = document.getElementById("homeCtaLabel");
    let titleKey = "home_not_checked_in";
    let html = "";

    if (todayRecord) {
        titleKey = "home_checked_in";
        const statusKey = { Hadir: "status_present", Izin: "status_permission", Sakit: "status_sick", Alpa: "status_absent" }[todayRecord.status];
        html += homeChip(homeT(statusKey || "status_present") + (todayRecord.time ? " · " + homeTime(todayRecord.time) : ""), "lime");
        cta.href = "my-attendance.html";
        ctaLabel.setAttribute("data-i18n", "btn_view_my_attendance");
    } else if (holidayToday) {
        titleKey = "home_day_off";
        html += homeChip(holidayToday.label || homeT("type_holiday"), "");
        cta.href = "calendar.html";
        ctaLabel.setAttribute("data-i18n", "link_view_academic_calendar");
    } else if (schedule) {
        const now = attNow();
        const isoDay = now.getDay() === 0 ? 7 : now.getDay();
        const nowTime = now.toTimeString().slice(0, 5);
        const activeDays = schedule.active_days || [];
        const start = (schedule.start_time || "").slice(0, 5);
        const end = (schedule.end_time || "").slice(0, 5);
        const lateEnd = schedule.late_mode === "late" ? (schedule.late_end_time || "").slice(0, 5) : "";

        // (the school-day rule already ran when there is a class: an agenda day switched
        //  ON on a weekend must not show "day off" here)
        if (!dayRulesChecked && activeDays.length && activeDays.indexOf(isoDay) === -1) {
            titleKey = "home_day_off";
            cta.href = "calendar.html";
            ctaLabel.setAttribute("data-i18n", "link_view_academic_calendar");
        } else if (start && nowTime < start) {
            html += homeChip(homeT("home_opens_at") + " " + homeTime(start), "outline");
        } else if (end && nowTime <= end) {
            const parts = end.split(":");
            const closeAt = attNow(); closeAt.setHours(+parts[0], +parts[1], 0, 0);
            const mins = Math.max(0, Math.round((closeAt - now) / 60000));
            html += homeChip(homeT("home_closes_at") + " " + homeTime(end), "outline");
            html += homeChip(mins >= 60 ? homeT("home_hours_left").replace("{n}", Math.floor(mins / 60)) : homeT("home_minutes_left").replace("{n}", mins), "lime");
        } else if (lateEnd && nowTime <= lateEnd) {
            html += homeChip(homeT("home_late_until") + " " + homeTime(lateEnd), "outline");
        } else if (end) {
            titleKey = "home_closed";
            cta.href = "leave.html";
            ctaLabel.setAttribute("data-i18n", "home_menu_leave");
        }
    }

    title.setAttribute("data-i18n", titleKey);
    title.textContent = homeT(titleKey);
    title.removeAttribute("aria-busy");
    cta.classList.remove("is-loading");
    chips.innerHTML = html;
    ctaLabel.textContent = homeT(ctaLabel.getAttribute("data-i18n"));
}

function renderHomeStats(data, autoAlpa) {
    const total = data.length + autoAlpa;
    const hadir = data.filter(function (i) { return i.status === "Hadir"; }).length;
    const pct = total > 0 ? Math.round((hadir / total) * 100) : 0;
    // nothing counted yet (a new student): "–", not a misleading 0%
    document.getElementById("homePercent").textContent = total > 0 ? pct + "%" : "–";
    const ring = document.getElementById("homeRing");
    if (ring) ring.setAttribute("stroke-dasharray", (226.2 * pct / 100).toFixed(1) + " 226.2");
    const bar = document.getElementById("homeBar");
    if (bar) bar.style.width = pct + "%";
    document.getElementById("homePercentSub").textContent = homeT("tile_days_of").replace("{a}", hadir).replace("{b}", total);

    const sorted = data.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    let streak = 0;
    for (let i = 0; i < sorted.length; i++) {
        if (sorted[i].status === "Hadir") streak++;
        else break;
    }
    document.getElementById("homeStreak").textContent = streak;
    document.getElementById("homeStreakUnit").textContent = homeT("unit_days").toLowerCase();
}

function renderHomeSpp(record, dueInfo) {
    const now = attNow();
    document.getElementById("homeSppLabel").textContent = "SPP " + monthNameOf(now.getMonth());
    let status = record ? record.status : "unpaid";
    if (!record && dueInfo && !dueInfo.due) status = "notdue";
    const el = document.getElementById("homeSppStatus");
    el.textContent = homeT(status === "pending" ? "v3_spp_pending" : "tile_spp_" + status);
    el.className = "v2-tile-status " + status;
    const hint = document.getElementById("homeSppHint");
    if (!hint) return;
    if (status === "notdue") {
        hint.textContent = dueInfo.next
            ? homeT("v3_spp_hint_notdue") + dayMonthLabel(new Date(dueInfo.next + "T00:00:00"))
            : homeT("v3_spp_hint_notdue_none");
    } else hint.textContent = homeT("v3_spp_hint_" + status);
}

// savings the student actually uses (school, personal or both) - same numbers as the Money page
let hmUid = null, hmPersonalBal = 0;
async function loadHomeMoney(uid) {
    hmUid = uid;
    const box = document.getElementById("homeMoney");
    if (!box) return;
    const ID = getLang() === "id", L = function (a, b) { return ID ? a : b; };
    document.getElementById("hmTitle").textContent = L("Keuanganmu", "Your money");
    document.getElementById("hmSchoolL").textContent = L("Tabungan sekolah", "School savings");
    document.getElementById("hmPersonalL").textContent = L("Tabungan pribadi", "Personal savings");
    let r;
    try {
        r = await Promise.all([
            supabaseClient.from("savings").select("type, amount").eq("student_id", uid),
            supabaseClient.from("personal_savings").select("type, amount").eq("student_id", uid)
        ]);
    } catch (e) { return; }
    // null = not used (no transactions yet, or couldn't load)
    const bal = function (x) {
        if (!x || x.error || !x.data || !x.data.length) return null;
        return x.data.reduce(function (s, i) { return s + (i.type === "tarik" ? -1 : 1) * Number(i.amount || 0); }, 0);
    };
    const a = bal(r[0]), b = bal(r[1]);
    hmPersonalBal = b || 0;
    document.getElementById("hmSchoolC").hidden = a == null;
    document.getElementById("hmPersonalC").hidden = b == null;
    if (a != null) document.getElementById("hmSchool").textContent = formatRupiah(a);
    if (b != null) document.getElementById("hmPersonal").textContent = formatRupiah(b);
    document.getElementById("hmSub").textContent = a != null && b != null
        ? L("Total tabungan ", "Total savings ") + formatRupiah(a + b)
        : L("Saldo tabunganmu", "Your savings balance");
    box.classList.toggle("one", (a == null) !== (b == null));
    box.hidden = a == null && b == null;
}

// tap "Tabungan pribadi": a sheet to put money in or take it out, right from the home page
function hmQuickSave() {
    const ID = getLang() === "id", L = function (a, b) { return ID ? a : b; };
    const esc = function (t) { return String(t).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); };
    const wrap = document.createElement("div");
    wrap.className = "tc-sheet-wrap";
    wrap.innerHTML = '<div class="tc-sheet hm-sheet" role="dialog" aria-modal="true" aria-label="' + esc(L("Tabungan pribadi", "Personal savings")) + '">' +
        '<div class="tc-sheet-grip"></div><h2>' + esc(L("Tabungan pribadi", "Personal savings")) + '</h2>' +
        '<p class="tc-sheet-sub">' + esc(L("Saldo sekarang ", "Balance now ") + formatRupiah(hmPersonalBal)) + '</p>' +
        '<form novalidate>' +
        '<div class="type-toggle hm-seg" data-name="type"><button type="button" data-v="setor" class="type-toggle-btn setor active"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>' + esc(homeT("type_setor")) + '</button><button type="button" data-v="tarik" class="type-toggle-btn tarik"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>' + esc(homeT("type_tarik")) + '</button></div>' +
        '<label class="tc-field"><span>' + esc(L("Jumlah", "Amount")) + '</span><div class="hm-amt"><b>Rp</b><input name="amount" type="text" inputmode="numeric" placeholder="10.000" autocomplete="off"></div></label>' +
        '<div class="hm-quick">' + [5000, 10000, 20000, 50000].map(function (n) { return '<button type="button" data-n="' + n + '">' + esc(formatRupiah(n).replace(/^Rp\s?/, "")) + '</button>'; }).join("") + '</div>' +
        '<label class="tc-field"><span>' + esc(L("Catatan", "Note")) + ' <i>' + esc(L("(opsional)", "(optional)")) + '</i></span><input name="note" type="text" placeholder="' + esc(L("misal: uang saku sisa", "e.g. leftover pocket money")) + '" autocomplete="off"></label>' +
        '<div class="tc-sheet-act"><button type="submit" class="tc-btn solid hm-go is-waiting" disabled>' + esc(homeT("btn_add_transaction")) + '</button></div></form></div>';
    document.body.appendChild(wrap);
    document.documentElement.classList.add("tc-sheet-open");
    requestAnimationFrame(function () { wrap.classList.add("in"); });
    const form = wrap.querySelector("form"), amt = form.querySelector('input[name="amount"]'), btn = form.querySelector('button[type="submit"]');
    let type = "setor", busy = false;
    const digits = function () { return Number(String(amt.value).replace(/\D/g, "")) || 0; };
    const show = function (n) { amt.value = n ? n.toLocaleString("id-ID") : ""; };
    function close() {
        wrap.classList.remove("in");
        document.documentElement.classList.remove("tc-sheet-open");
        setTimeout(function () { wrap.remove(); }, 220);
    }
    // the button stays grey until there is an amount
    const ready = function () { const ok = !!digits(); btn.classList.toggle("is-waiting", !ok); if (!busy) btn.disabled = !ok; };
    amt.addEventListener("input", function () { show(digits()); ready(); });
    wrap.addEventListener("click", function (e) {
        if (e.target === wrap) return close();
        const sb = e.target.closest(".hm-seg button");
        if (sb) { type = sb.dataset.v; wrap.querySelectorAll(".hm-seg button").forEach(function (x) { x.classList.toggle("active", x === sb); }); }
        const q = e.target.closest(".hm-quick button");
        if (q) { show(Number(q.dataset.n)); ready(); }
    });
    document.addEventListener("keydown", function esc2(e) { if (e.key === "Escape") { document.removeEventListener("keydown", esc2); close(); } });
    form.addEventListener("submit", async function (e) {
        e.preventDefault();
        if (busy) return;
        const n = digits();
        if (!n) { showToast(L("Isi jumlahnya dulu.", "Enter an amount first."), "error"); amt.focus(); return; }
        if (type === "tarik" && n > hmPersonalBal) { showToast(L("Saldo tidak cukup.", "Not enough balance."), "error"); return; }
        busy = true; btn.disabled = true;
        const note = form.querySelector('input[name="note"]').value.trim();
        const { error } = await supabaseClient.from("personal_savings").insert({ student_id: hmUid, type: type, amount: n, note: note || null });
        busy = false; ready();
        if (error) { showToast(L("Gagal menyimpan: ", "Couldn't save: ") + error.message, "error"); return; }
        showToast(homeT(type === "tarik" ? "type_tarik" : "type_setor") + " " + formatRupiah(n) + L(" berhasil", " done"), "success");
        close();
        loadHomeMoney(hmUid);
    });
}
document.getElementById("hmPersonalC").addEventListener("click", hmQuickSave);
// tapping the "Keuanganmu" title does the same (school savings alone are the admin's: open the Money page then)
document.querySelector("#homeMoney .jr-home-head").addEventListener("click", function (e) {
    if (document.getElementById("hmPersonalC").hidden) return;
    e.preventDefault();
    hmQuickSave();
});

function renderHomeAgenda(events) {
    const box = document.getElementById("homeAgenda");
    if (!box || !events.length) return;   // the agenda left the home page (SPP etc. now arrive as notifications)
    const shown = events.slice(0, window.innerWidth >= 1024 ? 3 : 1);
    box.innerHTML = shown.map(function (e) {
        const d = new Date(e.date + "T00:00:00");
        const typeKey = { holiday: "type_holiday", spp: "type_spp", exam: "type_exam", event: "type_event" }[e.type] || "type_holiday";
        const mon = monthNameOf(d.getMonth()).slice(0, 3).toUpperCase();
        return '<a href="calendar.html" class="v2-agenda-item">' +
            '<span class="v2-agenda-date"><b>' + d.getDate() + '</b><small>' + mon + '</small></span>' +
            '<span class="v2-agenda-text"><strong></strong><small>' + homeT(typeKey) + ' · ' + dayMonthLabel(d) + '</small></span></a>';
    }).join("");
    box.querySelectorAll(".v2-agenda-text strong").forEach(function (el, i) { el.textContent = shown[i].label || homeT("type_holiday"); });
}

let homeLessons = [];
async function loadHomeLesson(cls) {
    try {
        const { data, error } = await supabaseClient.from("class_schedules").select("*").eq("class", cls);
        if (error) return;
        homeLessons = data || [];
        renderHomeLesson();
        setInterval(renderHomeLesson, 60000);
    } catch (e) {}
}
// "Hari ini" is only a heading for the lesson / task cards: hide it when neither is shown
function syncTodayHead() {
    const h = document.getElementById("homeTodayHead");
    if (h) h.hidden = document.getElementById("homeLesson").hidden;   // tasks moved to the schedule page
}
function renderHomeLesson() {
    const el = document.getElementById("homeLesson");
    if (!el || !homeLessons.length) return;
    const st = Lessons.status(homeLessons), x = st.current || st.next;
    if (!x) { el.hidden = true; syncTodayHead(); return; }
    const lang = getLang(), T = function (k) { return translations[k] ? translations[k][lang] : k; };
    let label;
    if (st.current) label = '<span class="v2-lesson-tag live"><i></i>' + T("home_lesson_now") + '</span>';
    else if (st.nextDay === st.day) label = '<span class="v2-lesson-tag">' + T("home_lesson_next") + ' · ' + T("lsn_in").replace("{t}", Lessons.minutesLabel(Lessons.toMin(x.start_time) - st.minute)) + '</span>';
    else label = '<span class="v2-lesson-tag">' + T("home_lesson_next") + ' · ' + Lessons.dayName(st.nextDay) + '</span>';
    const meta = [x.room, x.teacher_name].filter(Boolean).map(Lessons.esc).join(" · ");
    el.className = "v2-lesson t-" + Lessons.tone(x.subject);
    el.innerHTML = '<div class="v2-lesson-time"><b>' + Lessons.fmt(x.start_time) + '</b><small>' + Lessons.fmt(x.end_time) + '</small></div>' +
        '<div class="v2-lesson-body">' + label + '<strong>' + Lessons.esc(x.subject) + '</strong>' + (meta ? '<small>' + meta + '</small>' : '') + '</div>' +
        '<span class="v2-lesson-go" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>';
    el.hidden = false;
    syncTodayHead();
}

async function loadHome() {
    renderHomeHeader();
    // admins get their own home (js/admin-home.js): switch before anything student-only shows
    let cachedRole = "";
    try { cachedRole = (JSON.parse(localStorage.getItem("attendreem-profile") || "{}")).role || ""; } catch (e) {}
    if (cachedRole === "admin" && window.AdminHome) AdminHome.layout();
    // show the name and photo from the last visit right away (refreshed below)
    try {
        const cached = JSON.parse(localStorage.getItem("attendreem-profile") || "null");
        if (cached && cached.name) {
            document.getElementById("homeName").textContent = cached.name;
            renderHomeAvatar(cached.name, cached.avatar_url);
        }
    } catch (e) {}
    // if loading fails, don't leave the placeholder forever
    setTimeout(function () {
        const t = document.getElementById("homeTitle");
        if (t && !t.textContent && !document.documentElement.classList.contains("is-admin-home")) { t.setAttribute("data-i18n", "home_not_checked_in"); t.textContent = homeT("home_not_checked_in"); t.removeAttribute("aria-busy"); document.getElementById("homeCta").classList.remove("is-loading"); }
    }, 10000);
    const user = await requireLogin();
    if (!user) return;

    const me = await attMyProfile(user.id);
    if (me && me.role === "admin" && window.AdminHome) {
        document.getElementById("homeName").textContent = me.name || user.email || "";
        renderHomeAvatar(me.name || user.email, me.avatar_url);
        const ev = await supabaseClient.from("holidays").select("date,label,type").gte("date", localDateStr()).order("date", { ascending: true }).limit(5);
        renderHomeAgenda(ev.data || []);
        AdminHome.start(user, me);
        return;
    }

    const today = localDateStr();
    const period = attNow().getFullYear() + "-" + String(attNow().getMonth() + 1).padStart(2, "0");

    const results = await Promise.all([
        supabaseClient.from("profiles").select("name, class, avatar_url, created_at").eq("id", user.id).maybeSingle(),
        getMyAttendance(),
        supabaseClient.from("holidays").select("date,label,type").gte("date", today).order("date", { ascending: true }).limit(5),
        supabaseClient.from("spp_payments").select("status, period").eq("user_id", user.id).eq("period", period).maybeSingle(),
        getAttendancePeriod()
    ]);

    const profile = results[0].data || {};
    document.getElementById("homeName").textContent = profile.name || user.email || "";
    renderHomeAvatar(profile.name || user.email, profile.avatar_url);

    const attendance = results[1].data || [];
    const events = results[2].data || [];
    // no payment this month yet: only "not paid" once the SPP date has come (new students aren't billed straight away)
    if (results[3].data) renderHomeSpp(results[3].data);
    else attSppDue(profile.created_at).then(function (d) { renderHomeSpp(null, d); });
    renderHomeAgenda(events);

    if (profile.class) loadHomeLesson(profile.class);
    if (window.Champs) Champs.home(document.getElementById("homeChamps"), { userId: user.id, cls: profile.class || "", onlyClass: profile.class || "", noChart: true });
    loadHomeMoney(user.id);

    let schedule = null;
    if (profile.class) {
        const res = await supabaseClient.from("attendance_schedules").select("*").eq("class", profile.class).maybeSingle();
        schedule = res.data || null;
    }
    const todayRecord = attendance.find(function (r) { return r.date === today; }) || null;
    // a school day or not: the same rule as the check-in page and the database
    // (agenda switched off/on, then the class's active days)
    let holidayToday = null;
    if (profile.class) {
        const rules = await attDayRules(profile.class);
        if (!attDayOpen(today, rules)) {
            const ag = rules.agenda[today];
            holidayToday = { label: ag && ag.label ? ag.label : "" };
        }
    } else {
        holidayToday = events.find(function (e) { return e.date === today && (e.type || "holiday") === "holiday"; }) || null;
    }
    renderHomeStatus(todayRecord, schedule, holidayToday, !!profile.class);

    const counted = await attCountable(user, attendance, results[4]);
    renderHomeStats(counted.rows, counted.autoAlpa);
}

loadHome();
</script>
