<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Attendreem</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css?v=20261010e">
<script src="js/theme.js?v=20261010e"></script>
<script src="js/lang.js?v=20261010e"></script>
<style>
html, body { height: 100%; margin: 0; padding: 0 !important; overflow: hidden; background: #F3F3F7; animation: none !important; }
#stage { position: fixed; inset: 0; overflow: hidden; }
.panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; background: #F3F3F7; will-change: transform; visibility: hidden; }
#stage.moving .panel { box-shadow: 0 0 30px rgba(0,0,0,.10); }
  .spinner-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #F3F3F7; z-index: 5; }
.spinner { width: 34px; height: 34px; border: 3px solid #D6E5A2; border-top-color: #14162B; border-radius: 50%; animation: spin .7s linear infinite; }
html[data-theme="dark"] body, html[data-theme="dark"] .panel, html[data-theme="dark"] .spinner-wrap { background: #000000; }
html[data-theme="dark"] .spinner { border-color: #242424; border-top-color: #C6F432; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="stage"></div>

<!-- The nav bar lives here ONCE, so it never reloads or disappears -->
<nav class="bottom-nav">
  <a href="index.html"><span class="nav-home-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5L12 4L20 10.5V19C20 20.1 19.1 21 18 21H6C4.9 21 4 20.1 4 19V10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 21V15H15V21" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span><small data-i18n="nav_home">Home</small></a>
  <a href="attendance.html"><span class="nav-camera-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8.5C4 7.67 4.67 7 5.5 7H8L9.5 5H14.5L16 7H18.5C19.33 7 20 7.67 20 8.5V18C20 18.83 19.33 19.5 18.5 19.5H5.5C4.67 19.5 4 18.83 4 18V8.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.8"/></svg></span><small data-i18n="nav_attendance">Attendance</small></a>
  <a href="dashboard.html"><span class="nav-dashboard-icon"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 9H10M14 9H16.5M7.5 13H11.5M14 13H16.5M7.5 17H10M14 17H16.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><small data-i18n="nav_dashboard">Dashboard</small></a>
  <a href="history.html"><span class="nav-history-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="7" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M3 10H21" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M7 7V5.5C7 4.7 7.7 4 8.5 4H17C18.1 4 19 4.9 19 6V7" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    <circle cx="16.5" cy="14.5" r="1.3" fill="currentColor"/>
                </svg>
            </span><small data-i18n="nav_history">History</small></a>
  <a href="my-attendance.html"><span class="nav-person-icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="7" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 21C5.8 16.8 8.1 14.5 12 14.5C15.9 14.5 18.2 16.8 19 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><small data-i18n="nav_my">My</small></a>
</nav>

<script>
(function () {
  // [name, file] – same order as the nav bar
  var TABS = [["index","index.html"],["attendance","attendance.html"],["dashboard","dashboard.html"],["history","history.html"],["my-attendance","my-attendance.html"]];
  var DUR = 300, EASE = "cubic-bezier(.22,.8,.3,1)";
  var stage = document.getElementById("stage");
  var links = Array.prototype.slice.call(document.querySelectorAll(".bottom-nav a"));
  var loadedAt = [], current = 0, timer = null;

  function tabFromName(n) { return TABS.findIndex(function (t) { return t[0] === n; }); }
  function nameOf(path) { return path.split("/").pop().replace(/\.html$/, "") || "index"; }
  function setPos(el, x, anim) {
    el.style.transition = anim ? "transform " + DUR + "ms " + EASE : "none";
    el.style.transform = "translate3d(" + x + ",0,0)";
  }

  // One iframe per tab: each page keeps its own state and scroll position
 var spinners = [];

var panels = TABS.map(function (t, k) {
    var wrap = document.createElement("div");
    wrap.className = "panel";
    wrap.style.padding = "0";

    var f = document.createElement("iframe");
    f.style.cssText = "position:absolute;inset:0;width:100%;height:100%;border:0";
    f.title = t[0];
    f.setAttribute("allow", "camera");
    f.addEventListener("load", function () { onFrameLoad(f, k); });

    var sp = document.createElement("div");
    sp.className = "spinner-wrap";
    sp.innerHTML = '<div class="spinner"></div>';

    wrap.appendChild(f);
    wrap.appendChild(sp);
    stage.appendChild(wrap);

    spinners.push(sp);
    return f;
});

  function ensure(k) {
    if (panels[k] && !panels[k].getAttribute("src")) {
        if (spinners[k]) spinners[k].style.display = "flex";
        panels[k].src = TABS[k][1];
    }
}
  function updateNav() { links.forEach(function (a, k) { a.classList.toggle("active", k === current); }); }

  // Neighbour screens are always ready, waiting just outside the screen
  function idle() {
    stage.classList.remove("moving");
    panels.forEach(function (p, k) {
      setPos(p, k === current ? "0px" : k < current ? "-100%" : "100%", false);
      p.style.visibility = "visible";
    });
  }
  function refresh(k) {
    try { if (Date.now() - (loadedAt[k] || 0) > 1500) panels[k].contentWindow.dispatchEvent(new Event("tabshow")); } catch (e) {}
  }

  function slideTo(dest, opts) {
    opts = opts || {};
    clearTimeout(timer);
    ensure(dest);
    stage.classList.add("moving");
    if (dest === current) {
      panels.forEach(function (p, k) {
        setPos(p, k === current ? "0px" : k < current ? "-100%" : "100%", true);
      });
    } else {
      var dir = dest > current ? 1 : -1, from = panels[current], to = panels[dest];
      if (!opts.dragged) {
        setPos(to, dir * 100 + "%", false);
        to.style.visibility = "visible";
        to.getBoundingClientRect();
      }
      setPos(from, -dir * 100 + "%", true);
      setPos(to, "0px", true);
      current = dest;
      updateNav();
      refresh(dest);
      if (opts.push !== false) history.pushState({}, "", "#" + TABS[dest][0]);
    }
    timer = setTimeout(idle, DUR + 40);
  }

  function drag(d) {
    var w = window.innerWidth;
    setPos(panels[current], d + "px", false);
    if (panels[current + 1]) setPos(panels[current + 1], (w + d) + "px", false);
    if (panels[current - 1]) setPos(panels[current - 1], (-w + d) + "px", false);
  }

  // Finger-follow swipe, like Instagram
  function gestures(win) {
    var sx = 0, sy = 0, dx = 0, lock = null, t0 = 0, skip = false;
    win.addEventListener("touchstart", function (e) {
      e.stopPropagation(); // the shell now handles swipes (old page swipe code is ignored)
      if (e.touches.length !== 1) { lock = "v"; return; }
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; lock = null; t0 = Date.now();
      skip = !!(e.target.closest && e.target.closest("textarea,input,select"));
    }, { capture: true, passive: true });
    win.addEventListener("touchmove", function (e) {
      if (skip || lock === "v" || e.touches.length !== 1) return;
      var x = e.touches[0].clientX - sx, y = e.touches[0].clientY - sy;
      if (lock === null) {
        if (Math.abs(x) < 6 && Math.abs(y) < 6) return;
        lock = Math.abs(x) > Math.abs(y) * 1.2 ? "h" : "v";
        if (lock !== "h") return;
        clearTimeout(timer); ensure(current - 1); ensure(current + 1);
        idle();
        stage.classList.add("moving");
      }
      e.preventDefault();
      var edge = (x < 0 && !panels[current + 1]) || (x > 0 && !panels[current - 1]);
      dx = edge ? x * 0.3 : x;
      drag(dx);
    }, { capture: true, passive: false });
    function end(e) {
      e.stopPropagation();
      if (lock !== "h") return;
      lock = null;
      var v = dx / Math.max(1, Date.now() - t0), w = window.innerWidth, dest = current;
      if ((dx < -w * 0.25 || (v < -0.5 && dx < -40)) && panels[current + 1]) dest = current + 1;
      else if ((dx > w * 0.25 || (v > 0.5 && dx > 40)) && panels[current - 1]) dest = current - 1;
      slideTo(dest, { dragged: true });
    }
    win.addEventListener("touchend", end, { capture: true });
    win.addEventListener("touchcancel", end, { capture: true });
  }

  function onFrameLoad(f, k) {
    var win, doc;
    try { win = f.contentWindow; doc = f.contentDocument; if (win.location.href === "about:blank") return; }
    catch (e) { return; }
    var idx = tabFromName(nameOf(win.location.pathname));
    if (idx !== k) {
      if (idx >= 0) { f.src = TABS[k][1]; slideTo(idx); }      // page tried to open another tab
      else { window.location.href = win.location.href; }       // e.g. login page
      return;
    }
    loadedAt[k] = Date.now();
    if (spinners[k]) spinners[k].style.display = "none";
    var s = doc.createElement("style");
    s.textContent = ".bottom-nav{display:none !important} body{animation:none !important} html,body{touch-action:pan-y;overscroll-behavior-x:none}";
    doc.head.appendChild(s);
    // Links to other tabs slide instead of reloading
    doc.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a[href]");
      if (!a || a.target === "_blank") return;
      var u; try { u = new URL(a.href, win.location.href); } catch (err) { return; }
      if (u.origin !== location.origin) return;
      var i = tabFromName(nameOf(u.pathname));
      if (i >= 0) { e.preventDefault(); slideTo(i); }
    }, true);
    gestures(win);
  }

  links.forEach(function (a, k) {
    a.addEventListener("click", function (e) { e.preventDefault(); slideTo(k); });
  });
  window.addEventListener("popstate", function () {
    var k = tabFromName(location.hash.slice(1));
    if (k >= 0) slideTo(k, { push: false });
  });

  current = Math.max(0, tabFromName(location.hash.slice(1)));
  ensure(current); idle(); updateNav();
  history.replaceState({}, "", "#" + TABS[current][0]);
  window.addEventListener("load", function () {
    TABS.forEach(function (t, k) { setTimeout(function () { ensure(k); }, 200 + k * 150); });
  });
})();
</script>

</body>
</html>
