<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kelas - Attendreem</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="theme-color" content="#14162B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=20261030s">
<script src="js/theme.js?v=20261030s"></script>
<script src="js/lang.js?v=20261030s"></script>
<script src="js/toast.js?v=20261030s"></script>
</head>

<body class="v2-page">

<main class="v2-wrap v3-page tc-page">

    <header class="v2-head v3-head">
        <h1 id="tcTitle">Kelas</h1>
    </header>

    <div class="tc-classes" id="tcClasses" role="tablist"></div>

    <label class="tc-search">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input type="search" id="tcQ" autocomplete="off" spellcheck="false" placeholder="Cari siswa">
    </label>

    <p class="tc-sum" id="tcSum">&nbsp;</p>
    <div class="tc-list" id="tcList"><div class="tc-empty">&nbsp;</div></div>

</main>

<nav class="bottom-nav" id="mainNav"></nav>
<script src="js/nav.js?v=20261030s"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20261030s"></script>
<script src="js/auth.js?v=20261030s"></script>
<script src="js/teacher-core.js?v=20261030s"></script>
<script>
const L = TC.L;
document.getElementById("tcTitle").textContent = L("Kelas", "Classes");
document.getElementById("tcQ").placeholder = L("Cari siswa", "Search students");

let ctx = null, all = [], rec = {}, leave = {}, cur = "", q = "", dayOff = false;
try { cur = sessionStorage.getItem("tc-class") || ""; } catch (e) {}

async function start() {
    ctx = await TC.init();
    if (!ctx) return;
    if (!ctx.classes.length) {
        document.getElementById("tcList").innerHTML = '<div class="tc-empty">' + L("Kamu belum punya kelas. Admin bisa mengatur wali kelas atau jadwal mengajarmu.", "You have no class yet. The admin sets your homeroom or teaching schedule.") + '</div>';
        document.getElementById("tcSum").textContent = "";
        return;
    }
    if (ctx.classes.indexOf(cur) === -1) cur = ctx.classes[0];
    const box = document.getElementById("tcClasses");
    box.hidden = ctx.classes.length < 2;
    box.innerHTML = ctx.classes.map(c => `<button type="button" role="tab" data-c="${escapeHTML(c)}">${escapeHTML(c)}${c === ctx.homeroom ? ' <small>' + L("wali", "homeroom") + '</small>' : ""}</button>`).join("");
    all = await TC.students(ctx.classes);
    if (ctx.homeroom) {
        const ids = all.filter(s => s.class === ctx.homeroom).map(s => s.id);
        let rules;
        [rec, leave, rules] = await Promise.all([TC.today(ids), TC.pendingLeave(), attDayRules(ctx.homeroom)]);
        dayOff = !attDayOpen(localDateStr(), rules);
    }
    render();
}

function render() {
    document.querySelectorAll("#tcClasses button").forEach(b => { const on = b.dataset.c === cur; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
    const mine = cur === ctx.homeroom;
    const inClass = all.filter(s => s.class === cur);
    const needle = q.toLowerCase();
    const list = needle ? inClass.filter(s => (s.name || "").toLowerCase().includes(needle) || String(s.nis || "").includes(needle)) : inClass;
    const hadir = inClass.filter(s => rec[s.id] && rec[s.id].status === "Hadir").length;
    document.getElementById("tcSum").textContent = inClass.length + " " + L("siswa", "students") + (mine ? (dayOff ? " · " + L("hari ini libur", "no school today") : " · " + hadir + " " + L("hadir hari ini", "present today")) : " · " + L("kelas yang kamu ajar", "a class you teach"));
    const box = document.getElementById("tcList");
    if (!list.length) { box.innerHTML = '<div class="tc-empty">' + (needle ? L("Tidak ada siswa bernama itu", "No student by that name") : L("Belum ada siswa di kelas ini", "No students in this class yet")) + '</div>'; return; }
    const chev = '<svg class="tc-go" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
    box.innerHTML = list.map(s => `<a class="tc-row" href="teacher-student.html?id=${encodeURIComponent(s.id)}"><span class="tc-av">${TC.letter(s.name)}</span><b>${escapeHTML(s.name || "-")}</b>${mine ? (dayOff && !rec[s.id] ? '<span class="tc-pill">' + L("Libur", "Day off") + '</span>' : TC.badge(rec[s.id], leave[s.id])) : chev}</a>`).join("");
}

document.getElementById("tcClasses").addEventListener("click", function (e) {
    const b = e.target.closest("button[data-c]");
    if (!b) return;
    cur = b.dataset.c;
    try { sessionStorage.setItem("tc-class", cur); } catch (err) {}
    render();
});
document.getElementById("tcQ").addEventListener("input", function () { q = this.value.trim(); render(); });
window.addEventListener("tabshow", function () { if (ctx) start(); });
start();
</script>
</body>
</html>
