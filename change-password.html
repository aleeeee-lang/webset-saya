<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password - Attendreem</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="theme-color" content="#14162B">
<link rel="stylesheet" href="style.css?v=20261010f">
<script src="js/theme.js?v=20261010f"></script>
<script src="js/lang.js?v=20261010f"></script>
<script src="js/toast.js?v=20261010f"></script>
</head>

<body>

<main class="attendance-page">

    <section class="attendance-intro" style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
        <button type="button" onclick="goBack()" aria-label="Back" style="width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:10px;background:transparent;color:#20243a;cursor:pointer;padding:0">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <h2 style="margin:0" data-i18n="page_change_password">Change Password</h2>
    </section>

    <section class="attendance-card">

        <div class="card-label" data-i18n="label_new_password">New Password</div>
        <div style="position:relative;margin-bottom:10px">
            <input type="password" id="newPass" class="am-field" data-i18n-placeholder="placeholder_new_password" placeholder="At least 6 characters" style="width:100%;box-sizing:border-box;padding:12px 44px 12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <button type="button" onclick="togglePasswordVisibility('newPass', this)" aria-label="Show password" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#888;padding:0">
                <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 12C1 12 5 5 12 5C19 5 23 12 23 12C23 12 19 19 12 19C5 19 1 12 1 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
        </div>

        <div class="card-label" data-i18n="label_confirm_new_password">Confirm New Password</div>
        <div style="position:relative">
            <input type="password" id="confirmPass" class="am-field" data-i18n-placeholder="placeholder_confirm_password" placeholder="Repeat new password" style="width:100%;box-sizing:border-box;padding:12px 44px 12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <button type="button" onclick="togglePasswordVisibility('confirmPass', this)" aria-label="Show password" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#888;padding:0">
                <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 12C1 12 5 5 12 5C19 5 23 12 23 12C23 12 19 19 12 19C5 19 1 12 1 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
        </div>

    </section>

    <button type="button" class="submit-button" id="savePassBtn" onclick="savePassword()" data-i18n="btn_save_new_password">
        Save New Password
    </button>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20261010f"></script>
<script src="js/auth.js?v=20261010f"></script>

<script>

function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const isHidden = input.type === "password";
    input.type = isHidden ? "text" : "password";
    btn.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
    btn.innerHTML = isHidden
        ? '<svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10.6 5.1C11.05 5.03 11.52 5 12 5C19 5 23 12 23 12C23 12 21.8 14.1 19.5 15.9M6.5 6.5C3.5 8.4 1 12 1 12C1 12 5 19 12 19C13.9 19 15.5 18.5 16.9 17.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 9.9C9.3 10.5 9 11.2 9 12C9 13.7 10.3 15 12 15C12.8 15 13.5 14.7 14.1 14.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 3L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
        : '<svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 12C1 12 5 5 12 5C19 5 23 12 23 12C23 12 19 19 12 19C5 19 1 12 1 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>';
}

async function savePassword() {

    const newPass = document.getElementById("newPass").value;
    const confirmPass = document.getElementById("confirmPass").value;
    const btn = document.getElementById("savePassBtn");

    const lang = getLang();

    if (!newPass || newPass.length < 6) {
        showToast(translations.toast_password_min_length[lang], "error");
        return;
    }

    if (newPass !== confirmPass) {
        showToast(translations.toast_password_mismatch[lang], "error");
        return;
    }

    btn.disabled = true;
    btn.textContent = translations.btn_saving[lang];

    const { error } = await supabaseClient.auth.updateUser({ password: newPass });

    if (error) {
        showToast(translations.toast_password_update_failed[lang] + error.message, "error");
        btn.disabled = false;
        btn.textContent = translations.btn_save_new_password[lang];
        return;
    }

    showToast(translations.toast_password_update_success[lang], "success");
    setTimeout(function () {
        window.location.href = "settings.html";
    }, 900);

}

requireLogin();

function goBack() {
    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        history.back();
    } else {
        window.location.href = "settings.html";
    }
}

</script>

</body>
</html>
