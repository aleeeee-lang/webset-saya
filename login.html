<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Attendreem</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="theme-color" content="#14162B">
<link rel="stylesheet" href="style.css?v=20261010f">
<script src="js/theme.js?v=20261010f"></script>
<script src="js/lang.js?v=20261010f"></script>
<script src="js/toast.js?v=20261010f"></script>
<style>
html, body { margin: 0; padding: 0 !important; min-height: 100%; background: #14162B; font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
.lg { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; }
.lg-top { flex: 1; color: #fff; padding: 28px 24px 32px; display: flex; flex-direction: column; gap: 24px; justify-content: center; }
.lg-brand { display: flex; align-items: center; gap: 10px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800; }
.lg-logo-img { width: 40px; height: 40px; border-radius: 12px; display: block; box-shadow: 0 0 0 1px #2E3150; }
.lg-logo { width: 40px; height: 40px; border-radius: 14px; background: #C6F432; color: #14162B; display: flex; align-items: center; justify-content: center; }
.lg-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lg-tile { border-radius: 20px; padding: 12px; height: 84px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; background: #1D2038; color: #fff; font-size: 12px; font-weight: 700; }
.lg-tile svg { color: #C6F432; }
.lg-tile.lime { background: #C6F432; color: #14162B; }
.lg-tile.lime svg { color: #14162B; }
.lg h1 { margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; line-height: 1.02; font-weight: 800; letter-spacing: -.03em; }
.lg-sub { margin: 10px 0 0; font-size: 14px; color: #A9ACC6; }
.lg-sheet { background: #fff; border-radius: 32px 32px 0 0; padding: 24px 24px 32px; display: flex; flex-direction: column; gap: 12px; }
.login-field label { display: block; font-size: 12px; font-weight: 700; color: #14162B; margin-bottom: 6px; }
.login-field input { width: 100%; box-sizing: border-box; height: 52px; padding: 0 16px; border: 1.5px solid #E4E5EC; border-radius: 16px; font-family: inherit; font-size: 15px; background: #F7F7FA; color: #14162B; outline: none; }
.login-field input:focus { border-color: #14162B; background: #fff; }
.pwd-wrap { position: relative; }
.pwd-wrap input { padding-right: 46px; }
.pwd-eye { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #8A8FA8; background: none; border: none; padding: 0; display: flex; }
.lg-brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.lg-lang { display: flex; gap: 4px; background: #1D2038; border-radius: 12px; padding: 3px; }
.lg-lang button { height: 30px; min-width: 38px; border: none; border-radius: 9px; background: transparent; color: #A9ACC6; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
.lg-lang button.on { background: #C6F432; color: #14162B; }
html[data-theme="dark"] .lg-lang { background: #1C1C1E; }
.login-btn { width: 100%; height: 56px; margin-top: 4px; border: none; border-radius: 18px; background: #14162B; color: #fff; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px; }
.login-btn .arr { width: 40px; height: 40px; border-radius: 14px; background: #C6F432; color: #14162B; display: flex; align-items: center; justify-content: center; }
.login-btn.plain { justify-content: center; background: #fff; color: #14162B; border: 1.5px solid #E4E5EC; }
.login-btn:disabled { opacity: 0.6; cursor: default; }
.lg-forgot { display: block; width: 100%; text-align: center; background: none; border: none; color: #3F6212; font-family: inherit; font-size: 13px; font-weight: 700; margin-top: 2px; cursor: pointer; padding: 6px; }
#forgotPanel { margin-top: 4px; padding-top: 14px; border-top: 1px solid #EEEEF3; flex-direction: column; gap: 12px; }
html, body { }
html[data-theme="dark"], html[data-theme="dark"] body { background: #000000; }
html[data-theme="dark"] .lg-tile { background: #1C1C1E; }
html[data-theme="dark"] .lg-tile.lime { background: #C6F432; }
html[data-theme="dark"] .lg-sheet { background: #121212; }
html[data-theme="dark"] .login-field label { color: #EDEDED; }
html[data-theme="dark"] .login-field input { background: #0A0A0A; border-color: #2C2C2E; color: #EDEDED; }
html[data-theme="dark"] .login-field input:focus { border-color: #C6F432; }
html[data-theme="dark"] .login-btn { background: #262628; }
html[data-theme="dark"] .login-btn.plain { background: transparent; color: #EDEDED; border-color: #2C2C2E; }
html[data-theme="dark"] .lg-forgot { color: #C6F432; }
html[data-theme="dark"] #forgotPanel { border-color: #242424; }

/* Intro animation for the login headline */
.lg-word { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .08em; margin-bottom: -.08em; }
.lg-word > span { display: inline-block; transform: translateY(105%); opacity: 0; }
.lg-anim .lg-word > span { animation: lgUp 1.1s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i) * 220ms + 500ms); }
.lg-hl { position: relative; display: inline-block; }
.lg-hl::after { content: ""; position: absolute; left: 0; right: 0; bottom: -.06em; height: .13em; border-radius: 999px; background: #C6F432; transform: scaleX(0); transform-origin: left; z-index: -1; }
.lg-anim .lg-hl::after { animation: lgSweep 1s cubic-bezier(.4,0,.2,1) forwards; animation-delay: var(--hl, 700ms); }
#lgTitle { position: relative; z-index: 0; }
.lg-fade { opacity: 0; transform: translateY(10px); }
.lg-anim .lg-fade { animation: lgFade .9s ease forwards; animation-delay: var(--d, 0ms); }
@keyframes lgUp { to { transform: translateY(0); opacity: 1; } }
@keyframes lgSweep { to { transform: scaleX(1); } }
@keyframes lgFade { to { opacity: 1; transform: none; } }
.lg-anim .lg-tile.lg-fade.lg-tile-in { animation: lgTile 1.4s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d, 0ms); }
.lg-tile.lg-fade.lg-tile-in { transform: translateY(18px) scale(.96); }
@keyframes lgTile { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .lg-word > span, .lg-fade { transform: none !important; opacity: 1 !important; animation: none !important; }
  .lg-hl::after { transform: scaleX(1) !important; animation: none !important; }
}
</style>
</head>

<body>

<div class="lg">
    <section class="lg-top">
        <div class="lg-brand-row"><div class="lg-brand"><img class="lg-logo-img" src="favicon.svg?v=2" alt="" width="40" height="40">Attendreem</div><div class="lg-lang" role="group" aria-label="Language"><button type="button" data-lang="id" onclick="setLang('id');lgLangUI();lgIntro()">ID</button><button type="button" data-lang="en" onclick="setLang('en');lgLangUI();lgIntro()">EN</button></div></div>
        <div class="lg-tiles" aria-hidden="true" id="lgTiles">
            <div class="lg-tile"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><span data-i18n="login_tile_checkin">Absen</span></div>
            <div class="lg-tile"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg><span data-i18n="login_tile_savings">Tabungan</span></div>
            <div class="lg-tile lime"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span data-i18n="login_tile_goals">Target</span></div>
        </div>
        <div>
            <h1 id="lgTitle"><span data-i18n="login_title_1">Absensi sekolah,</span><br><span data-i18n="login_title_2" class="lg-hl">tanpa kertas.</span></h1>
            <p class="lg-sub lg-fade" data-i18n="login_sub">Masuk dengan akun dari sekolahmu.</p>
        </div>
    </section>

    <section class="lg-sheet">
        <div class="login-field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="nama@sekolah.id" autocomplete="email">
        </div>

        <div class="login-field">
            <label for="password" data-i18n="login_password">Kata sandi</label>
            <div class="pwd-wrap">
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
                <button type="button" class="pwd-eye" id="togglePwd" aria-label="Show password">
                    <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none">
                        <path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                    </svg>
                </button>
            </div>
        </div>

        <button type="button" class="login-btn" id="loginBtn" onclick="loginUser()"><span id="loginBtnLabel" data-i18n="login_btn">Masuk</span><span class="arr"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>

        <button type="button" class="lg-forgot" id="forgotPwdLink" onclick="toggleForgotPanel()" data-i18n="login_forgot">Lupa kata sandi?</button>

        <div id="forgotPanel" style="display:none">
            <div class="login-field">
                <label for="forgotEmail" data-i18n="login_forgot_label">Masukkan email untuk menerima tautan reset</label>
                <input type="email" id="forgotEmail" placeholder="nama@sekolah.id">
            </div>
            <button type="button" class="login-btn plain" id="forgotBtn" onclick="sendResetEmail()" data-i18n="login_send_reset">Kirim tautan reset</button>
        </div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20261010f"></script>

<script>

try { localStorage.removeItem("attendreem-profile"); } catch (e) {}

function lgT(key) {
    const e = translations[key];
    return (e && e[getLang()]) || key;
}

function lgLangUI() {
    const lang = getLang();
    document.documentElement.lang = lang;
    document.querySelectorAll(".lg-lang button").forEach(function (b) { b.classList.toggle("on", b.dataset.lang === lang); });
}
lgLangUI();

function lgIntro() {
    const title = document.getElementById("lgTitle");
    if (!title) return;
    title.classList.remove("lg-anim");
    let i = 0;
    title.querySelectorAll("[data-i18n]").forEach(function (line) {
        const words = (line.textContent || "").trim().split(/\s+/);
        line.innerHTML = "";
        words.forEach(function (w, k) {
            const outer = document.createElement("span");
            outer.className = "lg-word";
            const inner = document.createElement("span");
            inner.textContent = w;
            inner.style.setProperty("--i", i++);
            outer.appendChild(inner);
            line.appendChild(outer);
            if (k < words.length - 1) line.appendChild(document.createTextNode(" "));
        });
    });
    title.style.setProperty("--hl", (i * 220 + 1100) + "ms");
    const sub = document.querySelector(".lg-sub");
    if (sub) sub.style.setProperty("--d", (i * 220 + 1500) + "ms");
    document.querySelectorAll("#lgTiles .lg-tile").forEach(function (t, k) {
        t.classList.add("lg-fade");
        t.style.setProperty("--d", (k * 450) + "ms");
        t.classList.add("lg-tile-in");
        t.parentNode.classList.remove("lg-anim");
    });
    void title.offsetWidth;
    title.classList.add("lg-anim");
    if (sub) { sub.parentNode.classList.remove("lg-anim"); void sub.offsetWidth; sub.parentNode.classList.add("lg-anim"); }
    const tiles = document.getElementById("lgTiles");
    if (tiles) { void tiles.offsetWidth; tiles.classList.add("lg-anim"); }
}

document.addEventListener("DOMContentLoaded", function () { setTimeout(lgIntro, 0); });

if (new URLSearchParams(window.location.search).get("inactive") === "1") {
    showToast(lgT("login_inactive"), "error");
}

document.getElementById("togglePwd").addEventListener("click", function () {
    const pwd = document.getElementById("password");
    const isHidden = pwd.type === "password";
    pwd.type = isHidden ? "text" : "password";

    document.getElementById("eyeIcon").innerHTML = isHidden
        ? '<path d="M3 3L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.9 5.1C10.6 5 11.3 5 12 5C18.5 5 22 12 22 12C21.5 13 20.6 14.3 19.3 15.5M6.7 6.7C4 8.3 2 12 2 12C2 12 5.5 19 12 19C13.7 19 15.2 18.6 16.4 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 14.1C9.3 13.5 9 12.8 9 12C9 10.3 10.3 9 12 9C12.8 9 13.5 9.3 14.1 9.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
        : '<path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>';
});

function toggleForgotPanel() {
    const panel = document.getElementById("forgotPanel");
    const isHidden = panel.style.display === "none";
    panel.style.display = isHidden ? "flex" : "none";
    if (isHidden) {
        document.getElementById("forgotEmail").value = document.getElementById("email").value;
        document.getElementById("forgotEmail").focus();
    }
}

async function sendResetEmail() {
    const email = document.getElementById("forgotEmail").value.trim();
    const btn = document.getElementById("forgotBtn");

    if (!email) {
        showToast(lgT("login_need_email"), "error");
        return;
    }

    btn.disabled = true;
    btn.textContent = lgT("login_sending");

    const redirectTo = window.location.href.replace(/login\.html.*$/, "reset-password.html");

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: redirectTo
    });

    btn.disabled = false;
    btn.textContent = lgT("login_send_reset");

    if (error) {
        showToast(lgT("login_reset_failed") + error.message, "error");
        return;
    }

    showToast(lgT("login_reset_sent"), "success");
}

async function loginUser() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("loginBtn");

    if (!email || !password) {
        showToast(lgT("login_need_both"), "error");
        return;
    }

    btn.disabled = true;
    document.getElementById("loginBtnLabel").textContent = lgT("login_processing");

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        console.error(error);
        showToast(lgT("login_failed") + error.message, "error");
        btn.disabled = false;
        document.getElementById("loginBtnLabel").textContent = lgT("login_btn");
        return;
    }

    const { data: profile, error: profileError } = await supabaseClient
        .from("profiles")
        .select("role, status")
        .eq("id", data.user.id)
        .single();

    if (profileError || !profile) {
        console.error("Profile not found:", profileError);
        showToast(lgT("login_no_profile"), "error");
        btn.disabled = false;
        document.getElementById("loginBtnLabel").textContent = lgT("login_btn");
        return;
    }

    if (profile.status === "inactive") {
        await supabaseClient.auth.signOut();
        showToast(lgT("login_inactive"), "error");
        btn.disabled = false;
        document.getElementById("loginBtnLabel").textContent = lgT("login_btn");
        return;
    }

    if (profile.role === "admin") {
        window.location.href = "index.html";
    } else if (profile.role === "orangtua") {
        window.location.href = "parent.html";
    } else if (profile.role === "guru") {
        window.location.href = "teacher.html";
    } else {
        window.location.href = "index.html";
    }

}

</script>

</body>
</html>
