<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Attendly</title>
<link rel="stylesheet" href="style.css">
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<style>
    html, body { margin: 0; padding: 0; min-height: 100%; background: linear-gradient(135deg, #6861ff, #8d6bff); }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6861ff, #8d6bff); padding: 20px; box-sizing: border-box; }
    .login-card { width: 100%; max-width: 360px; background: #fff; border-radius: 24px; padding: 32px 28px; box-shadow: 0 20px 50px rgba(0,0,0,.15); box-sizing: border-box; }
    .login-logo { width: 56px; height: 56px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: linear-gradient(135deg, #6861ff, #8d6bff); color: #fff; font-size: 24px; font-weight: bold; }
    .login-brand { text-align: center; font-size: 20px; font-weight: 700; color: #20243a; margin-bottom: 4px; }
    .login-tagline { text-align: center; font-size: 13px; color: #888; margin-bottom: 28px; }
    .login-field { margin-bottom: 14px; }
    .login-field label { display: block; font-size: 12px; color: #64748b; margin-bottom: 6px; font-weight: 600; }
    .login-field input { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 14px; background: #fafafa; }
    .login-btn { width: 100%; padding: 13px; margin-top: 6px; border: none; border-radius: 12px; background: linear-gradient(135deg, #6861ff, #8d6bff); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(99,91,255,.25); }
    .login-btn:disabled { opacity: 0.6; cursor: default; }
</style>
</head>

<body>

<div class="login-wrap">
    <div class="login-card">

        <div class="login-logo">A</div>
        <div class="login-brand">Attendly</div>
        <div class="login-tagline" id="pageTagline">Set your new password</div>

        <div id="formArea">
            <div class="login-field">
                <label for="newPass">New Password</label>
                <input type="password" id="newPass" placeholder="At least 6 characters">
            </div>

            <div class="login-field">
                <label for="confirmPass">Confirm New Password</label>
                <input type="password" id="confirmPass" placeholder="Repeat new password">
            </div>

            <button type="button" class="login-btn" id="saveBtn" onclick="savePassword()">
                Save New Password
            </button>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>

let recoveryReady = false;

// Supabase puts the recovery token in the URL hash and fires this event
// once it has turned that into a temporary logged-in session.
supabaseClient.auth.onAuthStateChange(function (event, session) {
    if (event === "PASSWORD_RECOVERY") {
        recoveryReady = true;
    }
});

// Fallback: if the link already produced a session before this listener
// attached, allow the form once a session is confirmed.
(async function () {
    const { data } = await supabaseClient.auth.getSession();
    if (data && data.session) {
        recoveryReady = true;
    } else {
        setTimeout(async function () {
            const { data: retry } = await supabaseClient.auth.getSession();
            if (!retry || !retry.session) {
                document.getElementById("pageTagline").textContent = "This reset link is invalid or has expired.";
                document.getElementById("formArea").style.display = "none";
            }
        }, 1500);
    }
})();

async function savePassword() {

    const newPass = document.getElementById("newPass").value;
    const confirmPass = document.getElementById("confirmPass").value;
    const btn = document.getElementById("saveBtn");

    if (!newPass || newPass.length < 6) {
        showToast("Password must be at least 6 characters.", "error");
        return;
    }

    if (newPass !== confirmPass) {
        showToast("Passwords do not match.", "error");
        return;
    }

    btn.disabled = true;
    btn.textContent = "Saving...";

    const { error } = await supabaseClient.auth.updateUser({ password: newPass });

    if (error) {
        showToast("Failed to update password: " + error.message, "error");
        btn.disabled = false;
        btn.textContent = "Save New Password";
        return;
    }

    showToast("Password updated. You can log in now.", "success");

    setTimeout(async function () {
        await supabaseClient.auth.signOut();
        window.location.href = "login.html";
    }, 1200);
}

</script>

</body>
</html>
