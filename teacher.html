<script>
const L = TC.L;
document.getElementById("tcQrLabel").textContent = L("Kirim QR absen", "Send check-in QR");
document.getElementById("tcAllLink").textContent = L("Lihat semua siswa", "All students");
[["tcT1", "Beri tugas", "Give a task"], ["tcT2", "Jadwal mengajar", "Teaching schedule"], ["tcT3", "Kas kelas", "Class cash"], ["tcT4", "Juara kelas", "Champions"]].forEach(function (x) { document.getElementById(x[0]).textContent = L(x[1], x[2]); });

let ctx = null;

async function start() {
    ctx = await TC.init();
    if (!ctx) return;
    const p = ctx.profile;
    const av = document.getElementById("tcAvatar");
    if (p.avatar_url) av.innerHTML = '<img src="' + escapeHTML(p.avatar_url) + '" alt="">';
    else av.textContent = ((p.name || "?").trim().charAt(0) || "?").toUpperCase();
    document.getElementById("tcName").textContent = p.name || "";
    document.getElementById("tcRole").textContent = ctx.homeroom ? L("Wali kelas ", "Homeroom ") + ctx.homeroom : L("Guru", "Teacher");
    if (window.Champs) Champs.home(document.getElementById("teachChamps"), { userId: ctx.user.id, cls: ctx.homeroom });
    await Promise.all([loadClass(), loadLeaveBanner()]);
}

async function loadClass() {
    document.getElementById("tcDate").textContent = (ctx.homeroom ? L("Absensi ", "Attendance ") + ctx.homeroom + " · " : "") + TC.dateLong();
    if (!ctx.homeroom) {
        // no class of their own: nothing to count, the QR and the lists still work
        document.getElementById("tcHadir").textContent = ctx.classes.length;
        document.getElementById("tcOf").textContent = " " + L("kelas diajar", ctx.classes.length === 1 ? "class taught" : "classes taught");
        document.querySelector(".tc-bar").hidden = true;
        document.getElementById("tcAllLink").textContent = L("Lihat kelas", "Classes");
        return;
    }
    const studs = await TC.students([ctx.homeroom]);
    const ids = studs.map(s => s.id);
    const [rec, leave, rules] = await Promise.all([TC.today(ids), TC.pendingLeave(), attDayRules(ctx.homeroom)]);
    // not a school day for this class (weekend / agenda day off): nobody is "missing"
    const today = localDateStr();
    const open = attDayOpen(today, rules);
    const hadir = studs.filter(s => rec[s.id] && rec[s.id].status === "Hadir").length;
    const izin = studs.filter(s => rec[s.id] && (rec[s.id].status === "Izin" || rec[s.id].status === "Sakit")).length;
    const miss = open ? studs.filter(s => !rec[s.id]) : [];
    document.getElementById("tcHadir").textContent = hadir;
    document.getElementById("tcOf").textContent = " / " + studs.length + " " + L("hadir", "present");
    requestAnimationFrame(() => { document.getElementById("tcBar").style.width = (studs.length ? Math.round(hadir / studs.length * 100) : 0) + "%"; });
    const chips = [];
    if (izin) chips.push('<span>' + izin + " " + L("izin / sakit", "leave / sick") + '</span>');
    if (miss.length) chips.push('<span class="warn">' + miss.length + " " + L("belum absen", "not checked in") + '</span>');
    document.getElementById("tcChips").innerHTML = chips.join("");

    const head = document.getElementById("tcMissHead"), list = document.getElementById("tcMiss");
    head.hidden = false; list.hidden = false;
    if (!open) {
        const ag = rules.agenda[today];
        document.getElementById("tcChips").innerHTML = '<span>' + escapeHTML(L("Hari ini libur", "No school today") + (ag && ag.label ? " · " + ag.label : "")) + '</span>';
        document.getElementById("tcMissTitle").textContent = L("Kelasmu", "Your class");
        list.innerHTML = '<div class="tc-empty">' + L("Hari ini bukan hari absen untuk kelas ini", "Today isn't a check-in day for this class") + '</div>';
        return;
    }
    document.getElementById("tcMissTitle").textContent = studs.length ? L("Belum absen · ", "Not checked in · ") + miss.length : L("Kelasmu", "Your class");
    if (!studs.length) { list.innerHTML = '<div class="tc-empty">' + L("Belum ada siswa di kelas ini", "No students in this class yet") + '</div>'; return; }
    if (!miss.length) { list.innerHTML = '<div class="tc-empty ok">' + L("Semua siswa sudah tercatat hari ini", "Everyone is recorded today") + '</div>'; return; }
    const shown = miss.slice(0, 6);
    list.innerHTML = shown.map(s => `<a class="tc-row" href="teacher-student.html?id=${encodeURIComponent(s.id)}"><span class="tc-av">${TC.letter(s.name)}</span><b>${escapeHTML(s.name || "-")}</b>${TC.badge(null, leave[s.id])}</a>`).join("") +
        (miss.length > shown.length ? `<a class="tc-row more" href="teacher-class.html">${L("+" + (miss.length - shown.length) + " siswa lagi", "+" + (miss.length - shown.length) + " more")}</a>` : "");
}

async function loadLeaveBanner() {
    const { data } = await supabaseClient.from("leave_requests").select("name, type").eq("status", "pending").neq("user_id", ctx.user.id).order("created_at", { ascending: false }).limit(50);
    const b = document.getElementById("tlBanner");
    if (!data || !data.length) { b.hidden = true; return; }
    document.getElementById("tlBannerT").textContent = data.length + L(" pengajuan izin menunggu", data.length > 1 ? " leave requests waiting" : " leave request waiting");
    document.getElementById("tlBannerS").textContent = data.slice(0, 3).map(r => (r.name || "-") + " · " + (r.type === "Sakit" ? L("Sakit", "Sick") : L("Izin", "Leave"))).join(", ") + (data.length > 3 ? "…" : "");
    b.hidden = false;
}

window.addEventListener("tabshow", function () { if (ctx) { loadClass(); loadLeaveBanner(); } });
start();
</script>

<script src="js/live-sessions.js?v=20261031c"></script>
