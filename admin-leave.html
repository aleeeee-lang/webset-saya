<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Requests - Attendreem</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css?v=20261010c">
<script src="js/theme.js?v=20261010c"></script>
<script src="js/lang.js?v=20261010c"></script>
<script src="js/toast.js?v=20261010c"></script>
</head>

<body>

<main class="attendance-page">

    <section class="attendance-intro" style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
        <button type="button" onclick="goBack()" aria-label="Back" style="width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:10px;background:transparent;color:#20243a;cursor:pointer;padding:0">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <h2 style="margin:0" data-i18n="page_manage_leave">Leave Requests</h2>
    </section>

    <!-- PENDING REQUESTS -->
    <section class="attendance-card">
        <div class="card-label" data-i18n="label_pending_leave_requests">Pending Requests</div>
        <div id="pendingLeaveList" style="display:flex;flex-direction:column;gap:8px;margin-top:10px"></div>
    </section>

    <!-- REVIEWED HISTORY -->
    <section class="attendance-card" style="margin-top:22px">
        <div class="card-label" data-i18n="label_reviewed_leave_requests">Reviewed</div>
        <div id="reviewedLeaveList" style="display:flex;flex-direction:column;gap:8px;margin-top:10px"></div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20261010c"></script>
<script src="js/auth.js?v=20261010c"></script>

<script>

let currentAdmin = null;
let allLeaveRequests = [];

function weekdayOf(dateStr) {
    const days = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    return days[new Date(dateStr + "T00:00:00").getDay()];
}

function dateRangeArray(startStr, endStr) {
    const dates = [];
    let cur = new Date(startStr + "T00:00:00");
    const end = new Date(endStr + "T00:00:00");
    while (cur <= end) {
        dates.push(localDateStr(cur));
        cur.setDate(cur.getDate() + 1);
    }
    return dates;
}

async function checkAdmin() {
    const user = await requireLogin();
    if (!user) return;
    currentAdmin = user;

    const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

    if (error || !profile || profile.role !== "admin") {
        alert(translations.alert_admin_only[getLang()]);
        window.location.href = "index.html";
        return;
    }

    await loadLeaveRequests();
}

async function loadLeaveRequests() {
    const { data, error } = await supabaseClient
        .from("leave_requests")
        .select("*")
        .order("created_at", { ascending: false });

    if (error || !data) return;

    allLeaveRequests = data;
    renderLeaveLists();
}

function renderLeaveLists() {
    const lang = getLang();
    const pendingContainer = document.getElementById("pendingLeaveList");
    const reviewedContainer = document.getElementById("reviewedLeaveList");

    const pending = allLeaveRequests.filter(function (r) { return r.status === "pending"; });
    const reviewed = allLeaveRequests.filter(function (r) { return r.status !== "pending"; });

    if (pending.length === 0) {
        pendingContainer.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_no_pending_leave[lang] + "</p>";
    } else {
        pendingContainer.innerHTML = pending.map(function (r) {
            const typeLabel = r.type === "Sakit" ? translations.status_sick[lang] : translations.status_permission[lang];
            const dateRange = r.start_date === r.end_date ? r.start_date : (r.start_date + " - " + r.end_date);
            return `
                <div class="am-row" style="display:flex;flex-direction:column;gap:8px;padding:12px;background:#f8f8ff;border-radius:12px">
                    <div>
                        <strong style="display:block;font-size:14px;color:#20243a">${r.name || "-"} <span style="color:#888;font-weight:400">· ${r.class || "-"}</span></strong>
                        <span style="display:block;margin-top:2px;font-size:12px;color:#888">${typeLabel} · ${dateRange}${r.reason ? " · " + r.reason : ""}</span>
                    </div>
                    <div style="display:flex;gap:8px">
                        <button type="button" class="v2-approve" onclick="reviewLeaveRequest('${r.id}', 'approved')" style="flex:1;border:none;background:#14162B;border-radius:12px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:#fff" data-i18n="btn_approve">Approve</button>
                        <button type="button" class="v2-reject" onclick="reviewLeaveRequest('${r.id}', 'rejected')" style="flex:1;border:none;background:#ECEDF2;border-radius:12px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;color:#B91C1C" data-i18n="btn_reject">Reject</button>
                    </div>
                </div>
            `;
        }).join("");
    }

    if (reviewed.length === 0) {
        reviewedContainer.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_no_reviewed_leave[lang] + "</p>";
    } else {
        reviewedContainer.innerHTML = reviewed.map(function (r) {
            const typeLabel = r.type === "Sakit" ? translations.status_sick[lang] : translations.status_permission[lang];
            const dateRange = r.start_date === r.end_date ? r.start_date : (r.start_date + " - " + r.end_date);
            const statusLabel = translations["badge_leave_" + r.status][lang];
            return `
                <div class="am-row" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#f8f8ff;border-radius:12px">
                    <div style="flex:1;min-width:0">
                        <strong style="display:block;font-size:13px;color:#20243a">${r.name || "-"} <span style="color:#888;font-weight:400">· ${r.class || "-"}</span></strong>
                        <span style="display:block;margin-top:2px;font-size:12px;color:#888">${typeLabel} · ${dateRange}</span>
                    </div>
                    <span class="spp-status-badge ${r.status}">${statusLabel}</span>
                </div>
            `;
        }).join("");
    }
}

async function reviewLeaveRequest(id, decision) {
    const lang = getLang();
    const request = allLeaveRequests.find(function (r) { return r.id === id; });
    if (!request) return;

    if (decision === "approved") {
        const dates = dateRangeArray(request.start_date, request.end_date);

        for (let i = 0; i < dates.length; i++) {
            const date = dates[i];

            const { data: existing } = await supabaseClient
                .from("attendance")
                .select("id")
                .eq("user_id", request.user_id)
                .eq("date", date)
                .maybeSingle();

            const payload = {
                user_id: request.user_id,
                name: request.name,
                class: request.class,
                date: date,
                day: weekdayOf(date),
                status: request.type,
                reason: request.reason || ""
            };

            if (existing) {
                await supabaseClient.from("attendance").update(payload).eq("id", existing.id);
            } else {
                await supabaseClient.from("attendance").insert([payload]);
            }
        }
    }

    const { error } = await supabaseClient
        .from("leave_requests")
        .update({
            status: decision,
            reviewed_by: currentAdmin.id,
            reviewed_at: new Date().toISOString()
        })
        .eq("id", id);

    if (error) {
        showToast(translations.toast_save_failed[lang] + error.message, "error");
        return;
    }

    showToast(decision === "approved" ? translations.toast_leave_approved[lang] : translations.toast_leave_rejected[lang], "success");
    await loadLeaveRequests();
}

checkAdmin();

function goBack() {
    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        history.back();
    } else {
        window.location.href = "settings.html";
    }
}

</script>

</body>
</html>
