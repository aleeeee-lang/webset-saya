<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Savings - Attendreem</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<script src="js/theme.js"></script>
<script src="js/lang.js"></script>
<script src="js/toast.js"></script>
</head>

<body>

<main class="attendance-page">

    <section class="attendance-intro" style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
        <button type="button" onclick="goBack()" aria-label="Back" style="width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:10px;background:transparent;color:#20243a;cursor:pointer;padding:0">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <h2 style="margin:0" data-i18n="page_manage_savings">Manage Savings</h2>
    </section>

    <!-- SELECT STUDENT -->
    <section class="attendance-card">

        <div class="card-label" data-i18n="label_select_student">Select Student</div>

        <select id="studentSelect" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <option value="" data-i18n="option_choose_student">Choose a student...</option>
        </select>

        <div id="studentBalanceBox" style="display:none;margin-top:14px;padding:16px;border-radius:14px;background:#eeeeff">
            <span style="font-size:11px;letter-spacing:1.5px;color:#1309f5" data-i18n="label_current_balance">Current Balance</span>
            <h2 id="studentBalance" style="margin:4px 0 0;font-size:26px;color:#20243a">Rp0</h2>
        </div>

    </section>

    <!-- ADD TRANSACTION -->
    <section class="attendance-card" id="addTransactionCard" style="display:none">

        <div class="card-label" data-i18n="label_transaction_type">Transaction Type</div>

        <div style="display:flex;flex-direction:column;gap:10px">

            <select id="transactionType" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
                <option value="setor" data-i18n="type_setor">Deposit</option>
                <option value="tarik" data-i18n="type_tarik">Withdrawal</option>
            </select>

            <div>
                <div style="font-size:12px;color:#888;margin-bottom:6px" data-i18n="label_amount">Amount (Rp)</div>
                <input type="number" id="transactionAmount" class="am-field" data-i18n-placeholder="placeholder_amount" placeholder="e.g. 10000" min="0" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            </div>

            <div>
                <div style="font-size:12px;color:#888;margin-bottom:6px" data-i18n="label_note_optional">Note (optional)</div>
                <input type="text" id="transactionNote" class="am-field" data-i18n-placeholder="placeholder_savings_note" placeholder="e.g. Weekly savings" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            </div>

            <button type="button" class="submit-button" id="addTransactionBtn" onclick="addTransaction()" style="margin-top:2px" data-i18n="btn_add_transaction">
                Add Transaction
            </button>

        </div>

    </section>

    <!-- TRANSACTION HISTORY -->
    <section class="attendance-card" id="transactionHistoryCard" style="display:none">
        <div class="card-label" data-i18n="label_savings_history">TRANSACTION HISTORY</div>
        <div id="transactionList" style="display:flex;flex-direction:column;gap:8px"></div>
    </section>

    <!-- SPP AMOUNT SETTINGS -->
    <section class="attendance-card" style="margin-top:22px">

        <div class="card-label" data-i18n="label_spp_settings">SPP Amount Settings</div>
        <p style="font-size:12px;color:#888;margin:4px 0 14px" data-i18n="hint_spp_settings">The fixed monthly SPP amount every student needs to pay.</p>

        <div style="display:flex;flex-direction:column;gap:10px">
            <div>
                <div style="font-size:12px;color:#888;margin-bottom:6px" data-i18n="label_spp_monthly_amount">Monthly SPP Amount (Rp)</div>
                <input type="number" id="sppAmountInput" class="am-field" min="0" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            </div>
            <button type="button" class="submit-button" id="saveSppAmountBtn" onclick="saveSppAmount()" data-i18n="btn_save_spp_amount">
                Save Amount
            </button>
        </div>

    </section>

    <!-- SPP PENDING REVIEW -->
    <section class="attendance-card" style="margin-top:22px">

        <div class="card-label" data-i18n="label_spp_pending_review">Pending SPP Verification</div>
        <div id="sppPendingList" style="display:flex;flex-direction:column;gap:8px;margin-top:10px"></div>

    </section>

    <!-- SPP RECENT REVIEWS -->
    <section class="attendance-card" style="margin-top:22px">

        <div class="card-label" data-i18n="label_spp_recent_reviews">Recently Reviewed</div>
        <div id="sppReviewedList" style="display:flex;flex-direction:column;gap:8px;margin-top:10px"></div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

<script>

let allStudents = [];
let allTransactions = [];
let selectedStudentId = "";

async function checkAdmin() {
    const user = await requireLogin();
    if (!user) return;

    const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

    if (error || !profile || profile.role !== "admin") {
        alert(translations.alert_admin_only[getLang()]);
        window.location.href = "index.html";
        return;
    }

    await loadStudents();
    await loadSppAdmin();
}

async function loadStudents() {
    const { data, error } = await supabaseClient
        .from("profiles")
        .select("id,name,class")
        .eq("role", "murid")
        .order("name", { ascending: true });

    if (error || !data) return;

    allStudents = data;

    const select = document.getElementById("studentSelect");
    data.forEach(function (s) {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.name + (s.class ? " · " + s.class : "");
        select.appendChild(opt);
    });
}

/* =========================
   SPP VERIFICATION
========================== */

let sppAmount = 0;
let sppAllPayments = [];

function studentLabel(userId) {
    const s = allStudents.find(function (st) { return st.id === userId; });
    if (!s) return userId;
    return s.name + (s.class ? " · " + s.class : "");
}

function sppPeriodLabelAdmin(period) {
    const d = new Date(period + "-01T00:00:00");
    return monthYearLabel(d);
}

async function loadSppAdmin() {
    const { data: settingsData } = await supabaseClient
        .from("spp_settings")
        .select("amount")
        .eq("id", "global")
        .maybeSingle();

    sppAmount = (settingsData && settingsData.amount) || 0;
    document.getElementById("sppAmountInput").value = sppAmount;

    const { data, error } = await supabaseClient
        .from("spp_payments")
        .select("*")
        .order("submitted_at", { ascending: false });

    if (error || !data) {
        sppAllPayments = [];
    } else {
        sppAllPayments = data;
    }

    renderSppPending();
    renderSppReviewed();
}

async function saveSppAmount() {
    const lang = getLang();
    const amount = Number(document.getElementById("sppAmountInput").value);

    if (!amount || amount <= 0) {
        showToast(translations.toast_enter_valid_spp_amount[lang], "error");
        return;
    }

    const user = await requireLogin();
    if (!user) return;

    const btn = document.getElementById("saveSppAmountBtn");
    btn.disabled = true;

    const { error } = await supabaseClient
        .from("spp_settings")
        .upsert({
            id: "global",
            amount: amount,
            updated_by: user.id,
            updated_at: new Date().toISOString()
        }, { onConflict: "id" });

    btn.disabled = false;

    if (error) {
        showToast(translations.toast_save_failed[lang] + error.message, "error");
        return;
    }

    sppAmount = amount;
    showToast(translations.toast_spp_amount_saved[lang], "success");
}

async function viewSppProof(path) {
    if (!path) return;
    const { data, error } = await supabaseClient.storage
        .from("spp-proofs")
        .createSignedUrl(path, 3600);

    if (error || !data || !data.signedUrl) return;
    window.open(data.signedUrl, "_blank");
}

function renderSppPending() {
    const lang = getLang();
    const container = document.getElementById("sppPendingList");
    const pending = sppAllPayments.filter(function (p) { return p.status === "pending"; });

    if (pending.length === 0) {
        container.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_no_spp_pending[lang] + "</p>";
        return;
    }

    container.innerHTML = pending.map(function (p) {
        const d = new Date(p.submitted_at);
        return `
            <div class="am-row" style="display:flex;align-items:center;gap:10px;padding:12px;background:#f8f8ff;border-radius:12px;flex-wrap:wrap">
                <div style="flex:1;min-width:140px">
                    <strong style="display:block;font-size:14px;color:#20243a">${studentLabel(p.user_id)}</strong>
                    <span style="display:block;margin-top:2px;font-size:12px;color:#888">${sppPeriodLabelAdmin(p.period)} · ${formatRupiah(p.amount)} · ${dayMonthYearLabel(d)}</span>
                    ${p.note ? `<span style="display:block;margin-top:2px;font-size:12px;color:#888">${p.note}</span>` : ""}
                </div>
                <div style="display:flex;gap:6px;flex-shrink:0">
                    <button type="button" class="am-btn" onclick="viewSppProof('${p.proof_url}')" style="border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#20243a">${translations.btn_view_proof[lang]}</button>
                    <button type="button" class="am-btn" onclick="approveSpp('${p.id}')" style="border:1px solid #bbf7d0;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#16a34a">${translations.btn_approve[lang]}</button>
                    <button type="button" class="am-btn" onclick="rejectSpp('${p.id}')" style="border:1px solid #fecaca;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#dc2626">${translations.btn_reject[lang]}</button>
                </div>
            </div>
        `;
    }).join("");
}

function renderSppReviewed() {
    const lang = getLang();
    const container = document.getElementById("sppReviewedList");
    const reviewed = sppAllPayments
        .filter(function (p) { return p.status !== "pending"; })
        .sort(function (a, b) { return new Date(b.reviewed_at || b.submitted_at) - new Date(a.reviewed_at || a.submitted_at); })
        .slice(0, 15);

    if (reviewed.length === 0) {
        container.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_no_spp_reviews[lang] + "</p>";
        return;
    }

    container.innerHTML = reviewed.map(function (p) {
        const isApproved = p.status === "approved";
        const badgeColor = isApproved ? "#16a34a" : "#dc2626";
        const badgeLabel = translations["badge_spp_" + p.status][lang];

        return `
            <div class="am-row" style="display:flex;align-items:center;gap:10px;padding:12px;background:#f8f8ff;border-radius:12px;flex-wrap:wrap">
                <div style="flex:1;min-width:140px">
                    <strong style="display:block;font-size:14px;color:#20243a">${studentLabel(p.user_id)}</strong>
                    <span style="display:block;margin-top:2px;font-size:12px;color:#888">${sppPeriodLabelAdmin(p.period)} · ${formatRupiah(p.amount)}</span>
                    ${p.reject_reason ? `<span style="display:block;margin-top:2px;font-size:12px;color:#888">${p.reject_reason}</span>` : ""}
                </div>
                <span style="font-size:12px;font-weight:700;color:${badgeColor}">${badgeLabel}</span>
            </div>
        `;
    }).join("");
}

async function approveSpp(id) {
    const lang = getLang();
    const user = await requireLogin();
    if (!user) return;

    const { error } = await supabaseClient
        .from("spp_payments")
        .update({
            status: "approved",
            reject_reason: null,
            reviewed_at: new Date().toISOString(),
            reviewed_by: user.id
        })
        .eq("id", id);

    if (error) {
        showToast(translations.toast_spp_review_failed[lang] + error.message, "error");
        return;
    }

    showToast(translations.toast_spp_approved[lang], "success");
    await loadSppAdmin();
}

async function rejectSpp(id) {
    const lang = getLang();
    const reason = prompt(translations.prompt_reject_reason[lang]);
    if (reason === null) return;

    const user = await requireLogin();
    if (!user) return;

    const { error } = await supabaseClient
        .from("spp_payments")
        .update({
            status: "rejected",
            reject_reason: reason || null,
            reviewed_at: new Date().toISOString(),
            reviewed_by: user.id
        })
        .eq("id", id);

    if (error) {
        showToast(translations.toast_spp_review_failed[lang] + error.message, "error");
        return;
    }

    showToast(translations.toast_spp_rejected[lang], "success");
    await loadSppAdmin();
}

function computeBalance(transactions) {
    const totalSetor = transactions.filter(t => t.type === "setor").reduce((sum, t) => sum + Number(t.amount), 0);
    const totalTarik = transactions.filter(t => t.type === "tarik").reduce((sum, t) => sum + Number(t.amount), 0);
    return totalSetor - totalTarik;
}

function renderTransactionList() {
    const container = document.getElementById("transactionList");
    const lang = getLang();

    if (allTransactions.length === 0) {
        container.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_no_transactions_yet[lang] + "</p>";
        return;
    }

    container.innerHTML = allTransactions.map(function (t) {
        const d = new Date(t.created_at);
        const isSetor = t.type === "setor";
        const typeLabel = isSetor ? translations.type_setor[lang] : translations.type_tarik[lang];
        const sign = isSetor ? "+" : "-";

        return `
            <div class="am-row" style="display:flex;align-items:center;gap:12px;padding:12px;background:#f8f8ff;border-radius:12px">
                <div class="savings-type-icon ${t.type}" style="width:38px;height:38px;border-radius:10px;font-size:15px">${isSetor ? "+" : "−"}</div>
                <div style="flex:1;min-width:0">
                    <strong style="display:block;font-size:14px;color:#20243a">${typeLabel}</strong>
                    <span style="display:block;margin-top:2px;font-size:12px;color:#888">${dayMonthYearLabel(d)}${t.note ? " · " + t.note : ""}</span>
                </div>
                <div class="savings-amount ${t.type}" style="font-size:13px;font-weight:700">${sign}${formatRupiah(t.amount)}</div>
                <button type="button" onclick="deleteTransaction('${t.id}')" style="border:none;background:none;color:#dc3545;font-size:12px;font-weight:600;cursor:pointer;padding:6px" data-i18n="btn_delete">Delete</button>
            </div>
        `;
    }).join("");
}

async function loadStudentSavings(studentId) {
    const { data, error } = await supabaseClient
        .from("savings")
        .select("*")
        .eq("student_id", studentId)
        .order("created_at", { ascending: false });

    if (error || !data) {
        allTransactions = [];
    } else {
        allTransactions = data;
    }

    document.getElementById("studentBalance").textContent = formatRupiah(computeBalance(allTransactions));
    renderTransactionList();
}

document.getElementById("studentSelect").addEventListener("change", async function () {
    selectedStudentId = this.value;

    const balanceBox = document.getElementById("studentBalanceBox");
    const addCard = document.getElementById("addTransactionCard");
    const historyCard = document.getElementById("transactionHistoryCard");

    if (!selectedStudentId) {
        balanceBox.style.display = "none";
        addCard.style.display = "none";
        historyCard.style.display = "none";
        return;
    }

    balanceBox.style.display = "block";
    addCard.style.display = "block";
    historyCard.style.display = "block";

    await loadStudentSavings(selectedStudentId);
});

async function addTransaction() {
    const lang = getLang();

    if (!selectedStudentId) {
        showToast(translations.toast_select_student_first[lang], "error");
        return;
    }

    const type = document.getElementById("transactionType").value;
    const amount = Number(document.getElementById("transactionAmount").value);
    const note = document.getElementById("transactionNote").value.trim();
    const btn = document.getElementById("addTransactionBtn");

    if (!amount || amount <= 0) {
        showToast(translations.toast_enter_valid_amount[lang], "error");
        return;
    }

    if (type === "tarik") {
        const currentBalance = computeBalance(allTransactions);
        if (amount > currentBalance) {
            showToast(translations.toast_insufficient_balance[lang], "error");
            return;
        }
    }

    const user = await requireLogin();

    btn.disabled = true;
    btn.textContent = translations.btn_saving[lang];

    const { error } = await supabaseClient
        .from("savings")
        .insert({
            student_id: selectedStudentId,
            type: type,
            amount: amount,
            note: note || null,
            created_by: user.id
        });

    btn.disabled = false;
    btn.textContent = translations.btn_add_transaction[lang];

    if (error) {
        showToast(translations.toast_transaction_failed[lang] + error.message, "error");
        return;
    }

    document.getElementById("transactionAmount").value = "";
    document.getElementById("transactionNote").value = "";
    showToast(translations.toast_transaction_added[lang], "success");
    await loadStudentSavings(selectedStudentId);
}

async function deleteTransaction(id) {
    const lang = getLang();
    if (!confirm(translations.confirm_delete_transaction[lang])) return;

    const { error } = await supabaseClient.from("savings").delete().eq("id", id);

    if (error) {
        showToast(translations.toast_transaction_failed[lang] + error.message, "error");
        return;
    }

    showToast(translations.toast_transaction_deleted[lang], "success");
    await loadStudentSavings(selectedStudentId);
}

checkAdmin();

function goBack() {
    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        history.back();
    } else {
        window.location.href = "settings.html";
    }
}

</script>

</body>
</html>
