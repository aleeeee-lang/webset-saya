<script>
const L = TC.L;
document.getElementById("tcQrLabel").textContent = L("Kirim QR absen", "Send check-in QR");
[["tcT0", "Absen saya", "My check-in"], ["tcT1", "Siswa", "Students"], ["tcT2", "Izin", "Leave"], ["tcT3", "Tugas", "Tasks"], ["tcT5", "Jadwal", "Schedule"], ["tcT6", "Lainnya", "More"]].forEach(function (x) { document.getElementById(x[0]).textContent = L(x[1], x[2]); });

let ctx = null;

async function start() {
    ctx = await TC.init();
    if (!ctx) return;
    const p = ctx.profile;
    const av = document.getElementById("tcAvatar");
    if (p.avatar_url) av.innerHTML = '<img src="' + escapeHTML(p.avatar_url) + '" alt="">';
    else av.textContent = ((p.name || "?").trim().charAt(0) || "?").toUpperCase();
    document.getElementById("tcName").textContent = p.name || "";
    document.getElementById("tcRole").textContent = ctx.homeroom ? L("Wali kelas ", "Homeroom ") + ctx.homeroom : L("Guru", "Teacher");
    await Promise.all([loadClass(), loadLeaveBanner()]);
}

async function loadClass() {
    document.getElementById("tcDate").textContent = (ctx.homeroom ? L("Absensi ", "Attendance ") + ctx.homeroom + " · " : "") + TC.dateLong();
    if (!ctx.homeroom) {
        // no class of their own: nothing to count, the QR and the lists still work
        document.getElementById("tcHadir").textContent = ctx.classes.length;
        document.getElementById("tcOf").textContent = " " + L("kelas diajar", ctx.classes.length === 1 ? "class taught" : "classes taught");
        document.querySelector(".tc-bar").hidden = true;
        return;
    }
    const studs = await TC.students([ctx.homeroom]);
    const ids = studs.map(s => s.id);
    const [rec, rules] = await Promise.all([TC.today(ids), attDayRules(ctx.homeroom)]);
    // not a school day for this class (weekend / agenda day off): nobody is "missing"
    const today = localDateStr();
    const open = attDayOpen(today, rules);
    const hadir = studs.filter(s => rec[s.id] && rec[s.id].status === "Hadir").length;
    const izin = studs.filter(s => rec[s.id] && (rec[s.id].status === "Izin" || rec[s.id].status === "Sakit")).length;
    const miss = open ? studs.filter(s => !rec[s.id]) : [];
    document.getElementById("tcHadir").textContent = hadir;
    document.getElementById("tcOf").textContent = " / " + studs.length + " " + L("hadir", "present");
    requestAnimationFrame(() => { document.getElementById("tcBar").style.width = (studs.length ? Math.round(hadir / studs.length * 100) : 0) + "%"; });
    const chips = [];
    if (izin) chips.push('<span>' + izin + " " + L("izin / sakit", "leave / sick") + '</span>');
    if (miss.length) chips.push('<span class="warn">' + miss.length + " " + L("belum absen", "not checked in") + '</span>');
    document.getElementById("tcChips").innerHTML = chips.join("");

    if (!open) {
        const ag = rules.agenda[today];
        document.getElementById("tcChips").innerHTML = '<span>' + escapeHTML(L("Hari ini libur", "No school today") + (ag && ag.label ? " · " + ag.label : "")) + '</span>';
    } else if (studs.length && !miss.length) {
        document.getElementById("tcChips").innerHTML += '<span class="ok">' + L("Semua sudah tercatat", "Everyone recorded") + '</span>';
    }
    if (!studs.length) document.getElementById("tcChips").innerHTML = '<span>' + L("Belum ada siswa di kelas ini", "No students in this class yet") + '</span>';
}

async function loadLeaveBanner() {
    // waiting leave requests: a small number on the "Izin" tile
    const { count } = await supabaseClient.from("leave_requests").select("id", { count: "exact", head: true }).eq("status", "pending").neq("user_id", ctx.user.id);
    const n = document.getElementById("tcLeaveN");
    n.textContent = count > 99 ? "99+" : (count || "");
    n.hidden = !count;
}

// "Lainnya": the rest of the teacher pages in one small sheet
const MORE = [
    ["kas.html", "Kas kelas", "Class cash", '<rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>'],
    ["juara.html", "Juara", "Champions", '<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4.5v1.5A3.5 3.5 0 0 0 8 11M16 6h3.5v1.5A3.5 3.5 0 0 1 16 11M12 13v4M9.5 17h5l.5 4h-6z"/>'],
    ["goals.html", "Target saya", "My goals", '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'],
    ["calendar.html", "Kalender", "Calendar", '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
    ["information.html", "Informasi", "Information", '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'],
    ["settings.html", "Pengaturan", "Settings", '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>']
];
document.getElementById("tcMore").addEventListener("click", async function () {
    if (!window.attSheet) await new Promise(function (ok) { const sc = document.createElement("script"); sc.src = "js/avatarcrop.js?v=" + (window.attAppVer ? window.attAppVer() : Date.now()); sc.onload = ok; sc.onerror = ok; document.head.appendChild(sc); });
    if (!window.attSheet) { location.href = "calendar.html"; return; }
    const pick = await attSheet({ title: L("Lainnya", "More"), items: MORE.map(function (m) { return { value: m[0], label: L(m[1], m[2]), icon: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + m[3] + '</svg>' }; }) });
    if (pick) location.href = pick;
});

window.addEventListener("tabshow", function () { if (ctx) { loadClass(); loadLeaveBanner(); } });
start();
</script>
