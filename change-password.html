<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password - Attendreem</title>
<link rel="stylesheet" href="style.css">
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
</head>

<body>

<main class="attendance-page">

    <section class="attendance-intro" style="display:flex;align-items:center;gap:12px">
        <button type="button" onclick="goBack()" aria-label="Back" style="width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:10px;background:#f1f1f6;color:#20243a;cursor:pointer;padding:0">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <h2 style="margin:0">Change Password</h2>
    </section>

    <section class="attendance-card">

        <div class="card-label">New Password</div>
        <input type="password" id="newPass" placeholder="At least 6 characters" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px;margin-bottom:10px">

        <div class="card-label">Confirm New Password</div>
        <input type="password" id="confirmPass" placeholder="Repeat new password" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">

    </section>

    <button type="button" class="submit-button" id="savePassBtn" onclick="savePassword()">
        Save New Password
    </button>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

<script>

async function savePassword() {

    const newPass = document.getElementById("newPass").value;
    const confirmPass = document.getElementById("confirmPass").value;
    const btn = document.getElementById("savePassBtn");

    if (!newPass || newPass.length < 6) {
        showToast("Password must be at least 6 characters.", "error");
        return;
    }

    if (newPass !== confirmPass) {
        showToast("Passwords do not match.", "error");
        return;
    }

    btn.disabled = true;
    btn.textContent = "Saving...";

    const { error } = await supabaseClient.auth.updateUser({ password: newPass });

    if (error) {
        showToast("Failed to update password: " + error.message, "error");
        btn.disabled = false;
        btn.textContent = "Save New Password";
        return;
    }

    showToast("Password updated successfully.", "success");
    setTimeout(function () {
        window.location.href = "settings.html";
    }, 900);

}

requireLogin();

function goBack() {
    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        history.back();
    } else {
        window.location.href = "settings.html";
    }
}

let pageTouchStartX = 0;

document.addEventListener("touchstart", function (event) {
    pageTouchStartX = event.changedTouches[0].screenX;
});

document.addEventListener("touchend", function (event) {
    const touchEndX = event.changedTouches[0].screenX;
    if (touchEndX - pageTouchStartX > 80) {
        goBack();
    }
});

</script>

</body>
</html>
