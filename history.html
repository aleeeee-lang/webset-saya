    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

     <script>
const statusIcon = { Hadir: "✓", Izin: "!", Sakit: "+", Alpa: "!" };
const statusLabel = { Hadir: "Present", Izin: "Permission", Sakit: "Sick", Alpa: "Absent" };
let allHistoryData = [];

let selectedMonth = "all";
let selectedStatus = "all";

function fillMonthOptions(data) {
    const seen = new Set();
    const options = [{ key: "all", label: "All Months" }];

    data.forEach(function (item) {
        const d = new Date(item.date);
        const key = d.getFullYear() + "-" + d.getMonth();
        if (!seen.has(key)) {
            seen.add(key);
            options.push({
                key: key,
                label: d.toLocaleDateString("en-GB", { month: "long", year: "numeric" })
            });
        }
    });

    const dropdown = document.getElementById("monthDropdown");

    dropdown.innerHTML = options.map(function (o) {
        return `<button type="button" class="filter-option" data-value="${o.key}">${o.label}</button>`;
    }).join("");

    dropdown.querySelectorAll(".filter-option").forEach(function (btn) {
        btn.addEventListener("click", function () {
            selectedMonth = this.dataset.value;
            document.getElementById("monthSelectLabel").textContent = this.textContent;
            dropdown.classList.remove("show");
            renderHistory();
        });
    });
}

function renderHistory() {
    const monthValue = selectedMonth;
    const statusValue = selectedStatus;

    let filtered = allHistoryData.filter(function (item) {
        const d = new Date(item.date);
        const key = d.getFullYear() + "-" + d.getMonth();
        const monthOk = monthValue === "all" || monthValue === key;
        const statusOk = statusValue === "all" || item.status === statusValue;
        return monthOk && statusOk;
    });

    document.getElementById("sumHadir").textContent = filtered.filter(i => i.status === "Hadir").length;
    document.getElementById("sumIzin").textContent = filtered.filter(i => i.status === "Izin").length;
    document.getElementById("sumSakit").textContent = filtered.filter(i => i.status === "Sakit").length;
    document.getElementById("sumAlpa").textContent = filtered.filter(i => i.status === "Alpa").length;

    const listEl = document.getElementById("historyList");
    const emptyEl = document.getElementById("historyEmpty");

    if (filtered.length === 0) {
        listEl.innerHTML = "";
        emptyEl.style.display = "block";
        return;
    }

    emptyEl.style.display = "none";

    const todayStr = new Date().toDateString();

    listEl.innerHTML = filtered.map(function (item) {
        const d = new Date(item.date);
        const isToday = d.toDateString() === todayStr;
        const label = isToday
            ? "TODAY"
            : d.toLocaleDateString("en-GB", { day: "numeric", month: "long" }).toUpperCase();

        const cls = item.status.toLowerCase();
        const sub = item.status === "Hadir"
            ? "Check-in at " + (item.time || "-")
            : (item.reason || statusLabel[item.status] || item.status);

        return `
            <div class="history-date-group">
                <p class="history-date">${label}</p>
                <div class="history-card">
                    <div class="history-status-icon ${cls}">${statusIcon[item.status] || "?"}</div>
                    <div class="history-content">
                        <strong>${statusLabel[item.status] || item.status}</strong>
                        <span>${d.toLocaleDateString("en-GB", { day: "2-digit", month: "long", year: "numeric" })}</span>
                        <small>${sub}</small>
                    </div>
                    <div class="history-time">${item.time || "--"}</div>
                    <span class="history-arrow">›</span>
                </div>
            </div>
        `;
    }).join("");
}

async function loadHistory() {
    const { data, error } = await supabaseClient
        .from("attendance")
        .select("*")
        .order("date", { ascending: false });

    if (error) {
        console.error("History error:", error);
        return;
    }

    allHistoryData = data;
    fillMonthOptions(data);
    renderHistory();
}

document.getElementById("filterMonth").addEventListener("change", renderHistory);
document.getElementById("filterStatus").addEventListener("change", renderHistory);

loadHistory();
window.addEventListener("tabshow", loadHistory);
</script>

    <script>

let touchStartX = 0;
let touchEndX = 0;

document.addEventListener("touchstart", function (event) {
    touchStartX = event.changedTouches[0].screenX;
});

document.addEventListener("touchend", function (event) {
    touchEndX = event.changedTouches[0].screenX;

    const swipeDistance = touchEndX - touchStartX;

    // Swipe kiri → My Attendance
    if (swipeDistance < -80) {
        window.location.href = "my-attendance.html";
    }

    // Swipe kanan → Dashboard
    if (swipeDistance > 80) {
        window.location.href = "dashboard.html";
    }

});

</script>
