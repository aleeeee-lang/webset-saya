<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Attendance - Attendreem</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css?v=20261010e">
<script src="js/theme.js?v=20261010e"></script>
<script src="js/lang.js?v=20261010e"></script>
<script src="js/toast.js?v=20261010e"></script>
</head>

<body>

<main class="attendance-page">

    <section class="attendance-intro" style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
        <button type="button" onclick="goBack()" aria-label="Back" style="width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:10px;background:transparent;color:#20243a;cursor:pointer;padding:0">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <h2 style="margin:0" data-i18n="page_manage_attendance">Manage Attendance</h2>
    </section>

    <!-- TODAY'S ATTENDANCE -->
    <section class="attendance-card">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px">
            <div class="card-label" data-i18n="label_today_attendance" style="margin:0">Today's Attendance</div>
            <button type="button" id="remindAttendanceBtn" class="am-btn" onclick="sendAttendanceReminder()" style="border:1px solid #e2e8f0;background:#fff;border-radius:10px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:#3F6212;display:flex;align-items:center;gap:6px;white-space:nowrap">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none"><path d="M12 22C13.1 22 14 21.1 14 20H10C10 21.1 10.9 22 12 22Z" fill="currentColor"/><path d="M18 16V11C18 7.9 16.4 5.3 13.5 4.6V4C13.5 3.2 12.8 2.5 12 2.5C11.2 2.5 10.5 3.2 10.5 4V4.6C7.6 5.3 6 7.9 6 11V16L4 18V19H20V18L18 16Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
                <span data-i18n="btn_remind_missing_attendance">Remind Who's Missing</span>
            </button>
        </div>
        <div id="todayList" style="display:flex;flex-direction:column;gap:8px"></div>
    </section>

    <!-- ATTENDANCE TREND -->
    <section class="attendance-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
            <div class="card-label" data-i18n="label_attendance_trend" style="margin:0">Attendance Trend (Last 14 Days)</div>
            <span id="trendRangeLabel" style="font-size:11px;color:#999">-</span>
        </div>
        <svg id="trendChartSvg" viewBox="0 0 280 110" style="width:100%;height:110px;display:block;margin-top:8px"></svg>
        <div style="display:flex;gap:14px;margin-top:8px;flex-wrap:wrap">
            <span style="display:flex;align-items:center;gap:5px;font-size:11px;color:#777"><i style="width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block"></i><span data-i18n="trend_legend_good">90%+</span></span>
            <span style="display:flex;align-items:center;gap:5px;font-size:11px;color:#777"><i style="width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block"></i><span data-i18n="trend_legend_ok">75-89%</span></span>
            <span style="display:flex;align-items:center;gap:5px;font-size:11px;color:#777"><i style="width:8px;height:8px;border-radius:50%;background:#ef4444;display:inline-block"></i><span data-i18n="trend_legend_low">&lt;75%</span></span>
        </div>
    </section>

    <!-- FILTER + HISTORY -->
    <section class="attendance-card">

        <div class="card-label" data-i18n="label_filter_records">Filter Records</div>

                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
            <select id="filterClass" class="am-field" style="flex:1;min-width:140px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:13px">
                <option value="all" data-i18n="option_all_classes">All Classes</option>
            </select>

            <input type="date" id="filterDate" class="am-field" style="flex:1;min-width:140px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:13px">
        </div>

        <button type="button" id="exportCsvBtn" class="am-btn" onclick="exportFilteredCsv()" style="width:100%;box-sizing:border-box;padding:10px 12px;margin-bottom:12px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;color:#14162B;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M12 4V15M12 15L8 11M12 15L16 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 17V18.5C5 19.33 5.67 20 6.5 20H17.5C18.33 20 19 19.33 19 18.5V17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span data-i18n="btn_export_csv">Export to CSV</span>
        </button>

        <div id="filteredList" style="display:flex;flex-direction:column;gap:8px"></div>

    </section>

    <!-- ADD / CORRECT ATTENDANCE -->
    <section class="attendance-card">

        <div class="card-label" data-i18n="label_add_correct_attendance">Add or Correct Attendance</div>

        <div style="display:flex;flex-direction:column;gap:10px">

           <select id="studentSelect" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
                <option value="" data-i18n="option_select_student">Select student...</option>
            </select>

                       <input type="date" id="recordDate" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">

           <select id="recordStatus" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
                <option value="Hadir" data-i18n="status_present">Present</option>
                <option value="Izin" data-i18n="status_permission">Permission</option>
                <option value="Sakit" data-i18n="status_sick">Sick</option>
                <option value="Alpa" data-i18n="status_absent">Absent</option>
            </select>

           <textarea id="recordReason" class="am-field" rows="2" data-i18n-placeholder="placeholder_reason_optional" placeholder="Reason (optional for Present)" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px;font-family:inherit"></textarea>

            <button type="button" class="submit-button" id="saveRecordBtn" onclick="saveRecord()" style="margin-top:2px" data-i18n="btn_save_attendance">
                Save Attendance
            </button>

        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20261010e"></script>
<script src="js/auth.js?v=20261010e"></script>

<script>

let allStudents = [];

function todayStr() {
    const now = new Date();
    return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
}

function weekdayOf(dateStr) {
    return new Date(dateStr + "T00:00:00").toLocaleDateString("en-US", { weekday: "long" });
}

const statusIconSvg = {
    Hadir: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none"><path d="M5 13L9.5 17.5L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    Izin: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 8V13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16.3" r="1.1" fill="currentColor"/></svg>',
    Sakit: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    Alpa: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>'
};

const unknownIconSvg =
    '<svg viewBox="0 0 24 24" width="17" height="17" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9.3C9.7 8 10.8 7 12 7C13.4 7 14.5 8.1 14.5 9.4C14.5 10.9 12 11 12 13.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.2" r="1" fill="currentColor"/></svg>';

const statusKeyMap = { Hadir: "status_present", Izin: "status_permission", Sakit: "status_sick", Alpa: "status_absent" };
function statusLabelOf(status) {
    const entry = translations[statusKeyMap[status]];
    return (entry ? entry[getLang()] : "") || status || "";
}
async function checkAdmin() {
    const user = await requireLogin();
    if (!user) return;

    const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

    if (error || !profile || profile.role !== "admin") {
        alert(translations.alert_admin_only[getLang()]);
        window.location.href = "index.html";
        return;
    }

    await loadStudents();
    document.getElementById("filterDate").value = todayStr();
    document.getElementById("recordDate").value = todayStr();
    await loadToday();
    await loadFiltered();
    await loadTrendChart();
}

async function loadStudents() {

    const { data, error } = await supabaseClient
        .from("profiles")
        .select("id, name, class")
        .eq("role", "murid")
        .order("name", { ascending: true });

    if (error) {
        console.error(error);
        return;
    }

    allStudents = data;

    const classSet = new Set(data.map(s => s.class).filter(Boolean));
    const classSelect = document.getElementById("filterClass");
    classSet.forEach(function (c) {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        classSelect.appendChild(opt);
    });

    const studentSelect = document.getElementById("studentSelect");
    data.forEach(function (s) {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.name + (s.class ? " (" + s.class + ")" : "");
        studentSelect.appendChild(opt);
    });

    classSelect.addEventListener("change", loadFiltered);
    classSelect.addEventListener("change", loadTrendChart);
    document.getElementById("filterDate").addEventListener("change", loadFiltered);
}

/* REMINDER: STUDENTS MISSING TODAY'S ATTENDANCE */

async function sendAttendanceReminder() {
    const lang = getLang();
    const user = await requireLogin();
    if (!user) return;

    const btn = document.getElementById("remindAttendanceBtn");
    const today = todayStr();

    const { data: records, error: recErr } = await supabaseClient
        .from("attendance")
        .select("user_id")
        .eq("date", today);

    if (recErr) {
        showToast(translations.toast_reminder_failed[lang] + recErr.message, "error");
        return;
    }

    const checkedInIds = new Set((records || []).map(function (r) { return r.user_id; }));
    const missing = allStudents.filter(function (s) { return !checkedInIds.has(s.id); });

    if (missing.length === 0) {
        showToast(translations.toast_nobody_to_remind[lang], "success");
        return;
    }

    btn.disabled = true;

    const message = translations.text_attendance_reminder_message[lang];
    const rows = missing.map(function (s) {
        return { message: message, target_type: "student", target_value: s.id, created_by: user.id };
    });

    const { error } = await supabaseClient.from("broadcasts").insert(rows);

    btn.disabled = false;

    if (error) {
        showToast(translations.toast_reminder_failed[lang] + error.message, "error");
        return;
    }

    showToast(translations.toast_reminder_sent[lang].replace("{count}", missing.length), "success");
}

/* ATTENDANCE TREND CHART (last 14 days) */

function trendBarColor(pct) {
    if (pct >= 90) return "#22c55e";
    if (pct >= 75) return "#f59e0b";
    return "#ef4444";
}

async function loadTrendChart() {
    const selectedClass = document.getElementById("filterClass").value;
    const scopedStudents = selectedClass === "all" ? allStudents : allStudents.filter(function (s) { return s.class === selectedClass; });
    const totalStudents = scopedStudents.length;

    const days = [];
    for (let i = 13; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        days.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"));
    }

    let query = supabaseClient
        .from("attendance")
        .select("user_id,date,status")
        .gte("date", days[0])
        .lte("date", days[days.length - 1]);

    const { data, error } = await query;
    const records = (error || !data) ? [] : data;

    const scopedIds = new Set(scopedStudents.map(function (s) { return s.id; }));
    const byDate = {};
    days.forEach(function (d) { byDate[d] = 0; });

    records.forEach(function (r) {
        if (selectedClass !== "all" && !scopedIds.has(r.user_id)) return;
        if (r.status === "Hadir" && byDate.hasOwnProperty(r.date)) byDate[r.date]++;
    });

    const svg = document.getElementById("trendChartSvg");
    const barWidth = 14;
    const gap = 6;
    const chartHeight = 90;
    const baseY = 100;

    const bars = days.map(function (d, i) {
        const pct = totalStudents > 0 ? Math.round((byDate[d] / totalStudents) * 100) : 0;
        const barHeight = Math.max(2, (pct / 100) * chartHeight);
        const x = i * (barWidth + gap) + 4;
        const y = baseY - barHeight;
        const color = trendBarColor(pct);
        const dateLabel = new Date(d + "T00:00:00").getDate();

        return `
            <rect x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" rx="3" fill="${color}">
                <title>${d}: ${pct}%</title>
            </rect>
            <text x="${x + barWidth / 2}" y="108" text-anchor="middle" font-size="7" fill="#aaa">${dateLabel}</text>
        `;
    }).join("");

    svg.innerHTML = bars;

    const rangeLabel = dayMonthLabel(new Date(days[0] + "T00:00:00")) + " - " + dayMonthLabel(new Date(days[days.length - 1] + "T00:00:00"));
    document.getElementById("trendRangeLabel").textContent = rangeLabel;
}

async function renderRow(item, showDate) {
    const cls = (item.status || "").toLowerCase();
    const sub = (showDate ? item.date + " · " : "") + (item.time ? item.time + " · " : "") + (item.reason || statusLabelOf(item.status) || "-");

    let photoHtml = "";

    if (item.photo_url) {
        const { data: signedData } = await supabaseClient.storage
            .from("attendance-photos")
            .createSignedUrl(item.photo_url, 3600);

        if (signedData && signedData.signedUrl) {
            const url = signedData.signedUrl;
            photoHtml = `<img src="${url}" onclick="window.open('${url}', '_blank')" style="width:38px;height:38px;border-radius:10px;object-fit:cover;cursor:pointer;flex:none">`;
        }
    }

    return `
        <div class="am-row" style="display:flex;align-items:center;gap:12px;padding:12px;background:#f8f8ff;border-radius:12px">
            <div class="history-status-icon am-icon ${cls}" style="width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:none">${statusIconSvg[item.status] || unknownIconSvg}</div>
            <div style="flex:1;min-width:0">
                <strong style="display:block;font-size:14px;color:#20243a">${item.name || "-"}</strong>
                <span style="display:block;margin-top:2px;font-size:12px;color:#888">${item.class || "-"} · ${sub}</span>
            </div>
            ${photoHtml}
        </div>
    `;
}
async function loadToday() {

    const today = todayStr();

    const { data: records } = await supabaseClient
        .from("attendance")
        .select("*")
        .eq("date", today);

    const byUser = {};
    (records || []).forEach(function (r) { byUser[r.user_id] = r; });

    const container = document.getElementById("todayList");

    const rows = [];

    for (const s of allStudents) {
        const r = byUser[s.id];

        if (r) {
            rows.push(await renderRow(r, false));
            continue;
        }

        rows.push(`
            <div class="am-row" style="display:flex;align-items:center;gap:12px;padding:12px;background:#f8f8ff;border-radius:12px;opacity:.6">
                <div class="am-icon" style="width:38px;height:38px;border-radius:13px;background:#eee;display:flex;align-items:center;justify-content:center;color:#94a3b8">${unknownIconSvg}</div>
                <div style="flex:1;min-width:0">
                    <strong style="display:block;font-size:14px;color:#20243a">${s.name}</strong>
                    <span style="display:block;margin-top:2px;font-size:12px;color:#888">${s.class || "-"} · ${translations.text_not_checked_in[getLang()]}</span>
                </div>
            </div>
        `);
    }

    container.innerHTML = rows.join("") || "<p style='color:#888;font-size:13px'>" + translations.text_no_students[getLang()] + "</p>";
}

let currentFilteredData = [];

async function loadFiltered() {

    const cls = document.getElementById("filterClass").value;
    const date = document.getElementById("filterDate").value;

    let query = supabaseClient.from("attendance").select("*").eq("date", date);
    if (cls !== "all") query = query.eq("class", cls);

    const { data, error } = await query.order("time", { ascending: true });

    const container = document.getElementById("filteredList");

    if (error) {
        container.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_failed_to_load[getLang()] + "</p>";
        currentFilteredData = [];
        return;
    }

    currentFilteredData = data || [];

    if (!data || data.length === 0) {
        container.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_no_records_filter[getLang()] + "</p>";
        return;
    }

      const rows = [];
    for (const r of data) {
        rows.push(await renderRow(r, false));
    }

    container.innerHTML = rows.join("");
}

function csvEscape(value) {
    const str = (value === null || value === undefined) ? "" : String(value);
    if (/[",\n]/.test(str)) {
        return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
}

function exportFilteredCsv() {

    if (!currentFilteredData || currentFilteredData.length === 0) {
        showToast(translations.toast_no_records_export[getLang()], "error");
        return;
    }

    const headers = ["Name", "Class", "Date", "Day", "Time", "Status", "Reason"];

    const lines = [headers.join(",")];

    currentFilteredData.forEach(function (r) {
        lines.push([
            csvEscape(r.name),
            csvEscape(r.class),
            csvEscape(r.date),
            csvEscape(r.day),
            csvEscape(r.time),
            csvEscape(statusLabelOf(r.status)),
            csvEscape(r.reason)
        ].join(","));
    });

    const csvContent = "﻿" + lines.join("\n");
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);

    const cls = document.getElementById("filterClass").value;
    const date = document.getElementById("filterDate").value || "all-dates";
    const fileName = "attendance_" + date + (cls !== "all" ? "_" + cls : "") + ".csv";

    const a = document.createElement("a");
    a.href = url;
    a.download = fileName.replace(/[^a-zA-Z0-9._-]/g, "_");
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showToast(translations.toast_csv_exported[getLang()], "success");
}


async function saveRecord() {

    const userId = document.getElementById("studentSelect").value;
    const date = document.getElementById("recordDate").value;
    const status = document.getElementById("recordStatus").value;
    const reason = document.getElementById("recordReason").value.trim();
    const btn = document.getElementById("saveRecordBtn");

    const lang = getLang();

    if (!userId || !date) {
        showToast(translations.toast_select_student_date[lang], "error");
        return;
    }

    const student = allStudents.find(s => s.id === userId);

    btn.disabled = true;
    btn.textContent = translations.btn_saving[lang];

    const { data: existing } = await supabaseClient
        .from("attendance")
        .select("id")
        .eq("user_id", userId)
        .eq("date", date)
        .maybeSingle();

    const payload = {
        user_id: userId,
        name: student ? student.name : "-",
        class: student ? student.class : null,
        date: date,
        day: weekdayOf(date),
        status: status,
        reason: reason
    };

    let error;

    if (existing) {
        const res = await supabaseClient.from("attendance").update(payload).eq("id", existing.id);
        error = res.error;
    } else {
        const res = await supabaseClient.from("attendance").insert([payload]);
        error = res.error;
    }

    btn.disabled = false;
    btn.textContent = translations.btn_save_attendance[lang];

    if (error) {
        showToast(translations.toast_save_record_failed[lang] + error.message, "error");
        return;
    }

    showToast(existing ? translations.toast_attendance_corrected[lang] : translations.toast_attendance_added[lang], "success");
    document.getElementById("recordReason").value = "";

    await loadToday();
    await loadFiltered();
}

checkAdmin();

function goBack() {
    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        history.back();
    } else {
        window.location.href = "settings.html";
    }
}

</script>

</body>
</html>
