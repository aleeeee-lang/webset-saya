</div>

             STATUS
        ====================================== -->

        <section class="attendance-card status-card">


            <div class="card-label">
                Status
            </div>


            <!-- STATUS SELECT -->

            <button
                type="button"
                class="status-select"
                id="statusSelect"
            >

                <span
                    class="status-light"
                    id="selectedStatusLight"
                ></span>


                <span id="selectedStatus">
                    Not selected
                </span>


                <span class="status-arrow">
                    ⌄
                </span>

            </button>



            <!-- STATUS DROPDOWN -->

            <div
                class="status-dropdown"
                id="statusDropdown"
            >


              <button
    type="button"
    class="status-option hadir"
    data-status="Present"
>
    <span class="status-light"></span>
    <span>Present</span>
</button>

<button
    type="button"
    class="status-option izin"
    data-status="Permission"
>
    <span class="status-light"></span>
    <span>Permission</span>
</button>

<button
    type="button"
    class="status-option sakit"
    data-status="Sick"
>
    <span class="status-light"></span>
    <span>Sick</span>
</button>

<button
    type="button"
    class="status-option alpa"
    data-status="Absent"
>
    <span class="status-light"></span>
    <span>Absent</span>
</button>
            </div>



            <!-- HIDDEN STATUS INPUT -->

            <div class="hidden-status-inputs">

                <input
                    type="radio"
                    name="status"
                    value="Hadir"
                >

                <input
                    type="radio"
                    name="status"
                    value="Izin"
                >

                <input
                    type="radio"
                    name="status"
                    value="Sakit"
                >

                <input
                    type="radio"
                    name="status"
                    value="Alpa"
                >

            </div>


        </section>



        <!-- =====================================
             REASON
        ====================================== -->

        <section class="attendance-card reason-card">


            <div class="card-label">
                Reason
            </div>


            <textarea
                id="reason"
                rows="4"
                placeholder="Why are you absent?"
            ></textarea>


        </section>



        <!-- =====================================
             PHOTO VERIFICATION
        ====================================== -->

        <section class="attendance-card camera-card">


            <div class="camera-header">

                <span class="camera-label">
                    VERIFICATION
                </span>

            </div>



            <!-- CAMERA -->

            <div class="camera-box">

               <video id="video" autoplay playsinline muted></video>

<canvas id="canvas" style="display:none;"></canvas>

<img id="photoPreview" style="display:none;">

            </div>



            <!-- CAMERA BUTTONS -->

            <div class="camera-buttons">


                <button
                    type="button"
                    class="camera-button secondary"
                    onclick="startCamera()"
                >
                    Open Camera
                </button>


                <button
                    type="button"
                    class="camera-button primary"
                    onclick="takePhoto()"
                >
                    Take Photo
                </button>


            </div>



            <!-- FACE STATUS -->

            <p id="faceStatus">
            </p>


        </section>



        <!-- =====================================
             SUBMIT
        ====================================== -->

        <button
            type="button"
            class="submit-button"
            onclick="saveAttendance()"
        >
            Submit Attendance
        </button>

    <!-- =====================================
         DATE & TIME
    ====================================== -->

    <script>

        function updateDateTime() {

            const now = new Date();


            const date =
                now.toLocaleDateString(
                    "en-GB",
                    {
                        day: "2-digit",
                        month: "long",
                        year: "numeric"
                    }
                );


            const time =
                now.toLocaleTimeString(
                    "en-GB",
                    {
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                );


            document.getElementById(
                "calendarDay"
            ).textContent = now.getDate();


            document.getElementById(
                "attendanceDate"
            ).textContent = date;


            document.getElementById(
                "currentTime"
            ).textContent = time;

        }


        updateDateTime();

        setInterval(
            updateDateTime,
            1000
        );

    </script>



    <!-- =====================================
         ANALOG CLOCK
    ====================================== -->

    <script>

        function updateAnalogClock() {

            const now = new Date();

            const hours = now.getHours();

            const minutes = now.getMinutes();

            const seconds = now.getSeconds();


            const hourDegree =
                (hours % 12) * 30 +
                minutes * 0.5;


            const minuteDegree =
                minutes * 6 +
                seconds * 0.1;


            const secondDegree =
                seconds * 6;


            document.querySelector(
                ".hour-hand"
            ).style.transform =
                `translateX(-50%) rotate(${hourDegree}deg)`;


            document.querySelector(
                ".minute-hand"
            ).style.transform =
                `translateX(-50%) rotate(${minuteDegree}deg)`;


            document.querySelector(
                ".second-hand"
            ).style.transform =
                `translateX(-50%) rotate(${secondDegree}deg)`;

        }


        updateAnalogClock();

        setInterval(
            updateAnalogClock,
            1000
        );

    </script>



    <!-- =====================================
         STATUS SELECTOR
    ====================================== -->

    <script>

        const statusSelect =
            document.getElementById(
                "statusSelect"
            );


        const statusDropdown =
            document.getElementById(
                "statusDropdown"
            );


        const selectedStatus =
            document.getElementById(
                "selectedStatus"
            );


        const selectedStatusLight =
            document.getElementById(
                "selectedStatusLight"
            );


        const statusInputs =
            document.querySelectorAll(
                'input[name="status"]'
            );


        /*
         * OPEN / CLOSE DROPDOWN
         */

        statusSelect.addEventListener(
            "click",
            function () {

                statusDropdown.classList.toggle(
                    "show"
                );

            }
        );



        /*
         * SELECT STATUS
         */

        document
            .querySelectorAll(
                ".status-option"
            )
            .forEach(
                function (option) {

                    option.addEventListener(
                        "click",
                        function () {

                            const value =
                                this.dataset.status;


                            selectedStatus.textContent =
                                value;


                            selectedStatusLight.className =
                                "status-light";


                            selectedStatusLight.classList.add(
                                this.classList.contains("hadir")
                                    ? "hadir"
                                    : this.classList.contains("izin")
                                    ? "izin"
                                    : this.classList.contains("sakit")
                                    ? "sakit"
                                    : "alpa"
                            );


                            /*
                             * CHECK HIDDEN RADIO
                             */

                            statusInputs.forEach(
                                function (input) {

                                    input.checked =
                                        input.value === value;

                                }
                            );


                            /*
                             * CLOSE DROPDOWN
                             */

                            statusDropdown.classList.remove(
                                "show"
                            );

                        }
                    );

                }
            );



        /*
         * CLICK OUTSIDE
         */

        document.addEventListener(
            "click",
            function (event) {

                if (
                    !statusSelect.contains(event.target) &&
                    !statusDropdown.contains(event.target)
                ) {

                    statusDropdown.classList.remove(
                        "show"
                    );

                }

            }
        );

    </script>

    <script>
let touchStartX = 0;
let touchEndX = 0;

document.addEventListener("touchstart", e => {
    touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener("touchend", e => {
    touchEndX = e.changedTouches[0].screenX;

    if (touchEndX - touchStartX < -80) {
        window.location.href = "dashboard.html";
    }

    if (touchEndX - touchStartX > 80) {
        window.location.href = "index.html";
    }
});


</script>
