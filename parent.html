<script>

const activityIconSvg = function (d) { return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>'; };
const activityTypeIcon = {
    kegiatan: activityIconSvg('<path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/>'),
    prestasi: activityIconSvg('<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4.5v1.5A3.5 3.5 0 0 0 8 11M16 6h3.5v1.5A3.5 3.5 0 0 1 16 11M12 13v4M9.5 17h5l.5 4h-6z"/>'),
    pelanggaran: activityIconSvg('<path d="M10.3 4.2 2.6 17.6A2 2 0 0 0 4.3 20.6h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4M12 17h.01"/>'),
    catatan: activityIconSvg('<path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>')
};
const activityTypeKeyMap = { kegiatan: "type_kegiatan", prestasi: "type_prestasi", pelanggaran: "type_pelanggaran", catatan: "type_catatan" };

const PL = (id, en) => getLang() === "id" ? id : en;
document.getElementById("pInLab").textContent = PL("Masuk", "In");
document.getElementById("pOutLab").textContent = PL("Pulang", "Out");
document.getElementById("pRateLab").textContent = PL("Kehadiran", "Attendance");
document.getElementById("pAvgLab").textContent = PL("Rata nilai", "Avg. grade");
document.getElementById("pGradesH").textContent = PL("Nilai terbaru", "Latest grades");
document.getElementById("pActH").textContent = PL("Catatan sekolah", "Notes from school");
document.getElementById("pLsnT").textContent = PL("Jadwal pelajaran", "Lesson schedule");
document.getElementById("pLsnS").textContent = PL("Pelajaran & kalender sekolah", "Lessons & school calendar");
document.getElementById("pWhoLab").textContent = PL("Portal orang tua", "Parent portal");

// a small bottom sheet that shows one of the lists kept in #pStore (moved in, moved back on close)
function pSheet(title, nodes) {
    const w = document.createElement("div");
    w.className = "ac-wrap ac-sheet pv-sheet";
    w.innerHTML = '<div class="ac-card"><div class="ac-sheet-head"><b></b></div><div class="pv-sheet-body"></div><button type="button" class="ac-sheet-cancel"></button></div>';
    w.querySelector("b").textContent = title;
    w.querySelector(".ac-sheet-cancel").textContent = PL("Tutup", "Close");
    const body = w.querySelector(".pv-sheet-body"), store = document.getElementById("pStore");
    nodes.forEach(function (n) { body.appendChild(n); });
    document.body.appendChild(w);
    requestAnimationFrame(function () { w.classList.add("in"); });
    function close() {
        nodes.forEach(function (n) { store.appendChild(n); });
        w.classList.add("out"); setTimeout(function () { w.remove(); }, 160);
        document.removeEventListener("keydown", k);
    }
    function k(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", k);
    w.addEventListener("click", function (e) { if (e.target === w || e.target.closest(".ac-sheet-cancel")) close(); });
}
const $ = function (id) { return document.getElementById(id); };
$("pRowGrades").addEventListener("click", function () { pSheet(PL("Nilai terbaru", "Latest grades"), [$("pGradesList"), $("pGradesEmpty")]); });
$("pRowAct").addEventListener("click", function () { pSheet(PL("Catatan dari sekolah", "Notes from school"), [$("pActivitiesList"), $("pActivitiesEmpty")]); });
$("pSppTile").addEventListener("click", function () { if (!$("pSppPayBox").hidden) pSheet(PL("Bayar SPP", "Pay SPP"), [$("pSppPayBox")]); });
(function () {
    const n = attNow(), D = PL("Minggu Senin Selasa Rabu Kamis Jumat Sabtu", "Sunday Monday Tuesday Wednesday Thursday Friday Saturday").split(" "), M = PL("Jan Feb Mar Apr Mei Jun Jul Agu Sep Okt Nov Des", "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec").split(" ");
    document.getElementById("pTodayLab").textContent = PL("Hari ini · ", "Today · ") + D[n.getDay()] + ", " + n.getDate() + " " + M[n.getMonth()];
})();

let myChildren = [];
let selectedChildId = "";

function tr(key) {
    const lang = getLang();
    return (translations[key] && translations[key][lang]) || key;
}

async function checkParent() {
    const user = await requireLogin();
    if (!user) return;

    const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("role, name, avatar_url")
        .eq("id", user.id)
        .single();

    if (error || !profile || profile.role !== "orangtua") {
        window.location.href = "index.html";
        return;
    }

    document.getElementById("parentName").textContent = profile.name || "";
    const pav = document.getElementById("parentAv");
    if (profile.avatar_url) pav.innerHTML = '<img src="' + escapeHTML(profile.avatar_url) + '" alt="">';
    else pav.textContent = ((profile.name || "?").trim().charAt(0) || "?").toUpperCase();

    const { data: links } = await supabaseClient
        .from("parent_links")
        .select("student_id")
        .eq("parent_id", user.id);

    if (!links || links.length === 0) {
        document.getElementById("noChildrenCard").style.display = "block";
        return;
    }

    const studentIds = links.map(function (l) { return l.student_id; });

    const { data: students } = await supabaseClient
        .from("profiles")
        .select("id,name,class")
        .in("id", studentIds);

    myChildren = students || [];

    if (myChildren.length === 0) {
        document.getElementById("noChildrenCard").style.display = "block";
        return;
    }

    const select = document.getElementById("childSelect");
    select.innerHTML = myChildren.map(function (c) {
        return `<option value="${c.id}">${escapeHTML(c.name)}${c.class ? " · " + c.class : ""}</option>`;
    }).join("");

    // the child's name sits in the header; a little arrow when there is more than one to pick
    document.getElementById("pWhoLab").textContent = PL("Orang tua dari", "Parent of");
    document.getElementById("parentName").hidden = true;
    document.getElementById("childSelectCard").hidden = false;
    document.getElementById("pChildCaret").style.display = myChildren.length > 1 ? "" : "none";
    select.disabled = myChildren.length < 2;
    select.innerHTML = myChildren.map(function (c) { return `<option value="${c.id}">${escapeHTML(c.name)}</option>`; }).join("");

    select.addEventListener("change", function () {
        selectedChildId = this.value;
        loadChildData();
    });

    selectedChildId = myChildren[0].id;
    document.getElementById("childDataWrap").style.display = "block";
    await loadChildData();
}

function renderPAttendance(all, autoAlpa, period, counted) {
    // same rule as the student's Home/Dashboard: only the admin's counting period,
    // only school days, plus school days with no check-in counted as Alpa
    period = period || {};
    const data = counted || all.filter(function (r) {
        return (!period.start || r.date >= period.start) && (!period.end || r.date <= period.end);
    });
    autoAlpa = autoAlpa || 0;
    const total = data.length + autoAlpa;
    const hadir = data.filter(i => i.status === "Hadir").length;
    const izin = data.filter(i => i.status === "Izin").length;
    const sakit = data.filter(i => i.status === "Sakit").length;
    const alpa = data.filter(i => i.status === "Alpa").length + autoAlpa;
    const percent = total > 0 ? Math.round((hadir / total) * 100) : 0;

    document.getElementById("pScorePercent").textContent = total > 0 ? percent + "%" : "–";
    document.getElementById("pScoreProgressFill").style.width = percent + "%";
    document.getElementById("pHadir").textContent = hadir;
    document.getElementById("pIzin").textContent = izin;
    document.getElementById("pSakit").textContent = sakit;
    document.getElementById("pAlpa").textContent = alpa;
    const mini = document.getElementById("pAlpaMini");
    mini.textContent = total > 0 ? PL("Alpa ", "Absent ") + alpa + (izin + sakit ? " · " + PL("Izin ", "Leave ") + (izin + sakit) : "") : "";
    mini.className = "pv-mini " + (alpa ? "bad" : "good");

    const today = localDateStr();
    const rec = all.find(function (r) { return r.date === today; });
    const statusKey = rec ? ({ Hadir: "status_present", Izin: "status_permission", Sakit: "status_sick", Alpa: "status_absent" }[rec.status] || "") : "";
    const stateTxt = { Hadir: PL("Sudah di sekolah", "At school"), Izin: PL("Izin hari ini", "On leave today"), Sakit: PL("Sakit hari ini", "Sick today"), Alpa: PL("Tidak masuk", "Absent") };
    const pts = document.getElementById("pTodayStatus");
    pts.textContent = rec ? (stateTxt[rec.status] || (statusKey ? tr(statusKey) : rec.status)) : PL("Belum absen", "Not checked in yet");
    pts.className = "pv-state " + (rec ? String(rec.status || "").toLowerCase() : "none");
    const hasTime = rec && rec.time && rec.status === "Hadir";
    document.querySelector(".pv-sub").hidden = !!rec && rec.status !== "Hadir";
    document.getElementById("pTodayTime").textContent = hasTime ? rec.time.slice(0, 5).replace(":", ".") : "–";
    document.getElementById("pTodayOut").textContent = hasTime ? (rec.checkout_time ? String(rec.checkout_time).slice(0, 5).replace(":", ".") : PL("Belum", "Not yet")) : "–";

    const descEl = document.getElementById("pScoreDesc");
    if (total === 0) descEl.textContent = tr("score_no_data");
    else if (percent >= 90) descEl.textContent = tr("score_excellent");
    else if (percent >= 75) descEl.textContent = tr("score_good");
    else descEl.textContent = tr("score_needs_improvement");
}

function currentSppPeriod() {
    const now = new Date();
    return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
}

async function renderPSpp(childId) {
    const [settingsRes, profileRes, paymentsRes] = await Promise.all([
        supabaseClient.from("spp_settings").select("*").eq("id", "global").maybeSingle(),
        supabaseClient.from("profiles").select("spp_custom_amount").eq("id", childId).maybeSingle(),
        supabaseClient.from("spp_payments").select("*").eq("user_id", childId).order("period", { ascending: false })
    ]);

    const defaultAmount = (settingsRes.data && settingsRes.data.amount) || 0;
    const customAmount = profileRes.data ? profileRes.data.spp_custom_amount : null;
    const amount = (customAmount !== null && customAmount !== undefined) ? customAmount : defaultAmount;

    const period = currentSppPeriod();
    const record = (paymentsRes.data || []).find(function (r) { return r.period === period; }) || null;

    document.getElementById("pSppMonthLabel").textContent = "SPP " + new Date(period + "-01T00:00:00").toLocaleDateString(getLang() === "id" ? "id-ID" : "en-US", { month: "short" }).replace(".", "");
    document.getElementById("pSppAmount").textContent = formatRupiah(amount);

    // parents often pay: show where to, while this month isn't paid yet
    const unpaid = !record || record.status === "rejected";
    window.AttPay.render(document.getElementById("pSppPayBox"), unpaid ? (settingsRes.data && settingsRes.data.pay_methods) || [] : [], {
        title: getLang() === "id" ? "Bayar SPP ke" : "Pay SPP to",
        note: getLang() === "id" ? "Bukti transfer dikirim dari akun anak di menu Tabungan → SPP." : "Send the transfer proof from your child's account (Savings → SPP)."
    });

    const how = document.getElementById("pSppHow");
    how.hidden = document.getElementById("pSppPayBox").hidden;
    how.textContent = PL("Cara bayar ›", "How to pay ›");
    document.getElementById("pSppTile").classList.toggle("tap", !how.hidden);
    const badge = document.getElementById("pSppStatusBadge");
    const st = record ? record.status : "unpaid";
    badge.textContent = { approved: PL("Lunas", "Paid"), pending: PL("Diperiksa", "Checking"), rejected: PL("Ditolak", "Rejected"), unpaid: PL("Belum", "Unpaid") }[st] || tr("badge_spp_" + st);
    badge.className = { approved: "ok", pending: "wait", rejected: "no", unpaid: "no" }[st] || "";
}

async function renderPDevelopment(childId) {
    const [gradesRes, activitiesRes] = await Promise.all([
        supabaseClient.from("student_grades").select("*").eq("user_id", childId),
        supabaseClient.from("student_activities").select("*").eq("user_id", childId)
    ]);

    const grades = gradesRes.data || [];
    const activities = activitiesRes.data || [];

    const gradesListEl = document.getElementById("pGradesList");
    const gradesEmptyEl = document.getElementById("pGradesEmpty");

    if (grades.length === 0) {
        gradesListEl.innerHTML = "";
        gradesEmptyEl.style.display = "block";
        document.getElementById("pDevAverageScore").textContent = "-";
        document.getElementById("pDevAverageDesc").textContent = tr("score_no_data");
        document.getElementById("pRowGradesS").textContent = PL("Belum ada nilai", "No grades yet");
    } else {
        gradesEmptyEl.style.display = "none";

        const bySubject = {};
        grades.forEach(function (g) {
            const existing = bySubject[g.subject];
            if (!existing || new Date(g.created_at) > new Date(existing.created_at)) bySubject[g.subject] = g;
        });
        const latest = Object.values(bySubject);
        const avg = latest.reduce(function (sum, g) { return sum + Number(g.score); }, 0) / latest.length;

        document.getElementById("pDevAverageScore").textContent = getLang() === "id" ? avg.toFixed(1).replace(".", ",") : avg.toFixed(1);
        if (avg >= 85) document.getElementById("pDevAverageDesc").textContent = tr("score_excellent");
        else if (avg >= 70) document.getElementById("pDevAverageDesc").textContent = tr("score_good");
        else document.getElementById("pDevAverageDesc").textContent = tr("score_needs_improvement");

        const sorted = grades.slice().sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); }).slice(0, 5);

        const g0 = sorted[0];
        document.getElementById("pRowGradesS").textContent = (g0.subject || "-") + " · " + g0.score + (grades.length > 1 ? PL(" · lihat semua", " · see all") : "");
        gradesListEl.innerHTML = sorted.map(function (g) {
            const sc = Number(g.score);
            return '<div class="ts-row"><div class="ts-row-t"><b>' + escapeHTML(g.subject || "-") + '</b><small>' + escapeHTML([g.period, g.note].filter(Boolean).join(" · ")) + '</small></div><span class="ts-score ' + (sc >= 85 ? "good" : sc < 70 ? "low" : "") + '">' + escapeHTML(Number.isInteger(sc) ? String(sc) : String(sc).replace(".", getLang() === "id" ? "," : ".")) + '</span></div>';
        }).join("");
    }

    const actListEl = document.getElementById("pActivitiesList");
    const actEmptyEl = document.getElementById("pActivitiesEmpty");

    if (activities.length === 0) {
        actListEl.innerHTML = "";
        actEmptyEl.style.display = "block";
        document.getElementById("pRowActS").textContent = PL("Belum ada catatan", "No notes yet");
    } else {
        actEmptyEl.style.display = "none";
        const sorted = activities.slice().sort(function (a, b) { return new Date(b.date) - new Date(a.date); }).slice(0, 5);

        document.getElementById("pRowActS").textContent = sorted[0].title || "-";
        actListEl.innerHTML = sorted.map(function (item) {
            return `<div class="ts-row"><span class="pv-ic ${item.type}">${activityTypeIcon[item.type] || "•"}</span><div class="ts-row-t"><b>${escapeHTML(item.title)}</b><small>${tr(activityTypeKeyMap[item.type])} · ${dayMonthYearLabel(new Date(item.date + "T00:00:00"))}${item.description ? " · " + escapeHTML(item.description) : ""}</small></div></div>`;
        }).join("");
    }
}

async function loadChildData() {
    const lsnLink = document.getElementById("pLessonsLink");
    if (lsnLink && selectedChildId) lsnLink.href = "schedule.html?child=" + encodeURIComponent(selectedChildId);
    const { data } = await supabaseClient
        .from("attendance")
        .select("*")
        .eq("user_id", selectedChildId)
        .order("date", { ascending: false });

    const rows = data || [];
    const childId = selectedChildId;
    const [period, childRes, user] = await Promise.all([
        getAttendancePeriod(),
        supabaseClient.from("profiles").select("role, class, status, left_date, created_at").eq("id", childId).maybeSingle(),
        requireLogin()
    ]);
    const inPeriod = rows.filter(function (r) {
        return (!period.start || r.date >= period.start) && (!period.end || r.date <= period.end);
    });
    const counted = childRes.data ? await attCountable(user, inPeriod, period, childRes.data) : { rows: inPeriod, autoAlpa: 0 };
    if (childId !== selectedChildId) return;   // switched to another child meanwhile
    renderPAttendance(rows, counted.autoAlpa, period, counted.rows);
    // today is not a school day for the child's class (weekend / agenda holiday): say so instead of "Not checked in"
    if (childRes.data && !rows.some(function (r) { return r.date === localDateStr(); })) {
        try {
            const rules = await attDayRules(childRes.data.class);
            if (childId === selectedChildId && !attDayOpen(localDateStr(), rules)) {
                const a = rules.agenda[localDateStr()];
                document.getElementById("pTodayStatus").textContent = tr("par_no_school");
                document.getElementById("pTodayStatus").className = "pv-state off";
                document.querySelector(".pv-sub").hidden = true;
                if (a && a.label) document.getElementById("pTodayLab").textContent += " · " + a.label;
            }
        } catch (e) { /* keep "Not checked in" */ }
    }
    await renderPSpp(selectedChildId);
    await renderPDevelopment(selectedChildId);
}

checkParent();

</script>
