<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Students - Attendreem</title>
<link rel="stylesheet" href="style.css">
<script src="js/toast.js"></script>
</head>

<body>

<main class="attendance-page">

    <section class="attendance-intro" style="display:flex;align-items:center;gap:12px">
        <button type="button" onclick="goBack()" aria-label="Back" style="width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:10px;background:#f1f1f6;color:#20243a;cursor:pointer;padding:0">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <h2 style="margin:0">Manage Students</h2>
    </section>

    <!-- ADD STUDENT FORM -->
    <section class="attendance-card">

        <div class="card-label">Add New Student</div>

        <div style="display:flex;flex-direction:column;gap:10px">

            <input type="text" id="newName" placeholder="Full name" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <input type="text" id="newClass" placeholder="Class / Major (e.g. XII IPA 1)" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <input type="text" id="newNis" placeholder="NIS / NIM" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <input type="email" id="newEmail" placeholder="Email (for login)" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <input type="text" id="newPassword" placeholder="Password (for login)" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">

            <button type="button" class="submit-button" id="addBtn" onclick="addStudent()" style="margin-top:4px">
                Add Student
            </button>

        </div>

    </section>

    <!-- STUDENT LIST -->
    <section class="attendance-card">

        <div class="card-label">Student List</div>

        <div id="studentList" style="display:flex;flex-direction:column;gap:8px"></div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

<script>

// Second, isolated client just for creating student accounts,
// so creating a student never overwrites the admin's own login session.
const supabaseSignupClient = window.supabase.createClient(supabaseUrl, supabaseKey, {
    auth: {
        persistSession: false,
        autoRefreshToken: false,
        storageKey: "sb-temp-signup-auth"
    }
});

let allStudentsData = [];

async function checkAdmin() {
    const user = await requireLogin();
    if (!user) return;

    const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

    if (error || !profile || profile.role !== "admin") {
        alert("This page is for admins only.");
        window.location.href = "index.html";
        return;
    }

    loadStudents();
}

async function addStudent() {

    const name = document.getElementById("newName").value.trim();
    const studentClass = document.getElementById("newClass").value.trim();
    const nis = document.getElementById("newNis").value.trim();
    const email = document.getElementById("newEmail").value.trim();
    const password = document.getElementById("newPassword").value;

    if (!name || !email || !password) {
        showToast("Name, email, and password are required.", "error");
        return;
    }

    if (nis && allStudentsData.some(s => (s.nis || "").trim().toLowerCase() === nis.toLowerCase())) {
        showToast("That NIS/NIM is already used by another student.", "error");
        return;
    }

    const btn = document.getElementById("addBtn");
    btn.disabled = true;
    btn.textContent = "Adding...";

    const { data: signUpData, error: signUpError } = await supabaseSignupClient.auth.signUp({
        email: email,
        password: password
    });

    if (signUpError) {
        showToast("Failed to create account: " + signUpError.message, "error");
        btn.disabled = false;
        btn.textContent = "Add Student";
        return;
    }

    const { error: profileError } = await supabaseClient
        .from("profiles")
        .insert({
            id: signUpData.user.id,
            role: "murid",
            name: name,
            class: studentClass,
            nis: nis
        });

    if (profileError) {
        showToast("Account created, but saving profile failed: " + profileError.message, "error");
        btn.disabled = false;
        btn.textContent = "Add Student";
        return;
    }

    document.getElementById("newName").value = "";
    document.getElementById("newClass").value = "";
    document.getElementById("newNis").value = "";
    document.getElementById("newEmail").value = "";
    document.getElementById("newPassword").value = "";

    btn.disabled = false;
    btn.textContent = "Add Student";

    showToast("Student added.", "success");

    loadStudents();
}

async function loadStudents() {

    const { data, error } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("role", "murid")
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        return;
    }

    const list = document.getElementById("studentList");

    allStudentsData = data;

    if (data.length === 0) {
        list.innerHTML = "<p style='color:#888;font-size:13px'>No students added yet.</p>";
        return;
    }

    list.innerHTML = data.map(function (s) {
        return `
            <div class="student-row" id="row-${s.id}" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#f8f8ff;border-radius:12px">
                <div class="student-view" id="view-${s.id}" style="flex:1;min-width:0">
                    <strong style="display:block;font-size:14px;color:#20243a">${s.name || "-"}</strong>
                    <span style="display:block;margin-top:2px;font-size:12px;color:#888">${s.class || "-"} · NIS ${s.nis || "-"}</span>
                </div>
                <div class="student-actions" id="actions-${s.id}" style="display:flex;gap:6px;flex-shrink:0">
                    <button type="button" onclick="startEditStudent('${s.id}')" style="border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#20243a">Edit</button>
                    <button type="button" onclick="deleteStudent('${s.id}', '${(s.name || "").replace(/'/g, "\\'")}')" style="border:1px solid #fecaca;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#dc2626">Delete</button>
                </div>
            </div>
        `;
    }).join("");
}

function startEditStudent(id) {
    const student = allStudentsData.find(s => s.id === id);
    if (!student) return;

    const view = document.getElementById("view-" + id);
    const actions = document.getElementById("actions-" + id);

    view.innerHTML = `
        <input type="text" id="editName-${id}" value="${(student.name || "").replace(/"/g, "&quot;")}" placeholder="Full name" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;font-size:13px;margin-bottom:6px">
        <div style="display:flex;gap:6px">
            <input type="text" id="editClass-${id}" value="${(student.class || "").replace(/"/g, "&quot;")}" placeholder="Class" style="flex:1;min-width:0;box-sizing:border-box;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;font-size:13px">
            <input type="text" id="editNis-${id}" value="${(student.nis || "").replace(/"/g, "&quot;")}" placeholder="NIS" style="flex:1;min-width:0;box-sizing:border-box;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;font-size:13px">
        </div>
    `;

    actions.innerHTML = `
        <button type="button" onclick="saveEditStudent('${id}')" style="border:none;background:#4f46e5;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#fff">Save</button>
        <button type="button" onclick="loadStudents()" style="border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#20243a">Cancel</button>
    `;
}

async function saveEditStudent(id) {
    const name = document.getElementById("editName-" + id).value.trim();
    const studentClass = document.getElementById("editClass-" + id).value.trim();
    const nis = document.getElementById("editNis-" + id).value.trim();

    if (!name) {
        showToast("Name is required.", "error");
        return;
    }

    if (nis && allStudentsData.some(s => s.id !== id && (s.nis || "").trim().toLowerCase() === nis.toLowerCase())) {
        showToast("That NIS/NIM is already used by another student.", "error");
        return;
    }

    const { error } = await supabaseClient
        .from("profiles")
        .update({ name: name, class: studentClass, nis: nis })
        .eq("id", id);

    if (error) {
        showToast("Failed to save: " + error.message, "error");
        return;
    }

    showToast("Student updated.", "success");
    loadStudents();
}

async function deleteStudent(id, name) {
    const ok = confirm("Delete " + (name || "this student") + "? This removes their profile and class/attendance link. Their login account will still exist in Supabase Auth and should be removed there too if needed.");
    if (!ok) return;

    const { error } = await supabaseClient
        .from("profiles")
        .delete()
        .eq("id", id);

    if (error) {
        showToast("Failed to delete: " + error.message, "error");
        return;
    }

    showToast("Student deleted.", "success");
    loadStudents();
}

checkAdmin();

function goBack() {
    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        history.back();
    } else {
        window.location.href = "settings.html";
    }
}

let pageTouchStartX = 0;

document.addEventListener("touchstart", function (event) {
    pageTouchStartX = event.changedTouches[0].screenX;
});

document.addEventListener("touchend", function (event) {
    const touchEndX = event.changedTouches[0].screenX;
    if (touchEndX - pageTouchStartX > 80) {
        goBack();
    }
});

</script>

</body>
</html>
