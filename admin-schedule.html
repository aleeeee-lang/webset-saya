<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Schedule - Attendreem</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<script src="js/theme.js"></script>
<script src="js/lang.js"></script>
<script src="js/toast.js"></script>
</head>

<body>

<main class="attendance-page">

    <section class="attendance-intro" style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
        <button type="button" onclick="goBack()" aria-label="Back" style="width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:10px;background:transparent;color:#20243a;cursor:pointer;padding:0">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <h2 style="margin:0" data-i18n="page_manage_schedule">Manage Attendance Schedule</h2>
    </section>

    <!-- EDIT SCHEDULE -->
    <section class="attendance-card">

        <div class="card-label" data-i18n="label_schedule_class">Class</div>

        <div style="display:flex;flex-direction:column;gap:10px">

            <select id="scheduleClassSelect" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
                <option value="" data-i18n="option_choose_class">Choose a class...</option>
            </select>

            <div>
                <div style="font-size:12px;color:#888;margin-bottom:8px" data-i18n="label_active_days">Active Days</div>
                <div id="activeDaysGroup" style="display:flex;gap:6px;flex-wrap:wrap"></div>
            </div>

            <div style="display:flex;gap:10px">
                <div style="flex:1">
                    <div style="font-size:12px;color:#888;margin-bottom:6px" data-i18n="label_start_time">Opens At</div>
                    <input type="time" id="scheduleStartTime" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
                </div>
                <div style="flex:1">
                    <div style="font-size:12px;color:#888;margin-bottom:6px" data-i18n="label_end_time">Closes At</div>
                    <input type="time" id="scheduleEndTime" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
                </div>
            </div>

            <div>
                <div style="font-size:12px;color:#888;margin-bottom:6px" data-i18n="label_late_mode">If Outside Schedule</div>
                <select id="scheduleLateMode" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
                    <option value="block" data-i18n="option_mode_block">Block check-in</option>
                    <option value="late" data-i18n="option_mode_late">Allow, mark as late</option>
                </select>
            </div>

            <div id="lateUntilGroup" style="display:none">
                <div style="font-size:12px;color:#888;margin-bottom:6px" data-i18n="label_late_until">Late Until (optional)</div>
                <input type="time" id="scheduleLateUntil" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
                <div style="font-size:11px;color:#999;margin-top:6px" data-i18n="hint_late_until">After this time, attendance is fully closed. Leave empty to close right after Closes At.</div>
            </div>

            <button type="button" class="submit-button" id="saveScheduleBtn" onclick="saveSchedule()" style="margin-top:2px" data-i18n="btn_save_schedule">
                Save Schedule
            </button>

        </div>

    </section>

    <!-- EXISTING SCHEDULES -->
    <section class="attendance-card">
        <div class="card-label" data-i18n="label_existing_schedules">Configured Schedules</div>
        <div id="scheduleList" style="display:flex;flex-direction:column;gap:8px"></div>
    </section>

    <!-- HOLIDAYS -->
    <section class="attendance-card">
        <div class="card-label" data-i18n="label_manage_holidays">Holidays (Red Dates)</div>

        <div style="display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;gap:10px">
                <div style="flex:1">
                    <div style="font-size:12px;color:#888;margin-bottom:6px" data-i18n="label_holiday_date">Date</div>
                    <input type="date" id="holidayDate" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
                </div>
                <div style="flex:1.4">
                    <div style="font-size:12px;color:#888;margin-bottom:6px" data-i18n="label_holiday_label">Label</div>
                    <input type="text" id="holidayLabel" class="am-field" data-i18n-placeholder="placeholder_holiday_label" placeholder="e.g. Independence Day" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
                </div>
            </div>

            <div style="position:relative">
                <div style="font-size:12px;color:#888;margin-bottom:6px" data-i18n="label_holiday_type">Event type</div>

                <button type="button" class="filter-select" id="holidayTypeSelectBtn">
                    <span class="filter-dot" id="holidayTypeSelectDot" style="background:rgb(100,116,139)"></span>
                    <span id="holidayTypeSelectLabel" data-i18n="type_holiday">Holiday</span>
                    <span class="filter-arrow">⌄</span>
                </button>

                <div class="filter-dropdown" id="holidayTypeDropdown"></div>
            </div>

            <button type="button" class="submit-button" id="addHolidayBtn" onclick="addHoliday()" style="margin-top:2px" data-i18n="btn_add_holiday">
                Add Holiday
            </button>
        </div>

        <div id="holidayList" style="display:flex;flex-direction:column;gap:8px;margin-top:16px"></div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

<script>

const dayOptions = [
    { iso: 1, key: "day_mon" },
    { iso: 2, key: "day_tue" },
    { iso: 3, key: "day_wed" },
    { iso: 4, key: "day_thu" },
    { iso: 5, key: "day_fri" },
    { iso: 6, key: "day_sat" },
    { iso: 7, key: "day_sun" }
];

let allClasses = [];
let allSchedules = [];

function syncLateUntilVisibility() {
    const mode = document.getElementById("scheduleLateMode").value;
    document.getElementById("lateUntilGroup").style.display = mode === "late" ? "block" : "none";
}

async function checkAdmin() {
    const user = await requireLogin();
    if (!user) return;

    const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

    if (error || !profile || profile.role !== "admin") {
        alert(translations.alert_admin_only[getLang()]);
        window.location.href = "index.html";
        return;
    }

    renderDayCheckboxes();
    renderHolidayTypePills();
    await loadClasses();
    await loadSchedules();
    await loadHolidays();

    document.getElementById("scheduleLateMode").addEventListener("change", syncLateUntilVisibility);
    syncLateUntilVisibility();
}

let allHolidays = [];

const eventTypeColors = {
    holiday: { hue: "100,116,139", labelKey: "type_holiday" },
    spp: { hue: "13,148,136", labelKey: "type_spp" },
    exam: { hue: "234,88,12", labelKey: "type_exam" },
    event: { hue: "219,39,119", labelKey: "type_event" }
};

let selectedHolidayType = "holiday";

function renderHolidayTypePills() {
    const lang = getLang();
    const dropdown = document.getElementById("holidayTypeDropdown");
    if (!dropdown) return;

    dropdown.innerHTML = Object.keys(eventTypeColors).map(function (type) {
        const meta = eventTypeColors[type];
        const label = translations[meta.labelKey] ? translations[meta.labelKey][lang] : type;
        const isSelected = type === selectedHolidayType;
        return `<button type="button" class="filter-option${isSelected ? " selected" : ""}" data-type="${type}" onclick="selectHolidayType('${type}')">
            <span class="filter-dot" style="background:rgb(${meta.hue})"></span>
            <span>${label}</span>
        </button>`;
    }).join("");

    const activeMeta = eventTypeColors[selectedHolidayType];
    const activeLabel = translations[activeMeta.labelKey] ? translations[activeMeta.labelKey][lang] : selectedHolidayType;
    document.getElementById("holidayTypeSelectLabel").textContent = activeLabel;
    document.getElementById("holidayTypeSelectDot").style.background = `rgb(${activeMeta.hue})`;
}

function selectHolidayType(type) {
    selectedHolidayType = type;
    renderHolidayTypePills();
    document.getElementById("holidayTypeDropdown").classList.remove("show");
}

document.addEventListener("DOMContentLoaded", function () {
    const btn = document.getElementById("holidayTypeSelectBtn");
    if (btn) {
        btn.addEventListener("click", function (e) {
            e.stopPropagation();
            document.getElementById("holidayTypeDropdown").classList.toggle("show");
        });
    }
    document.addEventListener("click", function () {
        const dd = document.getElementById("holidayTypeDropdown");
        if (dd) dd.classList.remove("show");
    });
});

async function loadHolidays() {
    const { data, error } = await supabaseClient
        .from("holidays")
        .select("*")
        .order("date", { ascending: true });

    const container = document.getElementById("holidayList");
    const lang = getLang();

    if (error || !data || data.length === 0) {
        allHolidays = [];
        container.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_no_holidays_yet[lang] + "</p>";
        return;
    }

    allHolidays = data;

    container.innerHTML = data.map(function (h) {
        const type = h.type || "holiday";
        const meta = eventTypeColors[type] || eventTypeColors.holiday;
        const typeLabel = translations[meta.labelKey] ? translations[meta.labelKey][lang] : type;
        const badge = `<span style="display:inline-block;margin-top:4px;padding:3px 9px;border-radius:999px;background:rgba(${meta.hue},0.14);color:rgb(${meta.hue});font-size:11px;font-weight:600">${typeLabel}</span>`;
        return `
            <div class="am-row" style="display:flex;align-items:center;gap:12px;padding:12px;background:#f8f8ff;border-radius:12px">
                <div style="flex:1;min-width:0">
                    <strong style="display:block;font-size:14px;color:#20243a">${dayMonthYearLabel(new Date(h.date + "T00:00:00"))}</strong>
                    <span style="display:block;margin-top:2px;font-size:12px;color:#888">${h.label || "-"}</span>
                    ${badge}
                </div>
                <button type="button" onclick="deleteHoliday('${h.date}')" style="border:none;background:none;color:#dc3545;font-size:12px;font-weight:600;cursor:pointer;padding:6px" data-i18n="btn_delete">Delete</button>
            </div>
        `;
    }).join("");
}

async function addHoliday() {
    const lang = getLang();
    const date = document.getElementById("holidayDate").value;
    const label = document.getElementById("holidayLabel").value.trim();
    const type = selectedHolidayType;
    const btn = document.getElementById("addHolidayBtn");

    if (!date || !label) {
        showToast(translations.toast_select_date_label[lang], "error");
        return;
    }

    if (allHolidays.some(h => h.date === date)) {
        showToast(translations.toast_holiday_exists[lang], "error");
        return;
    }

    btn.disabled = true;
    btn.textContent = translations.btn_saving[lang];

    const { error } = await supabaseClient
        .from("holidays")
        .insert({ date: date, label: label, type: type });

    btn.disabled = false;
    btn.textContent = translations.btn_add_holiday[lang];

    if (error) {
        showToast(translations.toast_holiday_failed[lang] + error.message, "error");
        return;
    }

    document.getElementById("holidayDate").value = "";
    document.getElementById("holidayLabel").value = "";
    selectedHolidayType = "holiday";
    renderHolidayTypePills();
    showToast(translations.toast_holiday_added[lang], "success");
    await loadHolidays();
}

async function deleteHoliday(date) {
    const lang = getLang();
    if (!confirm(translations.confirm_delete_holiday[lang])) return;

    const { error } = await supabaseClient.from("holidays").delete().eq("date", date);

    if (error) {
        showToast(translations.toast_holiday_failed[lang] + error.message, "error");
        return;
    }

    showToast(translations.toast_holiday_deleted[lang], "success");
    await loadHolidays();
}

function renderDayCheckboxes() {
    const lang = getLang();
    const group = document.getElementById("activeDaysGroup");

    group.innerHTML = dayOptions.map(function (d) {
        const label = translations[d.key] ? translations[d.key][lang] : d.key;
        const shortLabel = label.slice(0, 3);
        return `
            <label class="schedule-day-pill" style="display:flex;align-items:center;gap:4px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;background:#fafafa;font-size:12px;cursor:pointer;color:#20243a">
                <input type="checkbox" class="schedule-day-checkbox" value="${d.iso}" style="margin:0">
                ${shortLabel}
            </label>
        `;
    }).join("");
}

async function loadClasses() {

    const { data, error } = await supabaseClient
        .from("profiles")
        .select("class")
        .eq("role", "murid");

    if (error || !data) return;

    allClasses = Array.from(new Set(data.map(s => s.class).filter(Boolean))).sort();

    const select = document.getElementById("scheduleClassSelect");
    allClasses.forEach(function (c) {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
    });
}

function dayLabelsOf(activeDays, lang) {
    return dayOptions
        .filter(function (d) { return activeDays.indexOf(d.iso) !== -1; })
        .map(function (d) { return (translations[d.key] ? translations[d.key][lang] : d.key).slice(0, 3); })
        .join(", ");
}

async function loadSchedules() {

    const { data, error } = await supabaseClient
        .from("attendance_schedules")
        .select("*")
        .order("class", { ascending: true });

    const container = document.getElementById("scheduleList");
    const lang = getLang();

    if (error || !data || data.length === 0) {
        allSchedules = [];
        container.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_no_schedules_yet[lang] + "</p>";
        return;
    }

    allSchedules = data;

    container.innerHTML = data.map(function (s) {
        let modeLabel = s.late_mode === "late" ? translations.label_mode_late_short[lang] : translations.label_mode_block_short[lang];
        if (s.late_mode === "late" && s.late_end_time) {
            modeLabel += " (" + translations.label_late_window_short[lang] + " " + s.late_end_time.slice(0, 5) + ")";
        }
        return `
            <div class="am-row" style="display:flex;align-items:center;gap:12px;padding:12px;background:#f8f8ff;border-radius:12px">
                <div style="flex:1;min-width:0">
                    <strong style="display:block;font-size:14px;color:#20243a">${s.class}</strong>
                    <span style="display:block;margin-top:2px;font-size:12px;color:#888">${dayLabelsOf(s.active_days || [], lang)} · ${s.start_time ? s.start_time.slice(0,5) : "-"}-${s.end_time ? s.end_time.slice(0,5) : "-"} · ${modeLabel}</span>
                </div>
                <button type="button" onclick="editSchedule('${s.class}')" style="border:none;background:none;color:#0d06c4;font-size:12px;font-weight:600;cursor:pointer;padding:6px" data-i18n="btn_edit">Edit</button>
                <button type="button" onclick="deleteSchedule('${s.class}')" style="border:none;background:none;color:#dc3545;font-size:12px;font-weight:600;cursor:pointer;padding:6px" data-i18n="btn_delete">Delete</button>
            </div>
        `;
    }).join("");
}

function editSchedule(cls) {
    const schedule = allSchedules.find(s => s.class === cls);
    if (!schedule) return;

    document.getElementById("scheduleClassSelect").value = cls;
    document.getElementById("scheduleStartTime").value = schedule.start_time ? schedule.start_time.slice(0, 5) : "";
    document.getElementById("scheduleEndTime").value = schedule.end_time ? schedule.end_time.slice(0, 5) : "";
    document.getElementById("scheduleLateMode").value = schedule.late_mode || "block";
    document.getElementById("scheduleLateUntil").value = schedule.late_end_time ? schedule.late_end_time.slice(0, 5) : "";
    syncLateUntilVisibility();

    document.querySelectorAll(".schedule-day-checkbox").forEach(function (cb) {
        cb.checked = (schedule.active_days || []).indexOf(Number(cb.value)) !== -1;
    });

    window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteSchedule(cls) {
    const lang = getLang();

    if (!confirm(translations.confirm_delete_schedule[lang].replace("{class}", cls))) return;

    const { error } = await supabaseClient.from("attendance_schedules").delete().eq("class", cls);

    if (error) {
        showToast(translations.toast_schedule_delete_failed[lang] + error.message, "error");
        return;
    }

    showToast(translations.toast_schedule_deleted[lang], "success");
    await loadSchedules();
}

async function saveSchedule() {

    const lang = getLang();
    const cls = document.getElementById("scheduleClassSelect").value;
    const startTime = document.getElementById("scheduleStartTime").value;
    const endTime = document.getElementById("scheduleEndTime").value;
    const lateMode = document.getElementById("scheduleLateMode").value;
    const lateUntil = document.getElementById("scheduleLateUntil").value;
    const btn = document.getElementById("saveScheduleBtn");

    if (!cls) {
        showToast(translations.toast_select_class_first[lang], "error");
        return;
    }

    const activeDays = Array.from(document.querySelectorAll(".schedule-day-checkbox:checked")).map(function (cb) {
        return Number(cb.value);
    });

    if (activeDays.length === 0) {
        showToast(translations.toast_select_one_day[lang], "error");
        return;
    }

    if (!startTime || !endTime) {
        showToast(translations.toast_select_class_first[lang], "error");
        return;
    }

    const user = await requireLogin();

    btn.disabled = true;
    btn.textContent = translations.btn_saving[lang];

    const { error } = await supabaseClient
        .from("attendance_schedules")
        .upsert(
            {
                class: cls,
                active_days: activeDays,
                start_time: startTime,
                end_time: endTime,
                late_mode: lateMode,
                late_end_time: (lateMode === "late" && lateUntil) ? lateUntil : null,
                updated_by: user.id
            },
            { onConflict: "class" }
        );

    btn.disabled = false;
    btn.textContent = translations.btn_save_schedule[lang];

    if (error) {
        showToast(translations.toast_schedule_failed[lang] + error.message, "error");
        return;
    }

    showToast(translations.toast_schedule_saved[lang], "success");
    await loadSchedules();
}

checkAdmin();

function goBack() {
    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        history.back();
    } else {
        window.location.href = "settings.html";
    }
}

</script>

</body>
</html>
