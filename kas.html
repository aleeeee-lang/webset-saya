<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Cash - Attendreem</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="theme-color" content="#14162B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=20261014s">
<script src="js/theme.js?v=20261014s"></script>
<script src="js/lang.js?v=20261014s"></script>
<script src="js/toast.js?v=20261014s"></script>
<script src="js/avatarcrop.js?v=20261014s"></script>
</head>

<body class="v2-page">

<main class="v2-wrap v2-kas">

    <header class="v2-head">
        <button type="button" class="v2-back" onclick="goBack()" aria-label="Back"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="lsn-head-text">
            <h1 data-i18n="kas_title">Class Cash</h1>
            <p class="v2-head-sub" id="kasSub">&nbsp;</p>
        </div>
        <select id="kasClass" class="kas-class" hidden aria-label="Class"></select>
    </header>

    <!-- balance -->
    <section class="kas-hero" id="kasHero">
        <span class="kas-hero-label" data-i18n="kas_balance">Cash balance</span>
        <strong class="kas-hero-big" id="kasBalance">Rp0</strong>
        <div class="kas-hero-row">
            <div><small data-i18n="kas_in_month">In this month</small><b class="in" id="kasInMonth">+Rp0</b></div>
            <div><small data-i18n="kas_out_month">Out this month</small><b class="out" id="kasOutMonth">−Rp0</b></div>
        </div>
        <div class="kas-hero-foot" id="kasTreasurer">&nbsp;</div>
    </section>

    <!-- my dues (students) -->
    <section class="kas-mine" id="kasMine" hidden></section>

    <!-- manage (treasurer / homeroom teacher / admin) -->
    <section class="kas-card" id="kasManage" hidden>
        <div class="kas-seg" role="tablist">
            <button type="button" data-tab="dues" class="on" data-i18n="kas_tab_dues">Dues</button>
            <button type="button" data-tab="add" data-i18n="kas_tab_add">Record</button>
            <button type="button" data-tab="setup" id="kasTabSetup" hidden data-i18n="kas_tab_setup">Settings</button>
        </div>

        <!-- dues checklist -->
        <div class="kas-pane" data-pane="dues">
            <div class="kas-period">
                <button type="button" id="kasPrev" aria-label="Previous"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
                <div><b id="kasPeriodLabel">&nbsp;</b><small id="kasPeriodInfo">&nbsp;</small></div>
                <button type="button" id="kasNext" aria-label="Next"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
            </div>
            <div class="kas-progress"><span id="kasProgressBar"></span></div>
            <div class="kas-members" id="kasMembers"></div>
        </div>

        <!-- add money in / out -->
        <div class="kas-pane" data-pane="add" hidden>
            <div class="kas-kind" role="radiogroup">
                <button type="button" data-kind="in" class="on in"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span data-i18n="kas_kind_in">Money in</span></button>
                <button type="button" data-kind="out" class="out"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg><span data-i18n="kas_kind_out">Money out</span></button>
            </div>
            <label class="kas-field"><span data-i18n="kas_amount">Amount</span>
                <div class="kas-money"><em>Rp</em><input type="text" inputmode="numeric" id="kasAmount" class="am-field" placeholder="15.000" autocomplete="off"></div>
            </label>
            <label class="kas-field"><span data-i18n="kas_note">For what</span>
                <input type="text" id="kasNote" class="am-field" maxlength="80" data-i18n-placeholder="kas_note_ph" placeholder="e.g. Markers and tape">
            </label>
            <label class="kas-field"><span data-i18n="kas_date">Date</span>
                <input type="date" id="kasDate" class="am-field">
            </label>
            <div class="kas-field">
                <span data-i18n="kas_receipt">Receipt photo (optional)</span>
                <label class="kas-receipt" id="kasReceiptPick">
                    <input type="file" id="kasReceipt" accept="image/*" hidden>
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
                    <span id="kasReceiptName" data-i18n="kas_receipt_pick">Add photo</span>
                </label>
            </div>
            <button type="button" class="submit-button" id="kasSaveBtn" data-needs="kasAmount,kasNote,kasDate" data-i18n="kas_save">Save</button>
        </div>

        <!-- settings (homeroom teacher / admin) -->
        <div class="kas-pane" data-pane="setup" hidden>
            <label class="kas-field"><span data-i18n="kas_treasurer">Treasurer</span>
                <select id="kasTreasurerSel" class="am-field"></select>
            </label>
            <label class="kas-field"><span data-i18n="kas_dues_amount">Dues per student</span>
                <div class="kas-money"><em>Rp</em><input type="text" inputmode="numeric" id="kasDuesAmount" class="am-field" placeholder="5.000"></div>
            </label>
            <label class="kas-field"><span data-i18n="kas_dues_period">Paid every</span>
                <select id="kasDuesPeriod" class="am-field">
                    <option value="weekly" data-i18n="kas_weekly">Week</option>
                    <option value="monthly" data-i18n="kas_monthly">Month</option>
                </select>
            </label>
            <button type="button" class="submit-button" id="kasSetupBtn" data-needs="kasDuesAmount" data-i18n="kas_save_setup">Save settings</button>
        </div>
    </section>

    <!-- history -->
    <h2 class="kas-h" data-i18n="kas_history">History</h2>
    <section class="kas-list" id="kasList"></section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20261014s"></script>
<script src="js/auth.js?v=20261014s"></script>

<script>
// ---------- small helpers ----------
function L(id, en) { return getLang() === "id" ? id : en; }
function tr(k) { const t = translations[k]; return t ? t[getLang()] : k; }
const esc = escapeHTML;
function rp(n) { return "Rp" + Math.round(Math.abs(n || 0)).toLocaleString("id-ID"); }
function digits(s) { return Number(String(s || "").replace(/\D/g, "")) || 0; }
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
const MON = { id: ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"], en: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"] };
const MONTH = { id: ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"], en: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"] };
function mon(i) { return MON[getLang() === "id" ? "id" : "en"][i]; }
function dayLabel(s) { const d = new Date(s + "T00:00:00"); return d.getDate() + " " + mon(d.getMonth()) + " " + d.getFullYear(); }
function goBack() {
    if (document.referrer && document.referrer.indexOf(location.host) !== -1 && history.length > 1) history.back();
    else location.href = "index.html";
}

// dues periods: weekly = ISO week (Mon–Sun), monthly = calendar month
function weekStart(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; }
function isoWeekKey(monday) {
    const t = new Date(monday); t.setDate(t.getDate() + 3);                 // Thursday decides the ISO year
    const y = t.getFullYear(), jan4 = new Date(y, 0, 4);
    const w = 1 + Math.round(((t - weekStart(jan4)) / 86400000 - 3) / 7);
    return y + "-W" + String(w).padStart(2, "0");
}
function periodOf(offset) {
    const now = new Date();
    if (settings.dues_period === "monthly") {
        const d = new Date(now.getFullYear(), now.getMonth() + offset, 1);
        return { key: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"), label: MONTH[getLang() === "id" ? "id" : "en"][d.getMonth()] + " " + d.getFullYear(), date: iso(offset === 0 ? now : d) };
    }
    const m = weekStart(now); m.setDate(m.getDate() + offset * 7);
    const s = new Date(m); s.setDate(s.getDate() + 6);
    const label = m.getMonth() === s.getMonth() ? m.getDate() + "–" + s.getDate() + " " + mon(s.getMonth()) : m.getDate() + " " + mon(m.getMonth()) + " – " + s.getDate() + " " + mon(s.getMonth());
    const today = new Date();
    return { key: isoWeekKey(m), label: L("Minggu ", "Week ") + label, date: iso(offset === 0 ? today : m) };
}

// ---------- state ----------
let me = null, prof = null, classes = [], cls = "", settings = defaults(), entries = [], members = [];
let canManage = false, canSetup = false, periodOffset = 0, kind = "in", busy = false;
function defaults() { return { class: "", treasurer_id: null, treasurer_name: null, dues_amount: 5000, dues_period: "weekly" }; }

async function init() {
    const user = await requireLogin();
    if (!user) return;
    me = user;
    const r = await supabaseClient.from("profiles").select("name,class,role").eq("id", user.id).maybeSingle();
    prof = r.data || {};
    const set = new Set();
    if (prof.class) set.add(prof.class);
    if (prof.role === "guru") {
        const s = await supabaseClient.from("class_schedules").select("class").eq("teacher_id", user.id);
        (s.data || []).forEach(function (x) { if (x.class) set.add(x.class); });
    }
    if (prof.role === "admin") {
        const s = await supabaseClient.from("profiles").select("class").eq("role", "murid");
        (s.data || []).forEach(function (x) { if (x.class) set.add(x.class); });
    }
    classes = Array.from(set).sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
    if (!classes.length) {
        document.getElementById("kasSub").textContent = L("Belum ada kelas.", "No class yet.");
        document.getElementById("kasList").innerHTML = emptyHTML(L("Belum ada kelas", "No class yet"), L("Kas kelas muncul setelah kamu masuk ke sebuah kelas.", "Class cash shows up once you're in a class."));
        return;
    }
    const want = new URLSearchParams(location.search).get("class");
    cls = classes.indexOf(want) !== -1 ? want : (prof.class && classes.indexOf(prof.class) !== -1 ? prof.class : classes[0]);
    const sel = document.getElementById("kasClass");
    if (classes.length > 1) {
        sel.innerHTML = classes.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join("");
        sel.value = cls; sel.hidden = false;
        sel.addEventListener("change", function () { cls = sel.value; periodOffset = 0; load(); });
    }
    document.getElementById("kasDate").value = iso(new Date());
    load();
}

async function load() {
    const [s, e] = await Promise.all([
        supabaseClient.from("class_cash_settings").select("*").eq("class", cls).maybeSingle(),
        supabaseClient.from("class_cash_entries").select("*").eq("class", cls).order("entry_date", { ascending: false }).order("created_at", { ascending: false }).limit(500)
    ]);
    if (e.error) {
        document.getElementById("kasHero").hidden = true;
        document.getElementById("kasList").innerHTML = emptyHTML(L("Kas kelas belum disiapkan", "Class cash isn't set up yet"), L("Admin perlu menjalankan class_cash.sql di Supabase dulu.", "An admin needs to run class_cash.sql in Supabase first."));
        return;
    }
    document.getElementById("kasHero").hidden = false;
    settings = Object.assign(defaults(), s.data || {}, { class: cls });
    entries = e.data || [];
    canSetup = prof.role === "admin" || (prof.role === "guru" && prof.class === cls);
    canManage = canSetup || (prof.role === "murid" && prof.class === cls && settings.treasurer_id === me.id);
    members = [];
    if (canManage) {
        const m = await supabaseClient.rpc("class_cash_members", { target_class: cls });
        members = m.data || [];
    }
    render();
}

// ---------- render ----------
function render() {
    document.getElementById("kasSub").textContent = L("Kelas ", "Class ") + cls + (canManage && prof.role === "murid" ? " · " + L("Kamu bendahara", "You're the treasurer") : "");
    let bal = 0, inM = 0, outM = 0;
    const ym = iso(new Date()).slice(0, 7);
    entries.forEach(function (x) {
        const v = x.kind === "in" ? x.amount : -x.amount;
        bal += v;
        if (String(x.entry_date).slice(0, 7) === ym) { if (x.kind === "in") inM += x.amount; else outM += x.amount; }
    });
    document.getElementById("kasBalance").textContent = (bal < 0 ? "−" : "") + rp(bal);
    document.getElementById("kasInMonth").textContent = "+" + rp(inM);
    document.getElementById("kasOutMonth").textContent = "−" + rp(outM);
    document.getElementById("kasTreasurer").innerHTML =
        '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>' +
        esc(L("Bendahara: ", "Treasurer: ") + (settings.treasurer_name || L("belum dipilih", "not chosen yet"))) +
        ' · ' + esc(L("Iuran ", "Dues ") + rp(settings.dues_amount) + " / " + (settings.dues_period === "monthly" ? L("bulan", "month") : L("minggu", "week")));

    renderMine();
    document.getElementById("kasManage").hidden = !canManage;
    document.getElementById("kasTabSetup").hidden = !canSetup;
    if (canManage) { renderDues(); renderSetup(); }
    renderList();
    if (window.attFormReady) window.attFormReady();
}

function renderMine() {
    const box = document.getElementById("kasMine");
    if (prof.role !== "murid" || prof.class !== cls || !settings.dues_amount) { box.hidden = true; return; }
    const p = periodOf(0);
    const paid = entries.some(function (x) { return x.category === "dues" && x.student_id === me.id && x.period_key === p.key; });
    box.hidden = false;
    box.className = "kas-mine " + (paid ? "paid" : "due");
    box.innerHTML = '<span class="kas-mine-ic">' + (paid
        ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>'
        : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>') + '</span>' +
        '<div><b>' + esc((settings.dues_period === "monthly" ? L("Iuran bulan ini", "Dues this month") : L("Iuran minggu ini", "Dues this week"))) + '</b><small>' +
        esc(paid ? L("Sudah bayar. Makasih!", "Paid. Thanks!") : L("Belum bayar · ", "Not paid yet · ") + rp(settings.dues_amount) + (paid ? "" : L(" ke bendahara", " to the treasurer"))) + '</small></div>';
}

function renderDues() {
    const p = periodOf(periodOffset);
    const paidRows = entries.filter(function (x) { return x.category === "dues" && x.period_key === p.key; });
    const paidIds = new Set(paidRows.map(function (x) { return x.student_id; }));
    const total = paidRows.reduce(function (s, x) { return s + x.amount; }, 0);
    document.getElementById("kasPeriodLabel").textContent = p.label;
    document.getElementById("kasPeriodInfo").textContent = paidIds.size + "/" + members.length + L(" sudah bayar · ", " paid · ") + rp(total);
    document.getElementById("kasProgressBar").style.width = (members.length ? Math.round(paidIds.size / members.length * 100) : 0) + "%";
    document.getElementById("kasNext").disabled = periodOffset >= 0;
    const box = document.getElementById("kasMembers");
    if (!members.length) { box.innerHTML = '<p class="kas-muted">' + esc(L("Belum ada siswa di kelas ini.", "No students in this class yet.")) + '</p>'; return; }
    box.innerHTML = members.map(function (m) {
        const on = paidIds.has(m.id);
        return '<button type="button" class="kas-member' + (on ? " on" : "") + '" data-id="' + esc(m.id) + '" aria-pressed="' + on + '">' +
            '<span class="kas-tick"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>' +
            '<span class="kas-member-name">' + esc(m.name || "-") + '</span><em>' + esc(on ? L("Lunas", "Paid") : rp(settings.dues_amount)) + '</em></button>';
    }).join("");
}

function renderSetup() {
    if (!canSetup) return;
    const sel = document.getElementById("kasTreasurerSel");
    sel.innerHTML = '<option value="">' + esc(L("— Pilih siswa —", "— Choose a student —")) + '</option>' +
        members.map(function (m) { return '<option value="' + esc(m.id) + '">' + esc(m.name || "-") + '</option>'; }).join("");
    sel.value = settings.treasurer_id || "";
    document.getElementById("kasDuesAmount").value = Number(settings.dues_amount || 0).toLocaleString("id-ID");
    document.getElementById("kasDuesPeriod").value = settings.dues_period;
}

function emptyHTML(t, s) {
    return '<div class="lsn-empty big"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg><b>' + esc(t) + '</b><small>' + esc(s) + '</small></div>';
}

function renderList() {
    const box = document.getElementById("kasList");
    if (!entries.length) { box.innerHTML = emptyHTML(L("Belum ada catatan", "Nothing recorded yet"), L("Pemasukan dan pengeluaran kas kelas bakal muncul di sini.", "Money in and out of the class cash will show up here.")); return; }
    // dues of one period are shown as one row (tap to see who paid)
    const rows = [], duesGroups = {};
    entries.forEach(function (x) {
        if (x.category === "dues") {
            const g = duesGroups[x.period_key];
            if (g) { g.items.push(x); g.amount += x.amount; if (x.entry_date > g.entry_date) g.entry_date = x.entry_date; return; }
            duesGroups[x.period_key] = { group: true, period_key: x.period_key, items: [x], amount: x.amount, entry_date: x.entry_date, kind: "in" };
            rows.push(duesGroups[x.period_key]);
        } else rows.push(x);
    });
    rows.sort(function (a, b) { return a.entry_date < b.entry_date ? 1 : a.entry_date > b.entry_date ? -1 : 0; });
    let lastMonth = "", html = "";
    rows.forEach(function (x) {
        const m = String(x.entry_date).slice(0, 7);
        if (m !== lastMonth) { lastMonth = m; html += '<h3 class="kas-month">' + esc(MONTH[getLang() === "id" ? "id" : "en"][Number(m.slice(5)) - 1] + " " + m.slice(0, 4)) + '</h3>'; }
        const sign = x.kind === "in" ? "+" : "−";
        const icon = x.kind === "in"
            ? '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'
            : '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>';
        if (x.group) {
            const names = x.items.map(function (i) { return i.student_name || "-"; }).sort();
            html += '<details class="kas-row in"><summary><span class="kas-ic">' + icon + '</span><div class="kas-row-text"><b>' + esc(L("Iuran ", "Dues ") + duesLabel(x.period_key)) + '</b><small>' + esc(x.items.length + L(" orang bayar", " paid")) + '</small></div><strong>' + sign + rp(x.amount) + '</strong></summary>' +
                '<div class="kas-names">' + names.map(function (n) { return '<span>' + esc(n) + '</span>'; }).join("") + '</div></details>';
            return;
        }
        html += '<div class="kas-row ' + x.kind + '" data-id="' + esc(x.id) + '"><span class="kas-ic">' + icon + '</span><div class="kas-row-text"><b>' + esc(x.note || (x.kind === "in" ? L("Pemasukan", "Money in") : L("Pengeluaran", "Money out"))) + '</b><small>' +
            esc(dayLabel(x.entry_date) + (x.created_by_name ? " · " + x.created_by_name : "")) + '</small></div>' +
            (x.receipt_path ? '<button type="button" class="kas-mini" data-act="receipt" data-path="' + esc(x.receipt_path) + '" aria-label="' + esc(L("Lihat nota", "View receipt")) + '"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></button>' : '') +
            '<strong>' + sign + rp(x.amount) + '</strong>' +
            (canManage ? '<button type="button" class="kas-mini del" data-act="del" aria-label="' + esc(L("Hapus", "Delete")) + '"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>' : '') + '</div>';
    });
    box.innerHTML = html;
}
function duesLabel(key) {
    if (/^\d{4}-\d{2}$/.test(key)) return MONTH[getLang() === "id" ? "id" : "en"][Number(key.slice(5)) - 1] + " " + key.slice(0, 4);
    const m = /^(\d{4})-W(\d{2})$/.exec(key || "");
    if (!m) return key || "";
    const jan4 = new Date(Number(m[1]), 0, 4), mon0 = weekStart(jan4); mon0.setDate(mon0.getDate() + (Number(m[2]) - 1) * 7);
    const sun = new Date(mon0); sun.setDate(sun.getDate() + 6);
    return mon0.getDate() + (mon0.getMonth() === sun.getMonth() ? "" : " " + mon(mon0.getMonth())) + "–" + sun.getDate() + " " + mon(sun.getMonth());
}

// ---------- actions ----------
document.querySelector(".kas-seg").addEventListener("click", function (e) {
    const b = e.target.closest("[data-tab]");
    if (!b) return;
    document.querySelectorAll(".kas-seg [data-tab]").forEach(function (x) { x.classList.toggle("on", x === b); });
    document.querySelectorAll(".kas-pane").forEach(function (p) { p.hidden = p.getAttribute("data-pane") !== b.getAttribute("data-tab"); });
    if (window.attFormReady) window.attFormReady();
});
// swipe left/right between the tabs (js/swipe.js)
(window.attSwipeQ = window.attSwipeQ || []).push({
    area: document.getElementById("kasManage"),
    keys: function () { return Array.prototype.filter.call(document.querySelectorAll(".kas-seg [data-tab]"), function (b) { return !b.hidden; }).map(function (b) { return b.getAttribute("data-tab"); }); },
    current: function () { const b = document.querySelector(".kas-seg [data-tab].on"); return b ? b.getAttribute("data-tab") : "dues"; },
    pane: function (k) { return document.querySelector('.kas-pane[data-pane="' + k + '"]'); },
    go: function (k) { const b = document.querySelector('.kas-seg [data-tab="' + k + '"]'); if (b) b.click(); }
});
document.getElementById("kasPrev").addEventListener("click", function () { periodOffset--; renderDues(); });
document.getElementById("kasNext").addEventListener("click", function () { if (periodOffset < 0) { periodOffset++; renderDues(); } });

// tick / untick a student's dues
document.getElementById("kasMembers").addEventListener("click", async function (e) {
    const b = e.target.closest(".kas-member");
    if (!b || busy) return;
    const id = b.getAttribute("data-id"), m = members.find(function (x) { return x.id === id; });
    const p = periodOf(periodOffset);
    const row = entries.find(function (x) { return x.category === "dues" && x.student_id === id && x.period_key === p.key; });
    busy = true; b.classList.add("busy");
    if (row) {
        const ok = await attConfirm({ title: L("Batalkan iuran?", "Undo this payment?"), text: (m ? m.name : "") + " · " + p.label, ok: L("Batalkan", "Undo") });
        if (!ok) { busy = false; b.classList.remove("busy"); return; }
        const r = await supabaseClient.from("class_cash_entries").delete().eq("id", row.id).select("id");
        if (r.error || !r.data || !r.data.length) showToast(L("Gagal membatalkan.", "Couldn't undo.") + (r.error ? " (" + r.error.message + ")" : ""), "error");
        else entries = entries.filter(function (x) { return x.id !== row.id; });
    } else {
        if (!settings.dues_amount) { busy = false; b.classList.remove("busy"); showToast(L("Atur nominal iuran dulu di Pengaturan.", "Set the dues amount in Settings first."), "error"); return; }
        const r = await supabaseClient.from("class_cash_entries").insert({
            class: cls, kind: "in", category: "dues", amount: settings.dues_amount, student_id: id, student_name: m ? m.name : null,
            period_key: p.key, note: null, entry_date: p.date, created_by: me.id, created_by_name: prof.name || null
        }).select("*").single();
        if (r.error) showToast(L("Gagal menyimpan.", "Couldn't save.") + " (" + r.error.message + ")", "error");
        else entries.unshift(r.data);
    }
    busy = false;
    render();
});

// money in / out
document.querySelector(".kas-kind").addEventListener("click", function (e) {
    const b = e.target.closest("[data-kind]");
    if (!b) return;
    kind = b.getAttribute("data-kind");
    document.querySelectorAll(".kas-kind [data-kind]").forEach(function (x) { x.classList.toggle("on", x === b); });
    document.getElementById("kasNote").placeholder = kind === "in" ? L("mis. Sumbangan wali kelas", "e.g. Donation from homeroom teacher") : L("mis. Beli spidol dan lakban", "e.g. Markers and tape");
});
function moneyInput(el) {
    el.addEventListener("input", function () {
        const n = digits(el.value);
        el.value = n ? n.toLocaleString("id-ID") : "";
    });
}
moneyInput(document.getElementById("kasAmount"));
moneyInput(document.getElementById("kasDuesAmount"));
document.getElementById("kasReceipt").addEventListener("change", function () {
    const f = this.files && this.files[0];
    document.getElementById("kasReceiptName").textContent = f ? f.name : tr("kas_receipt_pick");
    document.getElementById("kasReceiptPick").classList.toggle("has", !!f);
});

async function shrink(file) {
    // keep receipts readable but small (max 1600px, JPEG)
    try {
        const img = await createImageBitmap(file);
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        return await new Promise(function (res) { c.toBlob(function (b) { res(b || file); }, "image/jpeg", 0.85); });
    } catch (e) { return file; }
}

document.getElementById("kasSaveBtn").addEventListener("click", async function () {
    const btn = this, amount = digits(document.getElementById("kasAmount").value), note = document.getElementById("kasNote").value.trim(), date = document.getElementById("kasDate").value;
    if (!amount) { showToast(L("Isi jumlahnya dulu.", "Enter the amount first."), "error"); return; }
    if (!note) { showToast(L("Tulis untuk apa uangnya.", "Write what it's for."), "error"); return; }
    if (!date) { showToast(L("Pilih tanggalnya.", "Pick the date."), "error"); return; }
    btn.disabled = true; btn.textContent = L("Menyimpan…", "Saving…");
    let path = null;
    const f = document.getElementById("kasReceipt").files[0];
    if (f) {
        const blob = await shrink(f);
        path = me.id + "/" + Date.now() + ".jpg";
        const up = await supabaseClient.storage.from("cash-receipts").upload(path, blob, { contentType: "image/jpeg" });
        if (up.error) { path = null; showToast(L("Foto nota gagal diunggah, catatan tetap disimpan.", "Receipt upload failed; saving without it."), "error"); }
    }
    const r = await supabaseClient.from("class_cash_entries").insert({
        class: cls, kind: kind, category: "other", amount: amount, note: note, entry_date: date, receipt_path: path,
        created_by: me.id, created_by_name: prof.name || null
    }).select("*").single();
    btn.disabled = false; btn.textContent = tr("kas_save");
    if (r.error) { showToast(L("Gagal menyimpan.", "Couldn't save.") + " (" + r.error.message + ")", "error"); return; }
    entries.unshift(r.data);
    document.getElementById("kasAmount").value = ""; document.getElementById("kasNote").value = "";
    document.getElementById("kasReceipt").value = ""; document.getElementById("kasReceiptName").textContent = tr("kas_receipt_pick"); document.getElementById("kasReceiptPick").classList.remove("has");
    showToast(kind === "in" ? L("Pemasukan dicatat.", "Money in recorded.") : L("Pengeluaran dicatat.", "Money out recorded."), "success");
    render();
});

document.getElementById("kasSetupBtn").addEventListener("click", async function () {
    const btn = this, sel = document.getElementById("kasTreasurerSel");
    const tid = sel.value || null, tname = tid ? (members.find(function (m) { return m.id === tid; }) || {}).name || null : null;
    const row = { class: cls, treasurer_id: tid, treasurer_name: tname, dues_amount: digits(document.getElementById("kasDuesAmount").value), dues_period: document.getElementById("kasDuesPeriod").value, updated_at: new Date().toISOString() };
    btn.disabled = true;
    const r = await supabaseClient.from("class_cash_settings").upsert(row, { onConflict: "class" }).select("*").single();
    btn.disabled = false;
    if (r.error) { showToast(L("Gagal menyimpan.", "Couldn't save.") + " (" + r.error.message + ")", "error"); return; }
    settings = Object.assign(defaults(), r.data);
    periodOffset = 0;
    showToast(L("Pengaturan kas disimpan.", "Cash settings saved."), "success");
    render();
});

document.getElementById("kasList").addEventListener("click", async function (e) {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    if (b.getAttribute("data-act") === "receipt") {
        const r = await supabaseClient.storage.from("cash-receipts").createSignedUrl(b.getAttribute("data-path"), 600);
        if (r.error || !r.data) { showToast(L("Nota nggak bisa dibuka.", "Couldn't open the receipt."), "error"); return; }
        window.open(r.data.signedUrl, "_blank", "noopener");
        return;
    }
    const row = b.closest(".kas-row"), id = row.getAttribute("data-id"), x = entries.find(function (y) { return y.id === id; });
    const ok = await attConfirm({ title: L("Hapus catatan ini?", "Delete this entry?"), text: (x && x.note ? x.note + " · " : "") + (x ? rp(x.amount) : ""), ok: L("Hapus", "Delete") });
    if (!ok) return;
    const r = await supabaseClient.from("class_cash_entries").delete().eq("id", id).select("id");
    if (r.error || !r.data || !r.data.length) { showToast(L("Gagal menghapus.", "Couldn't delete.") + (r.error ? " (" + r.error.message + ")" : ""), "error"); return; }
    entries = entries.filter(function (y) { return y.id !== id; });
    showToast(L("Catatan dihapus.", "Entry deleted."), "success");
    render();
});

init();
</script>
