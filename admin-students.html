<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Students - Attendreem</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<script src="js/theme.js"></script>
<script src="js/lang.js"></script>
<script src="js/toast.js"></script>
</head>

<body>

<main class="attendance-page">

    <section class="attendance-intro" style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
        <button type="button" onclick="goBack()" aria-label="Back" style="width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:10px;background:transparent;color:#20243a;cursor:pointer;padding:0">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <h2 style="margin:0" data-i18n="page_manage_students">Manage Students</h2>
    </section>

    <!-- ADD STUDENT FORM -->
    <section class="attendance-card">

        <div class="card-label" data-i18n="label_add_new_student">Add New Student</div>

        <div style="display:flex;flex-direction:column;gap:10px">

            <input type="text" id="newName" class="am-field" data-i18n-placeholder="placeholder_full_name" placeholder="Full name" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <input type="text" id="newClass" class="am-field" data-i18n-placeholder="placeholder_class_major" placeholder="Class / Major (e.g. XII IPA 1)" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <input type="text" id="newNis" class="am-field" data-i18n-placeholder="placeholder_nis" placeholder="NIS / NIM" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <input type="email" id="newEmail" class="am-field" data-i18n-placeholder="placeholder_email_login" placeholder="Email (for login)" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <input type="text" id="newPassword" class="am-field" data-i18n-placeholder="placeholder_password_login" placeholder="Password (for login)" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">

            <button type="button" class="submit-button" id="addBtn" onclick="addStudent()" style="margin-top:4px" data-i18n="btn_add_student">
                Add Student
            </button>

        </div>

    </section>

    <!-- BULK IMPORT -->
    <section class="attendance-card">

        <div class="card-label" data-i18n="label_bulk_import">Bulk Import (CSV)</div>
        <p style="font-size:12px;color:#888;margin:4px 0 14px" data-i18n="hint_bulk_import">Upload a CSV file with columns: name, class, nis, email, password.</p>

        <button type="button" class="am-btn" onclick="downloadStudentTemplate()" style="border:1px solid #e2e8f0;background:#fff;border-radius:10px;padding:8px 14px;font-size:12px;cursor:pointer;color:#20243a;margin-bottom:10px" data-i18n="btn_download_template">
            Download Template
        </button>

        <input type="file" id="bulkImportFile" class="am-field" accept=".csv" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:13px;margin-bottom:10px">

        <button type="button" class="submit-button" id="bulkImportBtn" onclick="runBulkImport()" data-i18n="btn_import">
            Import
        </button>

        <div id="bulkImportResults" style="margin-top:12px;font-size:12px;color:#444;white-space:pre-wrap"></div>

    </section>

    <!-- STUDENT LIST -->
    <section class="attendance-card">

        <div class="card-label" data-i18n="label_student_list">Student List</div>

        <div id="studentList" style="display:flex;flex-direction:column;gap:8px"></div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

<script>

// Second, isolated client just for creating student accounts,
// so creating a student never overwrites the admin's own login session.
const supabaseSignupClient = window.supabase.createClient(supabaseUrl, supabaseKey, {
    auth: {
        persistSession: false,
        autoRefreshToken: false,
        storageKey: "sb-temp-signup-auth"
    }
});

let allStudentsData = [];

async function checkAdmin() {
    const user = await requireLogin();
    if (!user) return;

    const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

    if (error || !profile || profile.role !== "admin") {
        alert(translations.alert_admin_only[getLang()]);
        window.location.href = "index.html";
        return;
    }

    loadStudents();
}

async function addStudent() {

    const name = document.getElementById("newName").value.trim();
    const studentClass = document.getElementById("newClass").value.trim();
    const nis = document.getElementById("newNis").value.trim();
    const email = document.getElementById("newEmail").value.trim();
    const password = document.getElementById("newPassword").value;

    const lang = getLang();

    if (!name || !email || !password) {
        showToast(translations.toast_name_email_password_required[lang], "error");
        return;
    }

    if (nis && allStudentsData.some(s => (s.nis || "").trim().toLowerCase() === nis.toLowerCase())) {
        showToast(translations.toast_nis_used[lang], "error");
        return;
    }

    const btn = document.getElementById("addBtn");
    btn.disabled = true;
    btn.textContent = translations.btn_adding[lang];

    const { data: signUpData, error: signUpError } = await supabaseSignupClient.auth.signUp({
        email: email,
        password: password
    });

    if (signUpError) {
        showToast(translations.toast_create_account_failed[lang] + signUpError.message, "error");
        btn.disabled = false;
        btn.textContent = translations.btn_add_student[lang];
        return;
    }

    const { error: profileError } = await supabaseClient
        .from("profiles")
        .insert({
            id: signUpData.user.id,
            role: "murid",
            name: name,
            class: studentClass,
            nis: nis
        });

    if (profileError) {
        showToast(translations.toast_save_profile_failed[lang] + profileError.message, "error");
        btn.disabled = false;
        btn.textContent = translations.btn_add_student[lang];
        return;
    }

    document.getElementById("newName").value = "";
    document.getElementById("newClass").value = "";
    document.getElementById("newNis").value = "";
    document.getElementById("newEmail").value = "";
    document.getElementById("newPassword").value = "";

    btn.disabled = false;
    btn.textContent = translations.btn_add_student[lang];

    showToast(translations.toast_student_added[lang], "success");

    loadStudents();
}

async function loadStudents() {

    const { data, error } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("role", "murid")
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        return;
    }

    const list = document.getElementById("studentList");

    allStudentsData = data;

    if (data.length === 0) {
        list.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_no_students_yet[getLang()] + "</p>";
        return;
    }

    const lang = getLang();
    const btnEditLabel = translations.btn_edit[lang];
    const btnDeleteLabel = translations.btn_delete[lang];
    const btnMarkLeftLabel = translations.btn_mark_left[lang];
    const btnReactivateLabel = translations.btn_reactivate[lang];
    const badgeInactiveLabel = translations.badge_inactive[lang];
    const textLeftOnLabel = translations.text_left_on[lang];

    list.innerHTML = data.map(function (s) {
        const isInactive = s.status === "inactive";
        const nameRowStyle = isInactive ? "opacity:.6" : "";
        const badge = isInactive
            ? `<span class="status-badge-inactive" style="display:inline-block;margin-top:4px;font-size:11px;font-weight:700;color:#dc2626;background:#fef2f2;border-radius:6px;padding:2px 8px">${badgeInactiveLabel}${s.left_date ? " · " + textLeftOnLabel + " " + s.left_date : ""}</span>`
            : "";

        const statusActionBtn = isInactive
            ? `<button type="button" class="am-btn am-btn-success" onclick="reactivateStudent('${s.id}', '${(s.name || "").replace(/'/g, "\\'")}')" style="border:1px solid #bbf7d0;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#16a34a">${btnReactivateLabel}</button>`
            : `<button type="button" class="am-btn am-btn-warning" onclick="startMarkLeft('${s.id}')" style="border:1px solid #fde68a;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#b45309">${btnMarkLeftLabel}</button>`;

        const avatarHtml = s.avatar_url
            ? `<img src="${s.avatar_url}" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0">`
            : `<div style="width:36px;height:36px;border-radius:50%;background:#9aa5b1;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg viewBox="0 0 24 24" width="20" height="20" fill="#ffffff"><path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/></svg></div>`;

        return `
            <div class="student-row am-row" id="row-${s.id}" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#f8f8ff;border-radius:12px">
                ${avatarHtml}
                <div class="student-view" id="view-${s.id}" style="flex:1;min-width:0;${nameRowStyle}">
                    <strong style="display:block;font-size:14px;color:#20243a">${s.name || "-"}</strong>
                    <span style="display:block;margin-top:2px;font-size:12px;color:#888">${s.class || "-"} · NIS ${s.nis || "-"}</span>
                    ${badge}
                </div>
                <div class="student-actions" id="actions-${s.id}" style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">
                    <button type="button" class="am-btn" onclick="startEditStudent('${s.id}')" style="border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#20243a">${btnEditLabel}</button>
                    ${statusActionBtn}
                    <button type="button" class="am-btn am-btn-danger" onclick="deleteStudent('${s.id}', '${(s.name || "").replace(/'/g, "\\'")}')" style="border:1px solid #fecaca;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#dc2626">${btnDeleteLabel}</button>
                </div>
            </div>
        `;
    }).join("");
}

function startMarkLeft(id) {
    const student = allStudentsData.find(s => s.id === id);
    if (!student) return;

    const view = document.getElementById("view-" + id);
    const actions = document.getElementById("actions-" + id);
    const lang = getLang();

    view.innerHTML = `
        <strong style="display:block;font-size:14px;color:#20243a;margin-bottom:6px">${(student.name || "-")}</strong>
        <label style="display:block;font-size:12px;color:#64748b;margin-bottom:4px;font-weight:600">${translations.label_leave_date[lang]}</label>
        <input type="date" id="leaveDate-${id}" class="am-field" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;font-size:13px;margin-bottom:6px">
        <p style="font-size:11px;color:#888;margin:0">${translations.hint_mark_left[lang]}</p>
    `;

    actions.innerHTML = `
        <button type="button" onclick="saveMarkLeft('${id}')" style="border:none;background:#b45309;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#fff">${translations.btn_mark_left[lang]}</button>
        <button type="button" class="am-btn" onclick="loadStudents()" style="border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#20243a">${translations.btn_cancel[lang]}</button>
    `;
}

async function saveMarkLeft(id) {
    const lang = getLang();
    const leaveDate = document.getElementById("leaveDate-" + id).value;

    if (!leaveDate) {
        showToast(translations.toast_select_leave_date[lang], "error");
        return;
    }

    const { error } = await supabaseClient
        .from("profiles")
        .update({ status: "inactive", left_date: leaveDate })
        .eq("id", id);

    if (error) {
        showToast(translations.toast_save_failed[lang] + error.message, "error");
        return;
    }

    showToast(translations.toast_student_marked_left[lang], "success");
    loadStudents();
}

async function reactivateStudent(id, name) {
    const lang = getLang();
    const confirmMsg = translations.confirm_reactivate_student[lang].replace("{name}", name || translations.fallback_this_student[lang]);
    const ok = confirm(confirmMsg);
    if (!ok) return;

    const { error } = await supabaseClient
        .from("profiles")
        .update({ status: "active", left_date: null })
        .eq("id", id);

    if (error) {
        showToast(translations.toast_save_failed[lang] + error.message, "error");
        return;
    }

    showToast(translations.toast_student_reactivated[lang], "success");
    loadStudents();
}

function startEditStudent(id) {
    const student = allStudentsData.find(s => s.id === id);
    if (!student) return;

    const view = document.getElementById("view-" + id);
    const actions = document.getElementById("actions-" + id);

    const lang = getLang();

    view.innerHTML = `
        <input type="text" id="editName-${id}" class="am-field" value="${(student.name || "").replace(/"/g, "&quot;")}" placeholder="${translations.placeholder_full_name[lang]}" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;font-size:13px;margin-bottom:6px">
        <div style="display:flex;gap:6px">
            <input type="text" id="editClass-${id}" class="am-field" value="${(student.class || "").replace(/"/g, "&quot;")}" placeholder="Class" style="flex:1;min-width:0;box-sizing:border-box;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;font-size:13px">
            <input type="text" id="editNis-${id}" class="am-field" value="${(student.nis || "").replace(/"/g, "&quot;")}" placeholder="NIS" style="flex:1;min-width:0;box-sizing:border-box;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;font-size:13px">
        </div>
    `;

    actions.innerHTML = `
        <button type="button" onclick="saveEditStudent('${id}')" style="border:none;background:#1530c2;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#fff">${translations.btn_save[lang]}</button>
        <button type="button" class="am-btn" onclick="loadStudents()" style="border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:#20243a">${translations.btn_cancel[lang]}</button>
    `;
}

async function saveEditStudent(id) {
    const name = document.getElementById("editName-" + id).value.trim();
    const studentClass = document.getElementById("editClass-" + id).value.trim();
    const nis = document.getElementById("editNis-" + id).value.trim();

    const lang = getLang();

    if (!name) {
        showToast(translations.toast_name_required[lang], "error");
        return;
    }

    if (nis && allStudentsData.some(s => s.id !== id && (s.nis || "").trim().toLowerCase() === nis.toLowerCase())) {
        showToast(translations.toast_nis_used[lang], "error");
        return;
    }

    const { error } = await supabaseClient
        .from("profiles")
        .update({ name: name, class: studentClass, nis: nis })
        .eq("id", id);

    if (error) {
        showToast(translations.toast_save_failed[lang] + error.message, "error");
        return;
    }

    showToast(translations.toast_student_updated[lang], "success");
    loadStudents();
}

async function deleteStudent(id, name) {
    const lang = getLang();
    const confirmMsg = translations.confirm_delete_student[lang].replace("{name}", name || translations.fallback_this_student[lang]);
    const ok = confirm(confirmMsg);
    if (!ok) return;

    const { error } = await supabaseClient
        .from("profiles")
        .delete()
        .eq("id", id);

    if (error) {
        showToast(translations.toast_delete_failed[lang] + error.message, "error");
        return;
    }

    showToast(translations.toast_student_deleted[lang], "success");
    loadStudents();
}

function csvEscape(value) {
    const s = (value === null || value === undefined) ? "" : String(value);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
}

function downloadStudentTemplate() {
    const header = ["name", "class", "nis", "email", "password"];
    const sample = ["Budi Santoso", "XII IPA 1", "12345", "budi@sekolah.id", "password123"];
    const csv = "﻿" + header.map(csvEscape).join(",") + "\n" + sample.map(csvEscape).join(",") + "\n";
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "student_import_template.csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
}

// Minimal CSV parser: handles quoted fields with embedded commas, quotes and newlines.
function parseCsv(text) {
    const rows = [];
    let row = [];
    let field = "";
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
            if (c === '"') {
                if (text[i + 1] === '"') { field += '"'; i++; }
                else { inQuotes = false; }
            } else {
                field += c;
            }
        } else if (c === '"') {
            inQuotes = true;
        } else if (c === ",") {
            row.push(field);
            field = "";
        } else if (c === "\n") {
            row.push(field);
            field = "";
            rows.push(row);
            row = [];
        } else if (c === "\r") {
            // skip
        } else {
            field += c;
        }
    }

    if (field.length > 0 || row.length > 0) {
        row.push(field);
        rows.push(row);
    }

    return rows.filter(function (r) { return r.some(function (cell) { return cell.trim() !== ""; }); });
}

async function runBulkImport() {
    const lang = getLang();
    const fileInput = document.getElementById("bulkImportFile");
    const resultsEl = document.getElementById("bulkImportResults");
    const btn = document.getElementById("bulkImportBtn");

    if (!fileInput.files || fileInput.files.length === 0) {
        showToast(translations.toast_choose_csv_file[lang], "error");
        return;
    }

    const file = fileInput.files[0];
    const text = await file.text();
    let rows = parseCsv(text);

    if (rows.length === 0) {
        showToast(translations.toast_csv_empty[lang], "error");
        return;
    }

    if (rows[0][0]) rows[0][0] = rows[0][0].replace(/^﻿/, "");

    const header = rows[0].map(function (h) { return h.trim().toLowerCase(); });
    const nameIdx = header.indexOf("name");
    const classIdx = header.indexOf("class");
    const nisIdx = header.indexOf("nis");
    const emailIdx = header.indexOf("email");
    const passwordIdx = header.indexOf("password");

    if (nameIdx === -1 || emailIdx === -1 || passwordIdx === -1) {
        showToast(translations.toast_csv_missing_columns[lang], "error");
        return;
    }

    const dataRows = rows.slice(1);

    btn.disabled = true;
    resultsEl.textContent = "";

    let successCount = 0;
    const failures = [];

    for (let i = 0; i < dataRows.length; i++) {
        const r = dataRows[i];
        const name = (r[nameIdx] || "").trim();
        const studentClass = classIdx > -1 ? (r[classIdx] || "").trim() : "";
        const nis = nisIdx > -1 ? (r[nisIdx] || "").trim() : "";
        const email = (r[emailIdx] || "").trim();
        const password = (r[passwordIdx] || "").trim();

        btn.textContent = translations.btn_importing[lang].replace("{current}", i + 1).replace("{total}", dataRows.length);

        if (!name || !email || !password) {
            failures.push((name || email || ("Row " + (i + 2))) + ": " + translations.toast_name_email_password_required[lang]);
            continue;
        }

        const { data: signUpData, error: signUpError } = await supabaseSignupClient.auth.signUp({
            email: email,
            password: password
        });

        if (signUpError) {
            failures.push(name + " (" + email + "): " + signUpError.message);
            continue;
        }

        const { error: profileError } = await supabaseClient
            .from("profiles")
            .insert({
                id: signUpData.user.id,
                role: "murid",
                name: name,
                class: studentClass,
                nis: nis
            });

        if (profileError) {
            failures.push(name + " (" + email + "): " + profileError.message);
            continue;
        }

        successCount++;
    }

    btn.disabled = false;
    btn.textContent = translations.btn_import[lang];
    fileInput.value = "";

    const summary = translations.toast_bulk_import_done[lang]
        .replace("{success}", successCount)
        .replace("{total}", dataRows.length);

    resultsEl.textContent = summary + (failures.length > 0 ? "\n\n" + translations.label_failed_rows[lang] + ":\n" + failures.join("\n") : "");

    showToast(summary, failures.length > 0 ? "error" : "success");

    loadStudents();
}

checkAdmin();

function goBack() {
    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        history.back();
    } else {
        window.location.href = "settings.html";
    }
}

</script>

</body>
</html>
