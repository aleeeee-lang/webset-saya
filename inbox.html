<script>
function goBack() {
    if (document.referrer && document.referrer.indexOf(location.host) !== -1 && history.length > 1) history.back();
    else {
        let r = ""; try { r = (JSON.parse(localStorage.getItem("attendreem-profile") || "{}")).role || ""; } catch (e) {}
        location.href = r === "orangtua" ? "parent.html" : "settings.html";
    }
}
