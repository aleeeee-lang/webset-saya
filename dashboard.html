    <!-- =========================
         DASHBOARD JAVASCRIPT
    ========================== -->

    <script>

        let dashboardShowAll = false;

        const dashboardStatusKeyMap = { Hadir: "status_present", Izin: "status_permission", Sakit: "status_sick", Alpa: "status_absent" };

        function dashboardStatusLabelOf(status) {
            const entry = translations[dashboardStatusKeyMap[status]];
            return (entry ? entry[getLang()] : "") || status;
        }

        async function loadDashboardSavings() {
            const user = await requireLogin();
            if (!user) return;

            const [schoolRes, personalRes] = await Promise.all([
                supabaseClient.from("savings").select("type,amount").eq("student_id", user.id),
                supabaseClient.from("personal_savings").select("type,amount").eq("student_id", user.id)
            ]);

            const sumBalance = function (rows) {
                if (!rows) return 0;
                const setor = rows.filter(i => i.type === "setor").reduce((s, i) => s + Number(i.amount), 0);
                const tarik = rows.filter(i => i.type === "tarik").reduce((s, i) => s + Number(i.amount), 0);
                return setor - tarik;
            };

            const total = sumBalance(schoolRes.data) + sumBalance(personalRes.data);
            const el = document.getElementById("dashboardTotalSavings");
            if (el) el.textContent = formatRupiahCompact(total);
            const full = document.getElementById("dashboardTotalSavingsFull");
            if (full) full.textContent = Math.abs(total) >= 1e6 ? formatRupiah(total) : "";
        }

        async function loadDashboard() {

            let { data, error } = await getMyAttendance();


            if (error) {

                console.error(
                    "Dashboard error:",
                    error
                );

                return;

            }


            const currentUser = await getCurrentUser();
            const period = await getAttendancePeriod();
            // check-ins on closed days (holidays) don't count; missing school days are Alpa
            const counted = await attCountable(currentUser, data, period);
            const autoAlpa = counted.autoAlpa;
            data = counted.rows;

            const total =
                data.length + autoAlpa;


            const hadir =
                data.filter(
                    item =>
                        item.status === "Hadir"
                ).length;


            const izin =
                data.filter(
                    item =>
                        item.status === "Izin"
                ).length;


            const sakit =
                data.filter(
                    item =>
                        item.status === "Sakit"
                ).length;


            const alpa =
                data.filter(
                    item =>
                        item.status === "Alpa"
                ).length + autoAlpa;



            /* STATUS */

            document.getElementById(
                "totalAttendance"
            ).textContent = total;

            document.getElementById(
                "totalHadir"
            ).textContent = hadir;

            document.getElementById(
                "totalIzin"
            ).textContent = izin;

            document.getElementById(
                "totalSakit"
            ).textContent = sakit;

            document.getElementById(
                "totalAlpa"
            ).textContent = alpa;



            /* STATISTICS */

            const percentage =
                total > 0
                    ? Math.round(
                        (hadir / total) * 100
                    )
                    : 0;

            document.getElementById("attendancePercentage").textContent = percentage + "%";
            document.getElementById("dashHadirSub").textContent = (translations.dash_present_of[getLang()] || "").replace("{a}", hadir).replace("{b}", total);
            renderWeekly(data);

            const pct = function (n) {
                return total > 0 ? (n / total) * 100 : 0;
            };

            // empty parts are left out, so 100% Hadir fills the whole bar (no gaps for the zeros)
            [["segHadir", hadir], ["segIzin", izin], ["segSakit", sakit], ["segAlpa", alpa]].forEach(function (x) {
                const el = document.getElementById(x[0]);
                el.style.width = pct(x[1]) + "%";
                el.style.display = x[1] > 0 ? "" : "none";
            });



           /* RECENT ATTENDANCE */

window.allAttendanceData = data;

const showAll = dashboardShowAll;

const recent =
    showAll ? data : data.slice(0, 3);


            const recentContainer =
                document.getElementById(
                    "recentAttendance"
                );
            recentContainer.style.visibility = "visible";


            if (recent.length === 0) {

                recentContainer.innerHTML = `

                    <div class="empty-attendance">

                        <span></span>

                        <p>
                            No attendance data yet.
                        </p>

                    </div>

                `;

            }

            else {

                recentContainer.innerHTML = "";


                recent.forEach(
                    function (item) {

                        recentContainer.innerHTML += `

                            <div class="recent-attendance-item">

                                <div class="recent-date">
                                    <strong>${dayNameOf(item.date)}, ${dayMonthLabel(new Date(item.date + "T00:00:00"))}</strong>
                                    <span>${(item.time || "-").slice(0, 5).replace(":", ".")}</span>
                                </div>

                                <div class="recent-status ${item.status.toLowerCase()}">

                                    ${dashboardStatusLabelOf(item.status)}

                                </div>

                            </div>

                        `;

                    }
                );

            }



            /* INSIGHT */

            const badgeKey = total === 0 ? "dash_badge_none" : percentage >= 90 ? "dash_badge_excellent" : percentage >= 75 ? "dash_badge_good" : "dash_badge_improve";
            const badge = document.getElementById("attendanceInsightTitle");
            badge.textContent = translations[badgeKey][getLang()];
            badge.className = "v2-dash-badge " + badgeKey;

        }

        function renderWeekly(data) {
            const box = document.getElementById("dashWeekBars");
            const lang = getLang();
            const monday = attNow();
            monday.setHours(0, 0, 0, 0);
            monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
            let html = "";
            for (let w = 5; w >= 0; w--) {
                const start = new Date(monday); start.setDate(start.getDate() - w * 7);
                const end = new Date(start); end.setDate(end.getDate() + 6);
                const a = localDateStr(start), b = localDateStr(end);
                const rows = data.filter(function (r) { return r.date >= a && r.date <= b; });
                const hadir = rows.filter(function (r) { return r.status === "Hadir"; }).length;
                const pct = rows.length ? Math.round(hadir / rows.length * 100) : 0;
                const label = w === 0 ? translations.dash_this_week[lang] : dayMonthLabel(start).replace(/ (\S{3})\S*$/, " $1");
                html += '<div class="v2-week' + (w === 0 ? ' now' : '') + '" title="' + pct + '%">' +
                    '<div class="v2-week-track"><div class="v2-week-fill" style="height:' + Math.max(pct, rows.length ? 6 : 0) + '%"></div></div>' +
                    '<small>' + label + '</small></div>';
            }
            box.innerHTML = html;
        }

        async function loadDashGrade() {
            const user = await requireLogin();
            if (!user) return;
            const { data } = await supabaseClient.from("student_grades").select("subject,score,created_at").eq("user_id", user.id);
            // same rule as the Grades page: the latest score of each subject
            const latest = {};
            (data || []).forEach(function (g) {
                if (isNaN(Number(g.score))) return;
                const k = g.subject || "";
                if (!latest[k] || new Date(g.created_at) > new Date(latest[k].created_at)) latest[k] = g;
            });
            const scores = Object.values(latest).map(function (g) { return Number(g.score); });
            const avg = scores.length ? (scores.reduce(function (s, n) { return s + n; }, 0) / scores.length).toFixed(1) : "";
            document.getElementById("dashAvgGrade").textContent = avg ? (getLang() === "id" ? avg.replace(".", ",") : avg) : "-";
        }

        document.getElementById("dashMonth").textContent = monthYearLabel(attNow());
        loadDashGrade();

        function toggleViewAll() {

    dashboardShowAll = !dashboardShowAll;

    const btn = document.getElementById("viewAllBtn");
    const key = dashboardShowAll ? "show_less" : "view_all";
    const lang = getLang();

    btn.textContent = translations[key][lang];

    loadDashboard();

}


        loadDashboard();
        loadDashboardSavings();

        window.addEventListener("tabshow", loadDashboard);
        window.addEventListener("tabshow", loadDashboardSavings);

    </script>

   <script>

let touchStartX = 0;
let touchEndX = 0;

document.addEventListener("touchstart", function (event) {
    touchStartX = event.changedTouches[0].screenX;
});

document.addEventListener("touchend", function (event) {
    touchEndX = event.changedTouches[0].screenX;

    const swipeDistance = touchEndX - touchStartX;

    // Swipe kiri → History
    if (swipeDistance < -80) {
        window.location.href = "history.html";
    }

    // Swipe kanan → Attendance
    if (swipeDistance > 80) {
        window.location.href = "attendance.html";
    }

});

</script>
