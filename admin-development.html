<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Development - Attendreem</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="theme-color" content="#14162B">
<link rel="stylesheet" href="style.css?v=20261010f">
<script src="js/theme.js?v=20261010f"></script>
<script src="js/lang.js?v=20261010f"></script>
<script src="js/toast.js?v=20261010f"></script>
</head>

<body>

<main class="attendance-page">

    <section class="attendance-intro" style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
        <button type="button" onclick="goBack()" aria-label="Back" style="width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:10px;background:transparent;color:#20243a;cursor:pointer;padding:0">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <h2 style="margin:0" data-i18n="page_manage_development">Manage Development</h2>
    </section>

    <!-- SELECT STUDENT -->
    <section class="attendance-card">

        <div class="card-label" data-i18n="label_select_student">Select Student</div>

        <select id="studentSelect" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <option value="" data-i18n="option_choose_student">Choose a student...</option>
        </select>

    </section>

    <!-- ADD GRADE -->
    <section class="attendance-card" id="addGradeCard" style="display:none;margin-top:22px">

        <div class="card-label" data-i18n="label_add_grade">Add Grade</div>

        <div style="display:flex;flex-direction:column;gap:10px">
            <input type="text" id="gradeSubject" class="am-field" data-i18n-placeholder="placeholder_subject" placeholder="Subject (e.g. Mathematics)" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <input type="text" id="gradePeriod" class="am-field" data-i18n-placeholder="placeholder_period" placeholder="Period (e.g. UTS 1, Semester 1)" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <input type="number" id="gradeScore" class="am-field" min="0" max="100" data-i18n-placeholder="placeholder_score" placeholder="Score (0-100)" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <input type="text" id="gradeNote" class="am-field" data-i18n-placeholder="placeholder_grade_note" placeholder="Note (optional)" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <button type="button" class="submit-button" id="addGradeBtn" onclick="addGrade()" data-i18n="btn_add_grade">
                Add Grade
            </button>
        </div>

    </section>

    <!-- GRADES HISTORY -->
    <section class="attendance-card" id="gradesHistoryCard" style="display:none;margin-top:22px">
        <div class="card-label" data-i18n="label_grades_history">Grades</div>
        <div id="gradesList" style="display:flex;flex-direction:column;gap:8px;margin-top:10px"></div>
    </section>

    <!-- ADD ACTIVITY / NOTE -->
    <section class="attendance-card" id="addActivityCard" style="display:none;margin-top:22px">

        <div class="card-label" data-i18n="label_add_activity">Add Activity or Note</div>

        <div style="display:flex;flex-direction:column;gap:10px">
            <div>
                <div style="font-size:12px;color:#888;margin-bottom:6px" data-i18n="label_activity_type">Type</div>
                <select id="activityType" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
                    <option value="kegiatan" data-i18n="type_kegiatan">Activity</option>
                    <option value="prestasi" data-i18n="type_prestasi">Achievement</option>
                    <option value="pelanggaran" data-i18n="type_pelanggaran">Violation</option>
                    <option value="catatan" data-i18n="type_catatan">Note</option>
                </select>
            </div>
            <input type="text" id="activityTitle" class="am-field" data-i18n-placeholder="placeholder_activity_title" placeholder="Title" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <input type="text" id="activityDesc" class="am-field" data-i18n-placeholder="placeholder_activity_desc" placeholder="Description (optional)" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <input type="date" id="activityDate" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
            <button type="button" class="submit-button" id="addActivityBtn" onclick="addActivity()" data-i18n="btn_add_activity">
                Add
            </button>
        </div>

    </section>

    <!-- ACTIVITIES HISTORY -->
    <section class="attendance-card" id="activitiesHistoryCard" style="display:none;margin-top:22px">
        <div class="card-label" data-i18n="label_activities_history">Activities & Notes</div>
        <div id="activitiesList" style="display:flex;flex-direction:column;gap:8px;margin-top:10px"></div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20261010f"></script>
<script src="js/auth.js?v=20261010f"></script>

<script>

let allStudents = [];
let selectedStudentId = "";
let allGrades = [];
let allActivities = [];

async function checkAdmin() {
    const user = await requireLogin();
    if (!user) return;

    const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

    if (error || !profile || profile.role !== "admin") {
        alert(translations.alert_admin_only[getLang()]);
        window.location.href = "index.html";
        return;
    }

    await loadStudents();
    document.getElementById("activityDate").value = localDateStr();
}

async function loadStudents() {
    const { data, error } = await supabaseClient
        .from("profiles")
        .select("id,name,class")
        .eq("role", "murid")
        .order("name", { ascending: true });

    if (error || !data) return;

    allStudents = data;

    const select = document.getElementById("studentSelect");
    data.forEach(function (s) {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.name + (s.class ? " · " + s.class : "");
        select.appendChild(opt);
    });
}

function renderGrades() {
    const lang = getLang();
    const container = document.getElementById("gradesList");

    if (allGrades.length === 0) {
        container.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_no_grades_for_student[lang] + "</p>";
        return;
    }

    const sorted = allGrades.slice().sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });

    container.innerHTML = sorted.map(function (g) {
        return `
            <div class="am-row" style="display:flex;align-items:center;gap:12px;padding:12px;background:#f8f8ff;border-radius:12px">
                <div style="width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#DAF3F7;color:#0E7490;font-weight:700;font-size:13px">${Number(g.score).toFixed(0)}</div>
                <div style="flex:1;min-width:0">
                    <strong style="display:block;font-size:14px;color:#20243a">${g.subject}</strong>
                    <span style="display:block;margin-top:2px;font-size:12px;color:#888">${g.period}${g.note ? " · " + g.note : ""}</span>
                </div>
                <button type="button" onclick="deleteGrade('${g.id}')" style="border:none;background:none;color:#dc3545;font-size:12px;font-weight:600;cursor:pointer;padding:6px">${translations.btn_delete[lang]}</button>
            </div>
        `;
    }).join("");
}

function renderActivities() {
    const lang = getLang();
    const container = document.getElementById("activitiesList");

    if (allActivities.length === 0) {
        container.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_no_activities_for_student[lang] + "</p>";
        return;
    }

    const sorted = allActivities.slice().sort(function (a, b) { return new Date(b.date) - new Date(a.date); });

    container.innerHTML = sorted.map(function (item) {
        const typeLabel = translations["type_" + item.type][lang];
        return `
            <div class="am-row" style="display:flex;align-items:center;gap:12px;padding:12px;background:#f8f8ff;border-radius:12px">
                <div style="flex:1;min-width:0">
                    <strong style="display:block;font-size:14px;color:#20243a">${item.title}</strong>
                    <span style="display:block;margin-top:2px;font-size:12px;color:#888">${typeLabel} · ${dayMonthYearLabel(new Date(item.date + "T00:00:00"))}</span>
                    ${item.description ? `<span style="display:block;margin-top:2px;font-size:12px;color:#aaa">${item.description}</span>` : ""}
                </div>
                <button type="button" onclick="deleteActivity('${item.id}')" style="border:none;background:none;color:#dc3545;font-size:12px;font-weight:600;cursor:pointer;padding:6px">${translations.btn_delete[lang]}</button>
            </div>
        `;
    }).join("");
}

async function loadStudentDevelopment(studentId) {
    const [gradesRes, activitiesRes] = await Promise.all([
        supabaseClient.from("student_grades").select("*").eq("user_id", studentId),
        supabaseClient.from("student_activities").select("*").eq("user_id", studentId)
    ]);

    allGrades = gradesRes.data || [];
    allActivities = activitiesRes.data || [];

    renderGrades();
    renderActivities();
}

document.getElementById("studentSelect").addEventListener("change", async function () {
    selectedStudentId = this.value;

    const addGradeCard = document.getElementById("addGradeCard");
    const gradesHistoryCard = document.getElementById("gradesHistoryCard");
    const addActivityCard = document.getElementById("addActivityCard");
    const activitiesHistoryCard = document.getElementById("activitiesHistoryCard");

    if (!selectedStudentId) {
        addGradeCard.style.display = "none";
        gradesHistoryCard.style.display = "none";
        addActivityCard.style.display = "none";
        activitiesHistoryCard.style.display = "none";
        return;
    }

    addGradeCard.style.display = "block";
    gradesHistoryCard.style.display = "block";
    addActivityCard.style.display = "block";
    activitiesHistoryCard.style.display = "block";

    await loadStudentDevelopment(selectedStudentId);
});

async function addGrade() {
    const lang = getLang();

    if (!selectedStudentId) {
        showToast(translations.toast_select_student_first[lang], "error");
        return;
    }

    const subject = document.getElementById("gradeSubject").value.trim();
    const period = document.getElementById("gradePeriod").value.trim();
    const score = Number(document.getElementById("gradeScore").value);
    const note = document.getElementById("gradeNote").value.trim();
    const btn = document.getElementById("addGradeBtn");

    if (!subject || !period || document.getElementById("gradeScore").value === "" || isNaN(score) || score < 0 || score > 100) {
        showToast(translations.toast_enter_valid_score[lang], "error");
        return;
    }

    const user = await requireLogin();
    if (!user) return;

    btn.disabled = true;

    const { error } = await supabaseClient
        .from("student_grades")
        .insert({
            user_id: selectedStudentId,
            subject: subject,
            period: period,
            score: score,
            note: note || null,
            created_by: user.id
        });

    btn.disabled = false;

    if (error) {
        showToast(translations.toast_save_failed[lang] + error.message, "error");
        return;
    }

    document.getElementById("gradeSubject").value = "";
    document.getElementById("gradePeriod").value = "";
    document.getElementById("gradeScore").value = "";
    document.getElementById("gradeNote").value = "";

    showToast(translations.toast_grade_added[lang], "success");
    await loadStudentDevelopment(selectedStudentId);
}

async function deleteGrade(id) {
    const lang = getLang();
    if (!confirm(translations.confirm_delete_grade[lang])) return;

    const { error } = await supabaseClient.from("student_grades").delete().eq("id", id);

    if (error) {
        showToast(translations.toast_save_failed[lang] + error.message, "error");
        return;
    }

    showToast(translations.toast_grade_deleted[lang], "success");
    await loadStudentDevelopment(selectedStudentId);
}

async function addActivity() {
    const lang = getLang();

    if (!selectedStudentId) {
        showToast(translations.toast_select_student_first[lang], "error");
        return;
    }

    const type = document.getElementById("activityType").value;
    const title = document.getElementById("activityTitle").value.trim();
    const description = document.getElementById("activityDesc").value.trim();
    const date = document.getElementById("activityDate").value || localDateStr();
    const btn = document.getElementById("addActivityBtn");

    if (!title) {
        showToast(translations.toast_fill_activity_title[lang], "error");
        return;
    }

    const user = await requireLogin();
    if (!user) return;

    btn.disabled = true;

    const { error } = await supabaseClient
        .from("student_activities")
        .insert({
            user_id: selectedStudentId,
            type: type,
            title: title,
            description: description || null,
            date: date,
            created_by: user.id
        });

    btn.disabled = false;

    if (error) {
        showToast(translations.toast_save_failed[lang] + error.message, "error");
        return;
    }

    document.getElementById("activityTitle").value = "";
    document.getElementById("activityDesc").value = "";
    document.getElementById("activityDate").value = localDateStr();

    showToast(translations.toast_activity_added[lang], "success");
    await loadStudentDevelopment(selectedStudentId);
}

async function deleteActivity(id) {
    const lang = getLang();
    if (!confirm(translations.confirm_delete_activity[lang])) return;

    const { error } = await supabaseClient.from("student_activities").delete().eq("id", id);

    if (error) {
        showToast(translations.toast_save_failed[lang] + error.message, "error");
        return;
    }

    showToast(translations.toast_activity_deleted[lang], "success");
    await loadStudentDevelopment(selectedStudentId);
}

checkAdmin();

function goBack() {
    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        history.back();
    } else {
        window.location.href = "settings.html";
    }
}

</script>

</body>
</html>
