     <script>
function tr(key) {
    const lang = getLang();
    return (translations[key] && translations[key][lang]) || key;
}

let allSavingsData = [];
let selectedType = "all";

function renderHistory() {
    const typeValue = selectedType;

    let filtered = allSavingsData.filter(function (item) {
        return typeValue === "all" || item.type === typeValue;
    });

    const totalSetor = allSavingsData.filter(i => i.type === "setor").reduce((sum, i) => sum + Number(i.amount), 0);
    const totalTarik = allSavingsData.filter(i => i.type === "tarik").reduce((sum, i) => sum + Number(i.amount), 0);
    const balance = totalSetor - totalTarik;

    document.getElementById("savingsBalance").textContent = formatRupiah(balance);
    document.getElementById("savingsTotalSetor").textContent = formatRupiah(totalSetor);
    document.getElementById("savingsTotalTarik").textContent = formatRupiah(totalTarik);

    const listEl = document.getElementById("historyList");
    const emptyEl = document.getElementById("historyEmpty");

    if (filtered.length === 0) {
        listEl.innerHTML = "";
        emptyEl.style.display = "block";
        return;
    }

    emptyEl.style.display = "none";

    const todayStr = new Date().toDateString();

    listEl.innerHTML = filtered.map(function (item) {
        const d = new Date(item.created_at);
        const isToday = d.toDateString() === todayStr;
        const label = isToday
            ? tr("label_today")
            : dayMonthLabel(d).toUpperCase();

        const isSetor = item.type === "setor";
        const typeLabel = isSetor ? tr("type_setor") : tr("type_tarik");
        const sign = isSetor ? "+" : "-";

        return `
            <div class="history-date-group">
                <p class="history-date">${label}</p>
                <div class="history-card">
                    <div class="savings-type-icon ${item.type}">${isSetor ? "+" : "−"}</div>
                    <div class="history-content">
                        <strong>${typeLabel}</strong>
                        <span>${dayMonthYearLabel(d)}</span>
                        <small>${item.note || "-"}</small>
                    </div>
                    <div class="history-time savings-amount ${item.type}">${sign}${formatRupiah(item.amount)}</div>
                </div>
            </div>
        `;
    }).join("");
}

async function loadHistory() {
    const user = await requireLogin();
    if (!user) return;

    const { data, error } = await supabaseClient
        .from("savings")
        .select("*")
        .eq("student_id", user.id)
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Savings error:", error);
        return;
    }

    allSavingsData = data || [];
    renderHistory();
}

document.getElementById("statusSelectBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    document.getElementById("statusDropdown").classList.toggle("show");
});

document.querySelectorAll("#statusDropdown .filter-option").forEach(function (btn) {
    btn.addEventListener("click", function () {
        selectedType = this.dataset.value;
        document.getElementById("statusSelectLabel").textContent =
            this.querySelector("span:last-child") ? this.textContent.trim() : this.textContent;
        document.getElementById("statusSelectDot").className =
            "filter-dot " + this.querySelector(".filter-dot").className.replace("filter-dot", "").trim();
        document.getElementById("statusDropdown").classList.remove("show");
        renderHistory();
    });
});

document.addEventListener("click", function () {
    document.getElementById("statusDropdown").classList.remove("show");
});

loadHistory();
window.addEventListener("tabshow", loadHistory);
</script>

    <script>

let touchStartX = 0;
let touchEndX = 0;

document.addEventListener("touchstart", function (event) {
    touchStartX = event.changedTouches[0].screenX;
});

document.addEventListener("touchend", function (event) {
    touchEndX = event.changedTouches[0].screenX;

    const swipeDistance = touchEndX - touchStartX;

    // Swipe kiri → My Attendance
    if (swipeDistance < -80) {
        window.location.href = "my-attendance.html";
    }

    // Swipe kanan → Dashboard
    if (swipeDistance > 80) {
        window.location.href = "dashboard.html";
    }

});

</script>
