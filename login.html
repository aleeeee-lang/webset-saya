<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Attendly</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main>

        <section class="attendance-card">

            <h1>
                Attendly
            </h1>

            <h2>
                Login
            </h2>

            <p class="small-text">
                Login to access your attendance.
            </p>


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >


            <!-- LOGIN BUTTON -->

           <button
    type="button"
    class="login-button"
    onclick="loginUser()"
>
    Login
</button>

        </section>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>


    <!-- LOGIN SCRIPT -->

    <script>

        async function loginUser() {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            if (!email || !password) {

                alert(
                    "Please enter your email and password."
                );

                return;
            }


            const {
                data,
                error
            } = await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


            if (error) {

                console.error(error);

                alert(
                    "Login failed: " +
                    error.message
                );

                return;
            }


            console.log(
                "LOGIN SUCCESS:",
                data
            );


            alert(
                "Login successful! ✅"
            );


            window.location.href =
                "index.html";

        }

    </script>

</body>

</html>
