<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Send Notification - Attendreem</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="theme-color" content="#14162B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=20261031e">
<script src="js/theme.js?v=20261031e"></script>
<script src="js/lang.js?v=20261031e"></script>
<script src="js/toast.js?v=20261031e"></script>
<script src="js/fit.js?v=20261031e" defer></script>
</head>

<body>

<main class="attendance-page">

    <section class="attendance-intro" style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
        <button type="button" onclick="goBack()" aria-label="Back" style="width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:10px;background:transparent;color:#20243a;cursor:pointer;padding:0">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <h2 style="margin:0" data-i18n="page_send_notification">Send Notification</h2>
    </section>

    <!-- COMPOSE -->
    <section class="attendance-card">

        <div class="card-label" data-i18n="label_compose_notification">Compose Notification</div>

        <div style="display:flex;flex-direction:column;gap:10px">

            <textarea id="broadcastMessage" class="am-field" rows="4" data-i18n-placeholder="placeholder_notification_message" placeholder="Write your announcement..." style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px;font-family:inherit"></textarea>

            <select id="targetType" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px">
                <option value="all" data-i18n="option_target_all">All Members</option>
                <option value="class" data-i18n="option_target_class">Specific Class</option>
                <option value="student" data-i18n="option_target_student">Specific Student</option>
            </select>

            <select id="targetClassSelect" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px;display:none">
                <option value="" data-i18n="option_select_class">Select class...</option>
            </select>

            <select id="targetStudentSelect" class="am-field" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;background:#fafafa;font-size:14px;display:none">
                <option value="" data-i18n="option_select_student">Select student...</option>
            </select>

            <button type="button" class="submit-button bc-next" id="bcNextBtn" onclick="bcReview()" data-i18n="bc_next">Next</button>

        </div>

        <!-- step 2: check before sending -->
        <div id="bcReview" class="bc-review" hidden>
            <div class="bc-review-label" data-i18n="bc_review_title">Check before sending</div>
            <div class="bc-preview">
                <div class="bc-preview-head"><img src="favicon.svg?v=4" alt="" width="18" height="18"><span>Attendreem</span><span class="bc-preview-now" data-i18n="bc_now">now</span></div>
                <b>📢 <span data-i18n="bc_announcement">Announcement</span></b>
                <p id="bcPreviewText"></p>
            </div>
            <div class="bc-to"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg><span id="bcToText"></span></div>
            <div class="bc-actions">
                <button type="button" class="bc-edit" onclick="bcEdit()" data-i18n="bc_edit">Edit</button>
                <button type="button" class="submit-button bc-send" id="sendBroadcastBtn" onclick="sendBroadcast()" data-i18n="btn_send_notification">Send Notification</button>
            </div>
        </div>

    </section>

    <!-- RECENTLY SENT -->
    <section class="attendance-card">
        <div class="card-label" data-i18n="label_recent_broadcasts">Recently Sent</div>
        <p class="bc-keep-note" data-i18n="bc_keep_note">Announcements are removed automatically after 30 days.</p>
        <div id="recentBroadcastsList" style="display:flex;flex-direction:column;gap:8px"></div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20261031e"></script>
<script src="js/auth.js?v=20261031e"></script>

<script>

let allClasses = [];
let allStudents = [];

async function checkAdmin() {
    const user = await requireLogin();
    if (!user) return;

    const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

    if (error || !profile || profile.role !== "admin") {
        alert(translations.alert_admin_only[getLang()]);
        window.location.href = "index.html";
        return;
    }

    await loadTargets();
    await loadRecentBroadcasts();
}

async function loadTargets() {

    const { data, error } = await supabaseClient
        .from("profiles")
        .select("id, name, class")
        .eq("role", "murid")
        .order("name", { ascending: true });

    if (error || !data) return;

    allStudents = data;

    const classSet = new Set(data.map(s => s.class).filter(Boolean));
    allClasses = Array.from(classSet);

    const classSelect = document.getElementById("targetClassSelect");
    allClasses.forEach(function (c) {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        classSelect.appendChild(opt);
    });

    const studentSelect = document.getElementById("targetStudentSelect");
    data.forEach(function (s) {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.name + (s.class ? " (" + s.class + ")" : "");
        studentSelect.appendChild(opt);
    });
}

document.getElementById("targetType").addEventListener("change", function () {
    const type = this.value;
    document.getElementById("targetClassSelect").style.display = type === "class" ? "block" : "none";
    document.getElementById("targetStudentSelect").style.display = type === "student" ? "block" : "none";
});

function targetLabelOf(broadcast) {
    const lang = getLang();
    if (broadcast.target_type === "all") return translations.target_label_all[lang];
    if (broadcast.target_type === "class") return broadcast.target_value || "-";
    const student = allStudents.find(s => s.id === broadcast.target_value);
    return student ? student.name : (broadcast.target_value || "-");
}

async function loadRecentBroadcasts() {

    const { data, error } = await supabaseClient
        .from("broadcasts")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(10);

    const container = document.getElementById("recentBroadcastsList");

    if (error || !data || data.length === 0) {
        container.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_no_broadcasts_yet[getLang()] + "</p>";
        return;
    }

    container.innerHTML = data.map(function (b) {
        const date = new Date(b.created_at);
        const timeStr = isNaN(date.getTime()) ? "" : dayMonthLabel(date) + ", " + String(date.getHours()).padStart(2, "0") + ":" + String(date.getMinutes()).padStart(2, "0");

        return `
            <div class="am-row bc-row" style="display:flex;align-items:center;gap:10px;padding:12px;background:#f8f8ff;border-radius:12px">
                <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
                    <span style="font-size:14px;color:#20243a;word-break:break-word">${escapeHTML(b.message)}</span>
                    <span style="font-size:12px;color:#888">${escapeHTML(targetLabelOf(b))} · ${timeStr}</span>
                </div>
                <button type="button" class="bc-del" data-id="${escapeHTML(b.id)}" aria-label="${escapeHTML(bcT("bc_delete"))}" title="${escapeHTML(bcT("bc_delete"))}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
            </div>
        `;
    }).join("");
}

// ----- step 1 -> step 2 -----
function bcT(k) { return translations[k] ? translations[k][getLang()] : k; }
function bcReady() {
    const msg = document.getElementById("broadcastMessage").value.trim();
    const type = document.getElementById("targetType").value;
    if (!msg) return false;
    if (type === "class") return !!document.getElementById("targetClassSelect").value;
    if (type === "student") return !!document.getElementById("targetStudentSelect").value;
    return true;
}
function bcSyncNext() { document.getElementById("bcNextBtn").classList.toggle("is-ready", bcReady()); }
["broadcastMessage", "targetType", "targetClassSelect", "targetStudentSelect"].forEach(function (id) {
    const el = document.getElementById(id);
    el.addEventListener("input", bcSyncNext);
    el.addEventListener("change", bcSyncNext);
});
async function bcReview() {
    const lang = getLang();
    const msg = document.getElementById("broadcastMessage").value.trim();
    const type = document.getElementById("targetType").value;
    if (!msg) { showToast(translations.toast_notification_message_required[lang], "error"); return; }
    if (!bcReady()) { showToast(translations.toast_notification_target_required[lang], "error"); return; }
    document.getElementById("bcPreviewText").textContent = msg;
    let who = "", count = null;
    if (type === "all") {
        who = translations.target_label_all[lang];
        const { count: c } = await supabaseClient.from("profiles").select("id", { count: "exact", head: true });
        count = c;
    } else if (type === "class") {
        const cls = document.getElementById("targetClassSelect").value;
        who = bcT("bc_class") + " " + cls;
        count = allStudents.filter(function (s) { return s.class === cls; }).length;
    } else {
        const st = allStudents.find(function (s) { return s.id === document.getElementById("targetStudentSelect").value; });
        who = st ? st.name + (st.class ? " (" + st.class + ")" : "") : "-";
        count = 1;
    }
    document.getElementById("bcToText").textContent = bcT("bc_to") + " " + who + (count != null ? " · " + count + " " + bcT("bc_people") : "");
    document.querySelector(".attendance-card").classList.add("bc-locked");
    ["broadcastMessage", "targetType", "targetClassSelect", "targetStudentSelect"].forEach(function (id) { document.getElementById(id).disabled = true; });
    document.getElementById("bcNextBtn").hidden = true;
    document.getElementById("bcReview").hidden = false;
    document.getElementById("bcReview").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function bcEdit() {
    document.querySelector(".attendance-card").classList.remove("bc-locked");
    ["broadcastMessage", "targetType", "targetClassSelect", "targetStudentSelect"].forEach(function (id) { document.getElementById(id).disabled = false; });
    document.getElementById("bcReview").hidden = true;
    document.getElementById("bcNextBtn").hidden = false;
    bcSyncNext();
    document.getElementById("broadcastMessage").focus();
}

// ----- delete one announcement (admin) -----
document.getElementById("recentBroadcastsList").addEventListener("click", async function (e) {
    const btn = e.target.closest(".bc-del");
    if (!btn) return;
    if (!confirm(bcT("bc_delete_confirm"))) return;
    btn.disabled = true;
    const { data, error } = await supabaseClient.from("broadcasts").delete().eq("id", btn.dataset.id).select("id");
    if (error || !data || !data.length) {
        btn.disabled = false;
        showToast(bcT("bc_delete_failed") + (error ? " (" + error.message + ")" : ""), "error");
        return;
    }
    const row = btn.closest(".bc-row");
    row.style.transition = "opacity .2s, transform .2s"; row.style.opacity = "0"; row.style.transform = "translateX(12px)";
    setTimeout(loadRecentBroadcasts, 200);
    showToast(bcT("bc_deleted"), "success");
});

async function sendBroadcast() {

    const message = document.getElementById("broadcastMessage").value.trim();
    const targetType = document.getElementById("targetType").value;
    const btn = document.getElementById("sendBroadcastBtn");
    const lang = getLang();

    if (!message) {
        showToast(translations.toast_notification_message_required[lang], "error");
        return;
    }

    let targetValue = null;

    if (targetType === "class") {
        targetValue = document.getElementById("targetClassSelect").value;
        if (!targetValue) {
            showToast(translations.toast_notification_target_required[lang], "error");
            return;
        }
    } else if (targetType === "student") {
        targetValue = document.getElementById("targetStudentSelect").value;
        if (!targetValue) {
            showToast(translations.toast_notification_target_required[lang], "error");
            return;
        }
    }

    const user = await requireLogin();

    btn.disabled = true;
    btn.textContent = translations.btn_sending[lang];

    const { error } = await supabaseClient.from("broadcasts").insert([{
        message: message,
        target_type: targetType,
        target_value: targetValue,
        created_by: user.id
    }]);

    btn.disabled = false;
    btn.textContent = translations.btn_send_notification[lang];

    if (error) {
        showToast(translations.toast_notification_failed[lang] + error.message, "error");
        return;
    }

    showToast(translations.toast_notification_sent[lang], "success");
    document.getElementById("broadcastMessage").value = "";
    bcEdit();
    document.getElementById("broadcastMessage").blur();
    await loadRecentBroadcasts();
}

checkAdmin();

function goBack() {
    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        history.back();
    } else {
        window.location.href = "settings.html";
    }
}

</script>

</body>
</html>
