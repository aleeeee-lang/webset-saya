<body class="v2-page">

    <main class="v2-wrap">

        <header class="v2-head">
            <div>
                <h1 data-i18n="page_check_in">Check in</h1>
                <p class="v2-head-sub"><span id="attendanceDate">-</span> · <span id="currentTime">--.--</span></p>
            </div>
        </header>

        <div class="att-side">
        <div class="v2-window" id="attWindow" hidden>
            <span class="v2-window-text"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="attWindowText"></span></span>
            <span class="v2-window-count" id="attWindowCount"></span>
        </div>

        <a href="leave.html" class="v3-leave-link" id="attLeaveLink"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14h6"/></svg><span data-i18n="v3_cant_come">Tidak bisa hadir? Ajukan izin / sakit</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="v3-leave-go"><path d="M9 6l6 6-6 6"/></svg></a>

        <h2 class="v2-label att-status-label" data-i18n="label_status_today">Today's status</h2>
        <div class="v2-status-grid" role="radiogroup" aria-label="Status">
            <button type="button" class="v2-status" role="radio" aria-checked="false" data-value="Hadir">
                <span data-i18n="status_present">Present</span>
                <span class="v2-status-ic hadir"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg></span>
            </button>
            <button type="button" class="v2-status izin" role="radio" aria-checked="false" data-value="Izin">
                <span data-i18n="status_permission">Permission</span>
                <span class="v2-status-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>
            </button>
            <button type="button" class="v2-status sakit" role="radio" aria-checked="false" data-value="Sakit">
                <span data-i18n="status_sick">Sick</span>
                <span class="v2-status-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
            </button>
            <button type="button" class="v2-status alpa" role="radio" aria-checked="false" data-value="Alpa">
                <span data-i18n="status_absent">Absent</span>
                <span class="v2-status-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
            </button>
        </div>

        <div class="hidden-status-inputs" hidden>
            <input type="radio" name="status" value="Hadir">
            <input type="radio" name="status" value="Izin">
            <input type="radio" name="status" value="Sakit">
            <input type="radio" name="status" value="Alpa">
        </div>

        <label class="v2-reason" id="reasonBox" hidden>
            <span data-i18n="label_reason">Reason</span>
            <textarea id="reason" rows="5" placeholder="Why are you absent?" data-i18n-placeholder="reason_placeholder"></textarea>
        </label>

        <!-- Izin / Sakit: photo of a letter (js/att-proof.js) -->
        <section class="v2-proof" id="proofBox" hidden>
            <div class="v2-proof-head"><b id="proofTitle">Foto surat / bukti</b><small id="proofHint"></small></div>
            <div class="v2-proof-empty" id="proofEmpty">
                <button type="button" class="v2-proof-btn" id="proofCam"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><span id="proofCamTxt">Ambil foto</span></button>
                <button type="button" class="v2-proof-btn" id="proofGal"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg><span id="proofGalTxt">Dari galeri</span></button>
            </div>
            <div class="v2-proof-full" id="proofFull" hidden>
                <img id="proofImg" alt="">
                <div class="v2-proof-act">
                    <button type="button" class="v2-proof-link" id="proofChange">Ganti</button>
                    <button type="button" class="v2-proof-x" id="proofRemove"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
                </div>
            </div>
            <input type="file" id="proofCamIn" accept="image/*" capture="environment" hidden>
            <input type="file" id="proofGalIn" accept="image/*" hidden>
        </section>
        </div>

        <div class="v2-method" id="attMethod" role="tablist">
            <button type="button" data-m="face" role="tab" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><span data-i18n="att_m_face">Camera</span></button>
            <button type="button" class="on" data-m="fp" role="tab"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 18.5A9 9 0 0 1 4 12a8 8 0 0 1 16 0v1"/><path d="M8 12a4 4 0 0 1 8 0v1.5a10 10 0 0 1-1.2 4.8"/><path d="M12 12v2a12 12 0 0 1-2 6.5"/></svg><span data-i18n="att_m_fp">Fingerprint</span></button>
            <button type="button" data-m="qr" role="tab"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3M21 14v.01M14 21h7v-4"/></svg><span data-i18n="att_m_qr">QR</span></button>
        </div>

        <!-- QR mode: the student's own QR sent by the teacher (js/att-qr.js) -->
        <section class="v2-qr" id="qrArea" hidden>
            <div class="v2-qr-empty" id="qrEmpty" hidden>
                <span class="v2-qr-empty-ic"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3M21 14v.01M14 21h7v-4"/></svg></span>
                <b id="qrEmptyTitle"></b>
                <p id="qrEmptyText"></p>
            </div>
            <div class="v2-qr-pass" id="qrPass" hidden>
                <div class="v2-qr-card"><div class="v2-qr-code" id="qrCodeBox"></div></div>
                <div class="v2-qr-meta">
                    <small id="qrFrom"></small>
                    <b id="qrUntil"></b>
                    <span id="qrLeft"></span>
                </div>
                <button type="button" class="v2-qr-go" id="qrGo"></button>
                <p class="v2-qr-hint" id="qrHint"></p>
            </div>
        </section>

        <div id="faceArea" hidden>
        <section class="v2-cam">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="faceBoxCanvas"></canvas>
            <canvas id="canvas" style="display:none;"></canvas>
            <img id="photoPreview" alt="" style="display:none;">
            <div class="v2-cam-frame" aria-hidden="true"><i></i><i></i><i></i><i></i>
                <svg viewBox="0 0 150 186"><circle cx="75" cy="78" r="30"/><path d="M30 166c6-30 24-44 45-44s39 14 45 44"/></svg>
            </div>
            <p id="faceStatus"></p>
        </section>

        <div class="v2-cam-buttons">
            <button type="button" class="v2-btn-soft" onclick="startCamera()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><span data-i18n="btn_open_camera">Open Camera</span></button>
            <button type="button" class="v2-btn-soft" id="takePhotoBtn" onclick="takePhoto()" disabled><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="btn_take_photo">Take Photo</span></button>
        </div>

        </div>

        <!-- fingerprint mode: a panel right above the bottom menu with one big round button -->
        <section class="v2-fp" id="fpPanel">
            <button type="button" class="v2-fp-round" id="fpBtn" aria-label="Fingerprint"></button>
            <img class="v2-fp-snap" id="fpSnap" alt="" hidden>
            <b id="fpTitle"></b>
            <p id="fpText"></p>
            <div class="v2-fp-more" id="fpMore" hidden>
                <button type="button" class="v2-fp-link" id="fpChangeBtn"></button>
                <button type="button" class="v2-fp-link" id="fpTipBtn"></button>
            </div>
        </section>

        <!-- changing phones: face check first, then register this phone -->
        <div class="v2-fpchange" id="fpChangeBar" hidden>
            <div class="v2-fpchange-txt"><b id="fpChangeTitle"></b><small id="fpChangeText"></small></div>
            <div class="v2-fpchange-btns">
                <button type="button" class="v2-fpchange-cancel" id="fpChangeCancel"></button>
                <button type="button" class="v2-fpchange-go" id="fpChangeGo" disabled></button>
            </div>
        </div>

        <button type="button" class="v2-submit" onclick="saveAttendance()">
            <span data-i18n="btn_submit_attendance">Submit Attendance</span>
            <span class="v2-submit-arrow"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>

    </main>

    <script>
        function attT(key) {
            const e = translations[key];
            return (e && e[getLang()]) || key;
        }

        function tzLabel() {
            return attTzLabel();
        }

        function updateDateTime() {
            const now = attNow();
            const days = { en: ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], id: ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"] };
            const lang = getLang();
            document.getElementById("attendanceDate").textContent = (days[lang] || days.en)[now.getDay()] + ", " + now.getDate() + " " + monthNameOf(now.getMonth()).slice(0, 3);
            document.getElementById("currentTime").textContent = String(now.getHours()).padStart(2, "0") + "." + String(now.getMinutes()).padStart(2, "0") + " " + tzLabel();
            updateWindow(now);
        }

        let attSchedule = null, attRules = null;

        function updateWindow(now) {
            const box = document.getElementById("attWindow");
            const text = document.getElementById("attWindowText");
            const count = document.getElementById("attWindowCount");
            // check-out time, or today is done (js/att-checkout.js)
            if (window.attCheckout && window.attCheckout.paintWindow(box, text, count)) return;
            // a date the admin switched off (holiday), or a day that isn't a school day
            const todayStr = localDateStr(now);
            if (attRules && !attDayOpen(todayStr, attRules)) {
                const ag = attRules.agenda[todayStr];
                box.hidden = false; count.hidden = true; box.classList.add("closed");
                text.textContent = ag && ag.closed ? attT("toast_att_day_closed") + (ag.label ? " · " + ag.label : "") : attT("toast_schedule_day_inactive");
                return;
            }
            if (!attSchedule) { box.hidden = true; return; }
            const nowTime = now.toTimeString().slice(0, 5);
            const start = (attSchedule.start_time || "").slice(0, 5);
            const end = (attSchedule.end_time || "").slice(0, 5);
            const lateEnd = attSchedule.late_mode === "late" ? (attSchedule.late_end_time || "").slice(0, 5) : "";
            box.hidden = false;
            box.classList.remove("closed");
            count.hidden = false;

            let target = "";
            if (start && nowTime < start) { text.textContent = attT("att_opens_at") + " " + start.replace(":", "."); target = start; }
            else if (end && nowTime <= end) { text.textContent = attT("att_closes_at") + " " + end.replace(":", "."); target = end; }
            else if (lateEnd && nowTime <= lateEnd) { text.textContent = attT("att_late_until") + " " + lateEnd.replace(":", "."); target = lateEnd; }
            else if (end) { text.textContent = attT("att_closed"); count.hidden = true; box.classList.add("closed"); return; }
            else { box.hidden = true; return; }

            const p = target.split(":");
            const t = new Date(now); t.setHours(+p[0], +p[1], 0, 0);
            let sec = Math.max(0, Math.floor((t - now) / 1000));
            const h = Math.floor(sec / 3600); sec -= h * 3600;
            const m = Math.floor(sec / 60); const ss = sec - m * 60;
            count.textContent = (h > 0 ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(ss).padStart(2, "0");
        }

        async function loadSchedule() {
            const user = await requireLogin();
            if (!user) return;
            const profile = await attMyProfile(user.id);
            const ckey = attClassKey(profile);
            if (!ckey) return;
            attRules = await attDayRules(ckey);
            attSchedule = attRules.schedule;
            updateDateTime();
        }

        // who uses this page: students and teachers check in; admins and parents go to their own pages
        function attRolePage(role) {
            if (role === "admin") { location.replace("admin-attendance.html"); return false; }
            if (role === "orangtua") { location.replace("parent.html"); return false; }
            if (role === "guru") {
                // teachers have their own home; the student-only tabs are hidden
                document.documentElement.classList.add("att-teacher");
                const nav = document.querySelector(".bottom-nav");
                if (nav) {
                    const home = nav.querySelector('a[href="index.html"]');
                    if (home) home.setAttribute("href", "teacher.html");
                    ["dashboard.html", "history.html"].forEach(function (h) { const a = nav.querySelector('a[href="' + h + '"]'); if (a) a.style.display = "none"; });
                    const me = nav.querySelector('a[href="my-attendance.html"]');
                    if (me) me.setAttribute("href", "settings.html");
                }
            }
            return true;
        }
        try { attRolePage((JSON.parse(localStorage.getItem("attendreem-profile") || "{}")).role); } catch (e) {}
        (async function () {
            const user = await requireLogin();
            if (!user) return;
            const p = await attMyProfile(user.id);
            if (p) attRolePage(p.role);
        })();

        updateDateTime();
        setInterval(updateDateTime, 1000);
        loadSchedule();

        // STATUS PICKER
        const statusButtons = document.querySelectorAll(".v2-status");
        const statusInputs = document.querySelectorAll('input[name="status"]');

        function selectStatus(value) {
            statusButtons.forEach(function (btn) {
                const on = btn.dataset.value === value;
                btn.classList.toggle("selected", on);
                btn.setAttribute("aria-checked", on ? "true" : "false");
            });
            statusInputs.forEach(function (input) { input.checked = input.value === value; });
            document.getElementById("reasonBox").hidden = !value || value === "Hadir";
            if (window.attProofShow) attProofShow(value);
        }

        statusButtons.forEach(function (btn) {
            btn.addEventListener("click", function () { selectStatus(btn.dataset.value); });
        });

        // 2026: checking in is just "Hadir"; Izin / Sakit go through leave.html (link under the window)
        const attSimple = true;
        if (attSimple) { document.documentElement.classList.add("att-simple"); selectStatus("Hadir"); }
        window.resetStatusPicker = function () { selectStatus(attSimple ? "Hadir" : ""); };

        // the submit button looks "waiting" until a status is picked and the photo / fingerprint is done
        (function () {
            const btn = document.querySelector(".v2-submit");
            function sync() {
                const pickedEl = document.querySelector('input[name="status"]:checked');
                const reasonOk = !pickedEl || pickedEl.value === "Hadir" || document.getElementById("reason").value.trim() !== "";
                const ready = !!pickedEl && reasonOk && typeof attIdentityReady === "function" && attIdentityReady();
                btn.classList.toggle("is-waiting", !ready);
            }
            document.addEventListener("click", function () { setTimeout(sync, 60); }, true);
            document.getElementById("reason").addEventListener("input", sync);
            setInterval(sync, 500);
            sync();
        })();
    </script>

    <script>
let touchStartX = 0;
let touchEndX = 0;

document.addEventListener("touchstart", e => {
    touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener("touchend", e => {
    touchEndX = e.changedTouches[0].screenX;

    if (touchEndX - touchStartX < -80) {
        window.location.href = "dashboard.html";
    }

    if (touchEndX - touchStartX > 80) {
        window.location.href = "index.html";
    }
});


</script>
