<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Absensi - Attendreem</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="theme-color" content="#14162B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=20261030p">
<script src="js/theme.js?v=20261030p"></script>
<script src="js/lang.js?v=20261030p"></script>
<script src="js/toast.js?v=20261030p"></script>
</head>

<body class="v2-page">

<main class="v2-wrap v3-page tc-page aa-page">

    <header class="v2-head v3-head aa-head">
        <h1 id="aaTitle">Absensi</h1>
        <button type="button" class="aa-dl" id="aaCsv"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span id="aaCsvT">Unduh</span></button>
    </header>

    <div class="aa-date">
        <button type="button" id="aaPrev" aria-label="Hari sebelumnya"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <label class="aa-date-mid"><span id="aaDateT">&nbsp;</span><input type="date" id="aaDate" aria-label="Tanggal"></label>
        <button type="button" id="aaNext" aria-label="Hari berikutnya"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>

    <div class="tc-classes" id="aaClasses" role="tablist"></div>

    <div class="aa-stats" id="aaStats"></div>

    <div class="aa-tools">
        <label class="tc-search"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="aaQ" autocomplete="off" spellcheck="false" placeholder="Cari nama"></label>
        <button type="button" class="aa-remind" id="aaRemind" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span id="aaRemindT"></span></button>
    </div>

    <div class="tc-list" id="aaList"><div class="tc-empty">&nbsp;</div></div>
    <button type="button" class="ah-more aa-more" id="aaMore" hidden></button>

    <h2 class="v3-sec" id="aaTrendH">Tren 14 hari</h2>
    <section class="ts-card aa-trend">
        <svg id="trendChartSvg" viewBox="0 0 280 110" style="width:100%;height:110px;display:block"></svg>
        <div class="aa-legend"><span><i style="background:#22c55e"></i>90%+</span><span><i style="background:#f59e0b"></i>75–89%</span><span><i style="background:#ef4444"></i>&lt;75%</span><small id="trendRangeLabel"></small></div>
    </section>

</main>

<nav class="bottom-nav" id="mainNav"></nav>
<script src="js/nav.js?v=20261030p"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20261030p"></script>
<script src="js/auth.js?v=20261030p"></script>
<script src="js/teacher-core.js?v=20261030p"></script>

<script>
const L = TC.L;
const ID = getLang() === "id";
document.getElementById("aaTitle").textContent = L("Absensi", "Attendance");
document.getElementById("aaCsvT").textContent = L("Unduh", "Download");
document.getElementById("aaQ").placeholder = L("Cari nama", "Search name");
document.getElementById("aaTrendH").textContent = L("Tren 14 hari", "Last 14 days");

let me = null, students = [], teachers = [], recs = {}, scope = "all", day = "", focus = "", q = "", shown = 60;
let openBy = {};   // class -> is the chosen day a check-in day for it (weekend / agenda day off)
const DAYS_EN = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const DAY_L = ID ? ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"] : DAYS_EN;
const MON_L = ID ? ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"] : ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const ST = { Hadir: L("Hadir", "Present"), Izin: L("Izin", "Leave"), Sakit: L("Sakit", "Sick"), Alpa: L("Alpa", "Absent") };

function addDays(s, n) { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return localDateStr(d); }
function hm(t) { return t ? String(t).slice(0, 5).replace(":", ".") : ""; }

async function start() {
    const user = await requireLogin();
    if (!user) return;
    const prof = await attMyProfile(user.id);
    if (!prof || prof.role !== "admin") { location.replace("index.html"); return; }
    me = user;
    const [s, t] = await Promise.all([
        supabaseClient.from("profiles").select("id, name, class, status").eq("role", "murid").order("name", { ascending: true }),
        supabaseClient.from("profiles").select("id, name, status").eq("role", "guru").order("name", { ascending: true })
    ]);
    students = ((s.data) || []).filter(x => x.status !== "inactive");
    teachers = ((t.data) || []).filter(x => x.status !== "inactive").map(x => ({ id: x.id, name: x.name, class: "Guru" }));
    const classes = Array.from(new Set(students.map(x => x.class).filter(c => c && c !== "Guru"))).sort((a, b) => a.localeCompare(b, "id", { numeric: true }));
    const chips = [["all", L("Semua kelas", "All classes")]].concat(classes.map(c => [c, c])).concat(teachers.length ? [["Guru", L("Guru", "Teachers")]] : []);
    document.getElementById("aaClasses").innerHTML = chips.map(c => `<button type="button" role="tab" data-c="${escapeHTML(c[0])}">${escapeHTML(c[1])}</button>`).join("");
    day = new URLSearchParams(location.search).get("date") || localDateStr();
    await loadDay();
    loadTrend();
}

function people() {
    if (scope === "Guru") return teachers;
    if (scope === "all") return students;
    return students.filter(x => x.class === scope);
}

async function loadDay() {
    const d = new Date(day + "T00:00:00");
    document.getElementById("aaDateT").textContent = DAY_L[d.getDay()] + ", " + d.getDate() + " " + MON_L[d.getMonth()] + (d.getFullYear() !== attNow().getFullYear() ? " " + d.getFullYear() : "");
    document.getElementById("aaDate").value = day;
    document.getElementById("aaNext").disabled = day >= localDateStr();
    const { data } = await supabaseClient.from("attendance").select("*").eq("date", day);
    const keys = Array.from(new Set(students.map(x => x.class).filter(Boolean).concat(teachers.length ? ["Guru"] : [])));
    const rules = await Promise.all(keys.map(k => attDayRules(k)));
    openBy = {};
    keys.forEach((k, i) => { openBy[k] = attDayOpen(day, rules[i]); });
    recs = {};
    (data || []).forEach(r => { recs[r.user_id] = r; });
    shown = 60;
    render();
}

function render() {
    document.querySelectorAll("#aaClasses button").forEach(b => { const on = b.dataset.c === scope; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
    const list = people();
    const cnt = { Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0, none: 0 };
    const isOff = p => openBy[p.class] === false;
    list.forEach(p => { const r = recs[p.id]; if (!r) { if (!isOff(p)) cnt.none++; } else if (cnt[r.status] != null) cnt[r.status]++; });
    const allOff = list.length && list.every(isOff);
    const tiles = [["Hadir", ST.Hadir, cnt.Hadir, ""], ["Izin", ST.Izin, cnt.Izin, ""], ["Sakit", ST.Sakit, cnt.Sakit, ""], allOff ? ["off", L("Libur", "Day off"), "–", ""] : ["none", L("Belum", "Not yet"), cnt.none, cnt.none ? "no" : ""]];
    if (cnt.Alpa) tiles.splice(3, 0, ["Alpa", ST.Alpa, cnt.Alpa, "no"]);
    const st = document.getElementById("aaStats");
    st.style.setProperty("--n", tiles.length);
    st.innerHTML = tiles.map(t => `<button type="button" class="ts-stat${focus === t[0] ? " on" : ""}" data-f="${t[0]}"><span>${t[1]}</span><b class="${t[3]}">${t[2]}</b></button>`).join("");

    const today = day === localDateStr();
    const rb = document.getElementById("aaRemind");
    rb.hidden = !(today && cnt.none);
    document.getElementById("aaRemindT").textContent = L("Ingatkan " + cnt.none, "Remind " + cnt.none);

    const needle = q.toLowerCase();
    let rows = list.filter(p => {
        const r = recs[p.id];
        if (focus === "none" && (r || isOff(p))) return false;
        if (focus === "off") return false;
        if (focus && focus !== "none" && (!r || r.status !== focus)) return false;
        return !needle || (p.name || "").toLowerCase().includes(needle);
    });
    // not checked in first on today, then by name
    if (today && !focus) rows.sort((a, b) => (recs[a.id] ? 1 : 0) - (recs[b.id] ? 1 : 0) || (a.name || "").localeCompare(b.name || "", "id"));
    const box = document.getElementById("aaList");
    const more = document.getElementById("aaMore");
    if (!rows.length) { box.innerHTML = `<div class="tc-empty">${needle ? L("Tidak ada nama itu", "No match") : L("Tidak ada data", "Nothing here")}</div>`; more.hidden = true; return; }
    box.innerHTML = rows.slice(0, shown).map(p => {
        const r = recs[p.id];
        const sub = [scope === "all" ? p.class : "", r && r.time ? hm(r.time) + (r.checkout_time ? " → " + hm(r.checkout_time) : "") : "", r && r.reason ? r.reason : "", r && r.checkout_reason ? r.checkout_reason : ""].filter(Boolean).join(" · ");
        const pill = !r ? `<span class="tc-pill">${isOff(p) ? L("Libur", "Day off") : L("Belum", "Not yet")}</span>` : `<span class="tc-pill ${r.status === "Hadir" ? "ok" : r.status === "Izin" ? "izin" : "no"}">${escapeHTML(ST[r.status] || r.status || "-")}</span>`;
        const pics = r ? [r.photo_url ? `<span class="aa-pic" data-p="${escapeHTML(r.photo_url)}"></span>` : "", r.proof_url ? `<span class="aa-pic doc" data-p="${escapeHTML(r.proof_url)}"></span>` : ""].join("") : "";
        return `<button type="button" class="ts-row aa-row" data-u="${p.id}"><div class="ts-row-t"><b>${escapeHTML(p.name || "-")}</b>${sub ? `<small>${escapeHTML(sub)}</small>` : ""}</div>${pics}${pill}</button>`;
    }).join("");
    more.hidden = rows.length <= shown;
    more.textContent = L("Tampilkan lagi (" + (rows.length - shown) + ")", "Show more (" + (rows.length - shown) + ")");
    signPics();
}

// selfie / letter thumbnails, private files with a 1-hour link
const picCache = {};
async function signPics() {
    const els = Array.from(document.querySelectorAll(".aa-pic[data-p]"));
    const need = Array.from(new Set(els.map(e => e.dataset.p).filter(p => !picCache[p])));
    const bucket = supabaseClient.storage.from("attendance-photos");
    if (need.length && bucket.createSignedUrls) {
        const { data } = await bucket.createSignedUrls(need, 3600);
        (data || []).forEach(x => { if (x && x.signedUrl && x.path) picCache[x.path] = x.signedUrl; });
    } else {
        for (const p of need) { const { data } = await bucket.createSignedUrl(p, 3600); if (data && data.signedUrl) picCache[p] = data.signedUrl; }
    }
    els.forEach(e => { const u = picCache[e.dataset.p]; if (u) e.style.backgroundImage = "url('" + u.replace(/'/g, "%27") + "')"; else e.remove(); });
}

/* correct one person's day */
async function edit(p) {
    const r = recs[p.id];
    const pics = r ? [r.photo_url, r.proof_url].filter(Boolean) : [];
    const v = await TC.sheet({
        title: p.name || "-",
        sub: (p.class || "") + " · " + document.getElementById("aaDateT").textContent + (r && r.time ? " · " + L("absen ", "in ") + hm(r.time) : ""),
        ok: L("Simpan", "Save"), noFocus: true,
        danger: pics.length ? L("Lihat foto", "Photo") : "",
        fields: [
            { name: "status", label: L("Status", "Status"), type: "seg", value: r ? r.status : "", options: [["Hadir", ST.Hadir], ["Izin", ST.Izin], ["Sakit", ST.Sakit], ["Alpa", ST.Alpa]] },
            { name: "reason", label: L("Keterangan", "Note"), value: r ? (r.reason || "") : "", optional: true }
        ],
        check: v => v.status ? "" : L("Pilih statusnya dulu", "Pick a status")
    });
    if (!v) return;
    if (v.__danger) {
        await signPics();
        pics.forEach(x => { const u = picCache[x]; if (u) window.open(u, "_blank", "noopener"); });
        return;
    }
    if (r && r.status === v.status && (r.reason || "") === v.reason) { attNoChange(); return; }
    const payload = { user_id: p.id, name: p.name || "-", class: p.class || null, date: day, day: DAYS_EN[new Date(day + "T00:00:00").getDay()], status: v.status, reason: v.reason };
    const res = r ? await supabaseClient.from("attendance").update(payload).eq("id", r.id) : await supabaseClient.from("attendance").insert([payload]);
    if (res.error) { showToast(L("Gagal menyimpan: ", "Could not save: ") + res.error.message, "error"); return; }
    showToast(r ? L("Absen diperbaiki", "Attendance corrected") : L("Absen ditambahkan", "Attendance added"), "success");
    await loadDay();
}

/* reminder to the ones missing today */
async function remind() {
    const btn = document.getElementById("aaRemind");
    // never remind on a day off
    const missing = people().filter(p => !recs[p.id] && openBy[p.class] !== false);
    if (!missing.length) return;
    const ok = await attConfirmSafe(L("Kirim pengingat ke " + missing.length + " orang?", "Remind " + missing.length + " people?"), L("Mereka akan dapat notifikasi untuk absen.", "They get a notification to check in."));
    if (!ok) return;
    btn.disabled = true;
    const msg = translations.text_attendance_reminder_message[getLang()];
    const { error } = await supabaseClient.from("broadcasts").insert(missing.map(s => ({ message: msg, target_type: "student", target_value: s.id, created_by: me.id })));
    btn.disabled = false;
    if (error) { showToast(L("Gagal: ", "Failed: ") + error.message, "error"); return; }
    showToast(L("Pengingat terkirim ke " + missing.length + " orang", "Sent to " + missing.length), "success");
}
function attConfirmSafe(title, text) { return window.attConfirm ? attConfirm({ title: title, text: text, ok: L("Kirim", "Send") }) : Promise.resolve(confirm(title)); }

/* CSV of the day, in the chosen scope (with who has no record) */
function csv() {
    const e = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const lines = [["Name", "Class", "Date", "Day", "Time", "Status", "Reason", "Check-out", "Check-out note"].join(",")];
    people().forEach(p => {
        const r = recs[p.id] || {};
        lines.push([p.name, p.class, day, r.day || DAYS_EN[new Date(day + "T00:00:00").getDay()], r.time ? String(r.time).slice(0, 5) : "", r.status ? (ST[r.status] || r.status) : (openBy[p.class] === false ? L("Libur", "Day off") : L("Belum absen", "Not checked in")), r.reason, r.checkout_time ? String(r.checkout_time).slice(0, 5) : "", r.checkout_reason].map(e).join(","));
    });
    const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = ("absensi_" + day + (scope !== "all" ? "_" + scope : "") + ".csv").replace(/[^a-zA-Z0-9._-]/g, "_");
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    showToast(L("File CSV diunduh", "CSV downloaded"), "success");
}

/* last 14 days (Hadir share of the chosen scope) */
async function loadTrend() {
    const scoped = people(), total = scoped.length, ids = new Set(scoped.map(x => x.id));
    const days = []; for (let i = 13; i >= 0; i--) days.push(addDays(localDateStr(), -i));
    const { data } = await supabaseClient.from("attendance").select("user_id,date,status").gte("date", days[0]).lte("date", days[13]);
    const by = {}; days.forEach(d => by[d] = 0);
    (data || []).forEach(r => { if (ids.has(r.user_id) && r.status === "Hadir" && by[r.date] != null) by[r.date]++; });
    const col = p => p >= 90 ? "#22c55e" : p >= 75 ? "#f59e0b" : "#ef4444";
    document.getElementById("trendChartSvg").innerHTML = days.map((d, i) => {
        const p = total ? Math.round(by[d] / total * 100) : 0, h = Math.max(2, p / 100 * 90), x = i * 20 + 4;
        return `<rect x="${x}" y="${100 - h}" width="14" height="${h}" rx="3" fill="${col(p)}"><title>${d}: ${p}%</title></rect><text x="${x + 7}" y="108" text-anchor="middle" font-size="7" fill="#9A9DB0">${new Date(d + "T00:00:00").getDate()}</text>`;
    }).join("");
    document.getElementById("trendRangeLabel").textContent = dayMonthLabel(new Date(days[0] + "T00:00:00")) + " – " + dayMonthLabel(new Date(days[13] + "T00:00:00"));
}

document.getElementById("aaClasses").addEventListener("click", e => { const b = e.target.closest("button[data-c]"); if (!b) return; scope = b.dataset.c; focus = ""; shown = 60; render(); loadTrend(); });
document.getElementById("aaStats").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (!b) return; focus = focus === b.dataset.f ? "" : b.dataset.f; render(); });
document.getElementById("aaQ").addEventListener("input", function () { q = this.value.trim(); render(); });
document.getElementById("aaList").addEventListener("click", e => { const b = e.target.closest("[data-u]"); if (!b) return; const p = people().find(x => x.id === b.dataset.u); if (p) edit(p); });
document.getElementById("aaMore").addEventListener("click", () => { shown += 100; render(); });
document.getElementById("aaPrev").addEventListener("click", () => { day = addDays(day, -1); loadDay(); });
document.getElementById("aaNext").addEventListener("click", () => { if (day < localDateStr()) { day = addDays(day, 1); loadDay(); } });
document.getElementById("aaDate").addEventListener("change", function () { if (this.value) { day = this.value > localDateStr() ? localDateStr() : this.value; loadDay(); } });
document.getElementById("aaRemind").addEventListener("click", remind);
document.getElementById("aaCsv").addEventListener("click", csv);
window.addEventListener("tabshow", () => { if (me) loadDay(); });
start();
</script>
<script src="js/avatarcrop.js?v=20261030p"></script>
</body>
</html>
