<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kantin - Attendreem</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=7">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=6">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=6">
<meta name="theme-color" content="#14162B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=20261106c">
<script src="js/theme.js?v=20261106c"></script>
<script src="js/lang.js?v=20261106c"></script>
<script src="js/toast.js?v=20261106c"></script>
<script src="js/fit.js?v=20261106c" defer></script>
<script src="js/avatarcrop.js?v=20261106c"></script>
<script src="js/money-input.js?v=20261106c"></script>
</head>

<body class="v2-page">

<main class="v2-wrap kn-page">

    <header class="v2-head v3-head kn-head">
        <div class="lsn-head-text">
            <h1 id="knTitle">Kantin</h1>
            <p class="kn-sub" id="knSub">&nbsp;</p>
        </div>
        <div class="kn-head-r">
            <span class="kn-pill" id="knPill" hidden></span>
            <button type="button" class="kn-search-btn" id="knSearchBtn" hidden aria-label="Cari"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
        </div>
    </header>

    <!-- ===== student ===== -->
    <section id="knStudent" hidden>
        <div class="savings-tab-switch kn-tabs" id="knStuTabs">
            <button type="button" class="savings-tab-btn active" data-tab="menu"></button>
            <button type="button" class="savings-tab-btn" data-tab="mine"></button>
        </div>
        <div data-pane="menu">
            <div class="kn-search" id="knSearch" hidden>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                <input type="search" id="knSearchIn" autocomplete="off" enterkeyhint="search">
                <button type="button" id="knSearchX" aria-label="Tutup"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
            </div>
            <button type="button" class="kn-payqr" id="knPayQr"></button>
            <div class="kn-grid" id="knMenu"></div>
        </div>
        <div data-pane="mine" hidden>
            <div id="knMine"></div>
        </div>
    </section>

    <!-- ===== canteen staff / admin ===== -->
    <section id="knStaff" hidden>
        <div class="savings-tab-switch kn-tabs" id="knStaffTabs">
            <button type="button" class="savings-tab-btn active" data-tab="orders"></button>
            <button type="button" class="savings-tab-btn" data-tab="kasir"></button>
            <button type="button" class="savings-tab-btn" data-tab="items"></button>
            <button type="button" class="savings-tab-btn" data-tab="report"></button>
        </div>
        <div data-pane="orders"><div id="knOrders"></div></div>
        <div data-pane="kasir" hidden><div class="kn-grid" id="knKasir"></div></div>
        <div data-pane="items" hidden>
            <button type="button" class="kn-add" id="knAddItem"></button>
            <div id="knItems"></div>
        </div>
        <div data-pane="report" hidden>
            <div id="knReport"></div>
            <div id="knStaffList" hidden></div>
        </div>
    </section>

    <!-- cart / total bar (student menu and staff kasir) -->
    <div class="kn-cart" id="knCart" hidden>
        <div><small id="knCartN"></small><b id="knCartT">Rp0</b></div>
        <div class="kn-cart-btns" id="knCartBtns"></div>
    </div>

</main>

<nav class="bottom-nav" id="mainNav"></nav>
<script src="js/nav.js?v=20261106c"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20261106c"></script>
<script src="js/auth.js?v=20261106c"></script>
<script src="js/fin-tabs.js?v=20261106c"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="js/kantin.js?v=20261106c"></script>
</body>
</html>
