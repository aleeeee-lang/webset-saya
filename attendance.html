    <script>
        function attT(key) {
            const e = translations[key];
            return (e && e[getLang()]) || key;
        }

        function tzLabel() {
            const off = -new Date().getTimezoneOffset() / 60;
            if (off === 7) return "WIB";
            if (off === 8) return "WITA";
            if (off === 9) return "WIT";
            return "GMT" + (off >= 0 ? "+" : "") + off;
        }

        function updateDateTime() {
            const now = new Date();
            const days = { en: ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], id: ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"] };
            const lang = getLang();
            document.getElementById("attendanceDate").textContent = (days[lang] || days.en)[now.getDay()] + ", " + now.getDate() + " " + monthNameOf(now.getMonth()).slice(0, 3);
            document.getElementById("currentTime").textContent = String(now.getHours()).padStart(2, "0") + "." + String(now.getMinutes()).padStart(2, "0") + " " + tzLabel();
            updateWindow(now);
        }

        let attSchedule = null;

        function updateWindow(now) {
            const box = document.getElementById("attWindow");
            if (!attSchedule) { box.hidden = true; return; }
            const isoDay = now.getDay() === 0 ? 7 : now.getDay();
            const active = attSchedule.active_days || [];
            const nowTime = now.toTimeString().slice(0, 5);
            const start = (attSchedule.start_time || "").slice(0, 5);
            const end = (attSchedule.end_time || "").slice(0, 5);
            const lateEnd = attSchedule.late_mode === "late" ? (attSchedule.late_end_time || "").slice(0, 5) : "";
            const text = document.getElementById("attWindowText");
            const count = document.getElementById("attWindowCount");
            box.hidden = false;
            box.classList.remove("closed");
            count.hidden = false;

            if (active.length && active.indexOf(isoDay) === -1) {
                text.textContent = attT("toast_schedule_day_inactive");
                count.hidden = true;
                box.classList.add("closed");
                return;
            }

            let target = "";
            if (start && nowTime < start) { text.textContent = attT("att_opens_at") + " " + start.replace(":", "."); target = start; }
            else if (end && nowTime <= end) { text.textContent = attT("att_closes_at") + " " + end.replace(":", "."); target = end; }
            else if (lateEnd && nowTime <= lateEnd) { text.textContent = attT("att_late_until") + " " + lateEnd.replace(":", "."); target = lateEnd; }
            else if (end) { text.textContent = attT("att_closed"); count.hidden = true; box.classList.add("closed"); return; }
            else { box.hidden = true; return; }

            const p = target.split(":");
            const t = new Date(now); t.setHours(+p[0], +p[1], 0, 0);
            let sec = Math.max(0, Math.floor((t - now) / 1000));
            const h = Math.floor(sec / 3600); sec -= h * 3600;
            const m = Math.floor(sec / 60); const ss = sec - m * 60;
            count.textContent = (h > 0 ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(ss).padStart(2, "0");
        }

        async function loadSchedule() {
            const user = await requireLogin();
            if (!user) return;
            const { data: profile } = await supabaseClient.from("profiles").select("class").eq("id", user.id).maybeSingle();
            if (!profile || !profile.class) return;
            const { data } = await supabaseClient.from("attendance_schedules").select("*").eq("class", profile.class).maybeSingle();
            attSchedule = data || null;
            updateDateTime();
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);
        loadSchedule();

        // STATUS PICKER
        const statusButtons = document.querySelectorAll(".v2-status");
        const statusInputs = document.querySelectorAll('input[name="status"]');

        function selectStatus(value) {
            statusButtons.forEach(function (btn) {
                const on = btn.dataset.value === value;
                btn.classList.toggle("selected", on);
                btn.setAttribute("aria-checked", on ? "true" : "false");
            });
            statusInputs.forEach(function (input) { input.checked = input.value === value; });
            document.getElementById("reasonBox").hidden = !value || value === "Hadir";
        }

        statusButtons.forEach(function (btn) {
            btn.addEventListener("click", function () { selectStatus(btn.dataset.value); });
        });

        window.resetStatusPicker = function () { selectStatus(""); };
    </script>

    <script>
let touchStartX = 0;
let touchEndX = 0;

document.addEventListener("touchstart", e => {
    touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener("touchend", e => {
    touchEndX = e.changedTouches[0].screenX;

    if (touchEndX - touchStartX < -80) {
        window.location.href = "dashboard.html";
    }

    if (touchEndX - touchStartX > 80) {
        window.location.href = "index.html";
    }
});


</script>
