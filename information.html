<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Information - Attendreem</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css?v=20261010c">
<script src="js/theme.js?v=20261010c"></script>
<script src="js/lang.js?v=20261010c"></script>
<script src="js/toast.js?v=20261010c"></script>
</head>

<body>

<main class="attendance-page">

    <section class="attendance-intro" style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
        <button type="button" onclick="goBack()" aria-label="Back" style="width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:10px;background:transparent;color:#20243a;cursor:pointer;padding:0">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <h2 style="margin:0" data-i18n="page_information">Information</h2>
    </section>

    <section class="attendance-card" style="padding:8px 16px">
        <div style="display:flex;gap:8px;padding:12px 0 4px;flex-wrap:wrap">
            <button type="button" class="am-btn info-filter-btn" id="infoFilterAllBtn" data-filter="all" onclick="setInfoFilter('all')" style="flex:0 0 auto;white-space:nowrap;padding:9px 16px;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer" data-i18n="label_filter_all">All</button>
            <button type="button" class="am-btn info-filter-btn" id="infoFilterPengumumanBtn" data-filter="pengumuman" onclick="setInfoFilter('pengumuman')" style="flex:0 0 auto;white-space:nowrap;padding:9px 16px;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer" data-i18n="label_category_pengumuman">Announcement</button>
            <button type="button" class="am-btn info-filter-btn" id="infoFilterJadwalBtn" data-filter="jadwal" onclick="setInfoFilter('jadwal')" style="flex:0 0 auto;white-space:nowrap;padding:9px 16px;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer" data-i18n="label_category_jadwal">Schedule</button>
            <button type="button" class="am-btn info-filter-btn" id="infoFilterLainnyaBtn" data-filter="lainnya" onclick="setInfoFilter('lainnya')" style="flex:0 0 auto;white-space:nowrap;padding:9px 16px;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer" data-i18n="label_category_lainnya">Other</button>
        </div>
    </section>

    <section class="attendance-card">
        <div class="card-label" data-i18n="label_all_info">Information</div>
        <div id="infoList" style="display:flex;flex-direction:column;gap:10px"></div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20261010c"></script>
<script src="js/auth.js?v=20261010c"></script>

<script>

const infoCategoryColors = {
    pengumuman: { hue: "37,99,235", labelKey: "label_category_pengumuman" },
    jadwal: { hue: "13,148,136", labelKey: "label_category_jadwal" },
    lainnya: { hue: "217,119,6", labelKey: "label_category_lainnya" }
};

let allInfo = [];
let currentInfoFilter = "all";

function renderInfoFilterButtons() {
    const activeHue = "20,22,43";
    ["all", "pengumuman", "jadwal", "lainnya"].forEach(function (f) {
        const btn = document.getElementById(
            f === "all" ? "infoFilterAllBtn" :
            f === "pengumuman" ? "infoFilterPengumumanBtn" :
            f === "jadwal" ? "infoFilterJadwalBtn" : "infoFilterLainnyaBtn"
        );
        const isActive = f === currentInfoFilter;
        btn.classList.toggle("v2-chip-on", isActive);
        btn.style.background = "";
        btn.style.color = "";
        btn.style.border = "";
    });
}

function setInfoFilter(f) {
    currentInfoFilter = f;
    renderInfoFilterButtons();
    renderInfoList();
}

async function loadInfo() {
    const { data, error } = await supabaseClient
        .from("school_info")
        .select("*")
        .order("created_at", { ascending: false });

    allInfo = (error || !data) ? [] : data;
    renderInfoList();
}

function renderInfoList() {
    const container = document.getElementById("infoList");
    const lang = getLang();

    let list = allInfo;
    if (currentInfoFilter !== "all") list = list.filter(i => i.category === currentInfoFilter);

    if (list.length === 0) {
        container.innerHTML = "<p style='color:#888;font-size:13px'>" + translations.text_no_info_yet[lang] + "</p>";
        return;
    }

    container.innerHTML = list.map(function (i) {
        const meta = infoCategoryColors[i.category] || infoCategoryColors.lainnya;
        const catLabel = translations[meta.labelKey] ? translations[meta.labelKey][lang] : i.category;
        const date = new Date(i.created_at);
        const timeStr = isNaN(date.getTime()) ? "" : dayMonthYearLabel(date);

        return `
            <div class="am-row" style="display:flex;flex-direction:column;gap:6px;padding:14px;background:#f8f8ff;border-radius:14px">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
                    <span style="display:inline-block;padding:3px 9px;border-radius:999px;background:rgba(${meta.hue},0.14);color:rgb(${meta.hue});font-size:11px;font-weight:600">${catLabel}</span>
                    <span style="font-size:11px;color:#aaa">${timeStr}</span>
                </div>
                <strong style="font-size:15px;color:#20243a">${i.title}</strong>
                <span style="font-size:13px;color:#555;white-space:pre-line;line-height:1.5">${i.body}</span>
            </div>
        `;
    }).join("");
}

async function init() {
    const user = await requireLogin();
    if (!user) return;

    renderInfoFilterButtons();
    await loadInfo();
}

init();

function goBack() {
    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        history.back();
    } else {
        window.location.href = "index.html";
    }
}

</script>

</body>
</html>
