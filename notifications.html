<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notifikasi - Attendreem</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="theme-color" content="#14162B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=20261031p">
<script src="js/theme.js?v=20261031p"></script>
<script src="js/lang.js?v=20261031p"></script>
<script src="js/toast.js?v=20261031p"></script>
<script src="js/fit.js?v=20261031p" defer></script>
</head>

<body>

<main class="attendance-page notif-page">

    <section class="attendance-intro" style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
        <button type="button" onclick="goBack()" aria-label="Back" style="width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;border-radius:10px;background:transparent;color:#20243a;cursor:pointer;padding:0">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <h2 style="margin:0" data-i18n="notif_page">Notifications</h2>
    </section>

    <section class="attendance-card att-app-card" style="padding:8px 16px">
        <div class="att-app-row">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <div class="att-app-text"><span data-i18n="push_title">Task reminders on this device</span><small id="pushHint"></small></div>
            <label class="att-switch"><input type="checkbox" id="pushToggle"><span></span></label>
        </div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js?v=20261031p"></script>
<script src="js/auth.js?v=20261031p"></script>

<script>
requireLogin();
// ===== Push notifications on this device + which kinds =====
function pushT(k) { return translations[k] ? translations[k][getLang()] : k; }
async function syncAppCard() {
    if (!window.AttPush) return;
    const P = window.AttPush;

    const tg = document.getElementById("pushToggle"), ph = document.getElementById("pushHint");
    tg.disabled = false;
    if (!P.supported() && !P.isIOS()) { tg.checked = false; tg.disabled = true; ph.textContent = pushT("push_unsupported"); return; }
    if (P.needsInstallFirst()) { tg.checked = false; tg.disabled = true; ph.textContent = pushT("push_ios_first"); return; }
    if (P.permission() === "denied") { tg.checked = false; ph.textContent = pushT("push_blocked"); return; }
    tg.checked = await P.isEnabled();
    ph.textContent = pushT(tg.checked ? "push_on_hint" : "push_off_hint");
    if (tg.checked) allKindsOn();
}
// One switch for everything: when notifications are on, every kind is on
// (turns back on any kind switched off on the old per-kind screen)
async function allKindsOn() {
    try {
        const s = await supabaseClient.auth.getSession();
        const uid = s && s.data && s.data.session ? s.data.session.user.id : null;
        if (!uid) return;
        const { data, error } = await supabaseClient.from("notif_prefs").select("*").eq("user_id", uid).maybeSingle();
        if (error || !data) return;                 // no row = everything on already
        const row = { user_id: uid }; let off = false;
        Object.keys(data).forEach(function (k) { if (typeof data[k] === "boolean") { row[k] = true; if (!data[k]) off = true; } });
        if (!off) return;
        row.updated_at = new Date().toISOString();
        await supabaseClient.from("notif_prefs").upsert(row, { onConflict: "user_id" });
    } catch (e) {}
}
document.getElementById("pushToggle").addEventListener("change", async function () {
    const tg = this, ph = document.getElementById("pushHint");
    tg.disabled = true;
    if (tg.checked) {
        ph.textContent = pushT("push_working");
        const r = await window.AttPush.enable();
        if (r.ok) {
            showToast(pushT("push_enabled_toast"), "success");
            try { const reg = await navigator.serviceWorker.ready; reg.showNotification("Attendreem", { body: pushT("push_test_body"), badge: "badge-96.png" }); } catch (e) {}
        } else {
            const map = { denied: "push_blocked", "ios-install": "push_ios_first", unsupported: "push_unsupported" };
            showToast(pushT(map[r.reason] || "push_failed") + (r.error && r.error.message ? " (" + r.error.message + ")" : ""), "error");
        }
    } else {
        await window.AttPush.disable();
        showToast(pushT("push_disabled_toast"), "success");
    }
    syncAppCard();
});
window.addEventListener("attendreem-install", syncAppCard);
(function waitPush(n) { if (window.AttPush) syncAppCard(); else if (n < 40) setTimeout(function () { waitPush(n + 1); }, 100); })(0);

function goBack() {
    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) history.back();
    else window.location.href = "settings.html";
}
</script>

</body>
</html>
