<script>

const darkToggle = document.getElementById("darkModeToggle");
const darkSlider = document.getElementById("darkModeSlider");
const darkKnob = document.getElementById("darkModeKnob");

function syncDarkUI(isDark) {
    darkToggle.checked = isDark;
    darkSlider.style.background = isDark ? "#2541ff" : "#e2e8f0";
    darkKnob.style.transform = isDark ? "translateX(18px)" : "translateX(0)";
}

syncDarkUI(document.documentElement.getAttribute("data-theme") === "dark");

document.querySelector("label").addEventListener("click", function (e) {
    e.preventDefault();
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    setTheme(isDark ? "light" : "dark");
    syncDarkUI(!isDark);
});

async function loadAccountInfo() {

    const user = await requireLogin();
    if (!user) return;

    const { data: profile } = await supabaseClient
        .from("profiles")
        .select("name, class, role")
        .eq("id", user.id)
        .single();

    document.getElementById("settingsEmail").textContent = user.email;

    if (profile) {
        document.getElementById("settingsName").textContent = profile.name || "-";
        document.getElementById("settingsClass").textContent =
            profile.role === "admin" ? translations.label_admin[getLang()] : (profile.class || "-");

        if (profile.role === "admin") {
            document.getElementById("adminSettingsSection").style.display = "block";
        }
    }

}
    function syncLangUI() {
    const lang = getLang();
    document.getElementById("langIdBtn").classList.toggle("active", lang === "id");
    document.getElementById("langEnBtn").classList.toggle("active", lang === "en");
}

syncLangUI();

document.getElementById("langIdBtn").addEventListener("click", function () {
    setLang("id");
    syncLangUI();
});

document.getElementById("langEnBtn").addEventListener("click", function () {
    setLang("en");
    syncLangUI();
});

loadAccountInfo();

function goBack() {
    if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
        history.back();
    } else {
        window.location.href = "my-attendance.html";
    }
}

</script>
