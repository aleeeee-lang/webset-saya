<script>
const esc = Lessons.esc;
function tr(key) { const t = translations[key]; return t ? t[getLang()] : key; }
const IC = {
    check: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>',
    clock: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    person: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
    note: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6"/></svg>',
    camera: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    image: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>',
    trash: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/></svg>',
    empty: '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 9l2 2 4-4M8 15h8"/></svg>'
};

let me = null, myClass = "", tasks = [], lessons = [], teacherNames = {}, filter = "open";
let teacherMode = false, myClasses = [], studentsByClass = {}, doneMap = {};

function goBack() {
    if (document.referrer && document.referrer.indexOf(location.host) !== -1 && history.length > 1) history.back();
    else location.href = "index.html";
}

async function load() {
    if (teacherMode) return tLoad();
    const res = await Tasks.fetchMine(supabaseClient, me.id, myClass);
    if (res.error) {
        document.getElementById("tskList").innerHTML = '<div class="lsn-empty big">' + IC.empty + '<b>' + tr("tsk_setup_title") + '</b><small>' + tr("tsk_setup_text") + '</small></div>';
        document.getElementById("tskAddBtn").hidden = true;
        return;
    }
    tasks = res.tasks;
    const creators = Array.from(new Set(tasks.filter(function (t) { return t.class; }).map(function (t) { return t.created_by; }))).filter(function (id) { return !(id in teacherNames); });
    if (creators.length) {
        const r = await supabaseClient.from("profiles").select("id,name").in("id", creators);
        (r.data || []).forEach(function (p) { teacherNames[p.id] = p.name; });
    }
    render();
}

function groupOf(t) { return t.done ? "done" : Tasks.bucket(t); }

function cardHTML(t) {
    const d = Tasks.dueLabel(t), g = groupOf(t);
    const from = t.class ? '<span class="tsk-from">' + IC.person + esc(teacherNames[t.created_by] || tr("tsk_from_teacher")) + '</span>' : '';
    const subj = t.subject ? '<span class="tsk-subj t-' + Lessons.tone(t.subject) + '">' + esc(t.subject) + '</span>' : '';
    return '<article class="tsk-item g-' + g + (t.done ? ' done' : '') + '" data-id="' + t.id + '">' +
        '<button type="button" class="tsk-check" data-act="toggle" aria-pressed="' + t.done + '" aria-label="' + tr(t.done ? "tsk_mark_undone" : "tsk_mark_done") + '">' + IC.check + '</button>' +
        '<div class="tsk-body"><div class="tsk-top">' + subj + from + '</div>' +
        '<strong class="tsk-title">' + esc(t.title) + '</strong>' +
        '<div class="tsk-due">' + IC.clock + '<span>' + esc(d.when) + '</span>' + (t.done ? '' : '<em>' + esc(d.rel) + '</em>') + (t.description ? '<i class="tsk-has-note">' + IC.note + '</i>' : '') + '</div></div>' +
        (t.done ? '<button type="button" class="tsk-trash" data-act="trash" aria-label="' + tr("tsk_trash") + '" title="' + tr("tsk_trash") + '">' + IC.trash + '</button>' : '') +
        '</article>';
}

function render() {
    if (teacherMode) return tRender();
    const open = tasks.filter(function (t) { return !t.done; });
    const late = open.filter(function (t) { return Tasks.bucket(t) === "late"; }).length;
    document.getElementById("tskSub").textContent = open.length
        ? tr("tsk_sub_open").replace("{n}", open.length) + (late ? " · " + tr("tsk_sub_late").replace("{n}", late) : "")
        : tr("tsk_sub_clear");
    document.querySelectorAll("#tskFilters [data-f]").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-f") === filter); });

    let list = tasks.slice();
    if (filter === "open") list = open;
    else if (filter === "done") list = tasks.filter(function (t) { return t.done; }).sort(function (a, b) { return new Date(b.done_at) - new Date(a.done_at); });
    const box = document.getElementById("tskList");
    if (!list.length) {
        box.innerHTML = '<div class="lsn-empty big">' + IC.empty + '<b>' + tr(filter === "done" ? "tsk_empty_done" : "tsk_empty_title") + '</b><small>' + tr(filter === "done" ? "tsk_empty_done_text" : "tsk_empty_text") + '</small></div>';
        return;
    }
    if (filter === "done") { box.innerHTML = list.map(cardHTML).join(""); return; }
    const order = ["late", "today", "tomorrow", "week", "later", "done"];
    let html = "";
    order.forEach(function (g) {
        const items = list.filter(function (t) { return groupOf(t) === g; });
        if (!items.length) return;
        html += '<h2 class="tsk-group g-' + g + '">' + tr("tsk_g_" + g) + ' <span>' + items.length + '</span></h2>' + items.map(cardHTML).join("");
    });
    box.innerHTML = html;
}

document.getElementById("tskFilters").addEventListener("click", function (e) {
    const b = e.target.closest("[data-f]");
    if (b) { filter = b.getAttribute("data-f"); render(); }
});

document.getElementById("tskList").addEventListener("click", function (e) {
    const card = e.target.closest(".tsk-item");
    if (!card) return;
    const t = tasks.find(function (x) { return x.id === card.getAttribute("data-id"); });
    if (!t) return;
    if (teacherMode) { if (e.target.closest('[data-act="trash"]')) tTrashTask(t, card); else tDetail(t); }
    else if (e.target.closest('[data-act="trash"]')) trashTask(t, card);
    else if (e.target.closest('[data-act="toggle"]')) toggleDone(t, card);
    else openSheet(t);
});

// shrink a phone photo before uploading (max 1600 px, JPEG)
function shrinkPhoto(file) {
    return new Promise(function (resolve) {
        const url = URL.createObjectURL(file), img = new Image();
        img.onload = function () {
            const k = Math.min(1, 1600 / Math.max(img.width, img.height));
            const c = document.createElement("canvas");
            c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(url);
            c.toBlob(function (b) { resolve(b || file); }, "image/jpeg", 0.82);
        };
        img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
        img.src = url;
    });
}

// "Did you really finish it?" before a task counts as handed in.
// A class task also needs photos of the work (1 to MAX_PHOTOS), taken with the camera.
const MAX_PHOTOS = 10;
function confirmDone(t) {
    const needPhoto = !!t.class;
    return new Promise(function (resolve) {
        const w = document.createElement("div");
        w.className = "ac-wrap ac-confirm tsk-ask" + (needPhoto ? " with-photo" : "");
        w.innerHTML = '<div class="ac-card">' + (needPhoto ? '' : '<div class="tsk-ask-ic">' + IC.check + '</div>') +
            '<div class="ac-top"><b></b><small></small></div>' +
            (needPhoto ? '<div class="tsk-photos"></div><p class="tsk-photos-note"></p>' : '') +
            '<div class="ac-actions"><button type="button" class="ac-cancel"></button><button type="button" class="ac-ok"></button></div></div>';
        w.querySelector(".ac-top b").textContent = tr("tsk_ask_title");
        w.querySelector(".ac-top small").textContent = '"' + t.title + '"';
        w.querySelector(".ac-cancel").textContent = tr("tsk_ask_no");
        const ok = w.querySelector(".ac-ok");
        const photos = [];   // [{blob, url}]
        // photos shared from another app (share.html -> tasks.html?shared=1) are already in
        if (needPhoto && sharedPhotos.length) {
            sharedPhotos.slice(0, MAX_PHOTOS).forEach(function (b) { photos.push({ blob: b, url: URL.createObjectURL(b) }); });
        }
        function paint() {
            if (!needPhoto) return;
            const box = w.querySelector(".tsk-photos");
            box.classList.toggle("empty", !photos.length);
            // the add button comes first so it is always in sight, newest photo next to it
            box.innerHTML = (photos.length < MAX_PHOTOS
                ? '<label class="tsk-ph-add"><input type="file" accept="image/*" capture="environment">' + IC.camera + '<b>' + tr(photos.length ? "tsk_photo_add" : "tsk_photo_take") + '</b>' + (photos.length ? '' : '<small>' + tr("tsk_photo_hint") + '</small>') + '</label>'
                : '') + photos.map(function (p, i) {
                return { p: p, i: i };
            }).reverse().map(function (x) {
                return '<div class="tsk-ph"><img src="' + x.p.url + '" alt=""><span class="n">' + (x.i + 1) + '</span><button type="button" class="rm" data-rm="' + x.i + '" aria-label="' + tr("btn_delete") + '">×</button></div>';
            }).join("");
            w.querySelector(".tsk-photos-note").textContent = photos.length
                ? tr("tsk_photo_count").replace("{n}", photos.length).replace("{max}", MAX_PHOTOS)
                : tr("tsk_photo_note");
            ok.disabled = !photos.length;
            ok.textContent = photos.length ? tr("tsk_photo_send").replace("{n}", photos.length) : tr("tsk_ask_yes");
            const inp = box.querySelector(".tsk-ph-add input");
            if (inp) inp.addEventListener("change", async function () {
                const f = this.files && this.files[0];
                if (!f) return;
                const blob = await shrinkPhoto(f);
                photos.push({ blob: blob, url: URL.createObjectURL(blob) });
                paint();
                box.scrollLeft = 0;
            });
        }
        if (needPhoto) {
            w.querySelector(".tsk-photos").addEventListener("click", function (e) {
                const rm = e.target.closest("[data-rm]");
                if (!rm) return;
                e.preventDefault();
                const p = photos.splice(Number(rm.getAttribute("data-rm")), 1)[0];
                if (p) URL.revokeObjectURL(p.url);
                paint();
            });
            paint();
        } else ok.textContent = tr("tsk_ask_yes");
        document.body.appendChild(w);
        requestAnimationFrame(function () { w.classList.add("in"); });
        let done = false;
        const close = function (v) {
            if (done) return; done = true;
            w.classList.add("out"); setTimeout(function () { w.remove(); }, 160);
            if (!v) photos.forEach(function (p) { URL.revokeObjectURL(p.url); });
            resolve(v);
        };
        w.addEventListener("click", function (e) { if (e.target === w) close(false); });
        w.querySelector(".ac-cancel").addEventListener("click", function () { close(false); });
        ok.addEventListener("click", function () { if (!ok.disabled) close({ blobs: photos.map(function (p) { return p.blob; }), usedShared: needPhoto && sharedPhotos.length > 0 }); });
        document.addEventListener("keydown", function k(e) { if (e.key === "Escape") { document.removeEventListener("keydown", k); close(false); } });
    });
}

// photos of a hand-in, opened full screen (private bucket: short-lived links)
async function viewPhoto(paths) {
    paths = Array.isArray(paths) ? paths : [paths];
    const w = document.createElement("div");
    w.className = "tsk-viewer";
    w.innerHTML = '<button type="button" class="x" aria-label="Close">×</button><div class="tsk-viewer-in"><span class="tsk-viewer-load"></span></div>';
    document.body.appendChild(w);
    requestAnimationFrame(function () { w.classList.add("in"); });
    const close = function () { w.classList.remove("in"); setTimeout(function () { w.remove(); }, 180); };
    w.addEventListener("click", function (e) { if (e.target === w || e.target.closest(".x") || e.target.classList.contains("tsk-viewer-in")) close(); });
    const urls = await Promise.all(paths.map(function (p) {
        return supabaseClient.storage.from("task-photos").createSignedUrl(p, 600).then(function (r) { return r.data && r.data.signedUrl; }, function () { return null; });
    }));
    const box = w.querySelector(".tsk-viewer-in");
    const ok = urls.filter(Boolean);
    if (!ok.length) { box.innerHTML = '<p>' + esc(tr("tsk_photo_missing")) + '</p>'; return; }
    box.innerHTML = ok.map(function (u, i) { return '<figure><img alt="" src="' + esc(u) + '">' + (ok.length > 1 ? '<figcaption>' + (i + 1) + ' / ' + ok.length + '</figcaption>' : '') + '</figure>'; }).join("");
}

// trash: the finished task leaves the student's list; the teacher keeps the hand-in
async function trashTask(t, card) {
    if (card) card.classList.add("gone");
    const res = await supabaseClient.from("task_done").update({ hidden_at: new Date().toISOString() }).eq("task_id", t.id).eq("user_id", me.id);
    if (res.error) {
        if (card) card.classList.remove("gone");
        showToast(tr("toast_save_failed") + res.error.message, "error");
        return;
    }
    tasks = tasks.filter(function (x) { return x !== t; });
    showToast(tr("tsk_trashed"), "success");
    setTimeout(render, 220);
}

async function toggleDone(t, card) {
    const was = t.done;
    // a class task that has been handed in is final
    if (was && t.class) { showToast(tr("tsk_locked"), "info"); return; }
    let photoPaths = null;
    if (!was) {
        const ans = await confirmDone(t);
        if (!ans) return;
        if (ans.blobs && ans.blobs.length) {
            // upload the photos first: no photos, no hand-in
            if (card) card.classList.add("busy");
            showToast(tr("tsk_photo_uploading"), "info");
            const stamp = Date.now(), done = [];
            for (let i = 0; i < ans.blobs.length; i++) {
                const path = me.id + "/" + t.id + "/" + stamp + "-" + (i + 1) + ".jpg";
                const up = await supabaseClient.storage.from("task-photos").upload(path, ans.blobs[i], { contentType: "image/jpeg", upsert: false });
                if (up.error) {
                    if (card) card.classList.remove("busy");
                    if (done.length) supabaseClient.storage.from("task-photos").remove(done);
                    showToast(tr("tsk_photo_failed") + up.error.message, "error");
                    return;
                }
                done.push(path);
            }
            if (card) card.classList.remove("busy");
            photoPaths = done;
        }
        if (ans.usedShared) clearShared();
    }
    t.done = !was; t.done_at = t.done ? new Date().toISOString() : null;
    if (card) { card.classList.toggle("done", t.done); card.classList.add("pop"); }
    const res = t.done
        ? await supabaseClient.from("task_done").insert(photoPaths ? { task_id: t.id, user_id: me.id, photo_paths: photoPaths } : { task_id: t.id, user_id: me.id })
        : await supabaseClient.from("task_done").delete().eq("task_id", t.id).eq("user_id", me.id);
    if (res.error && !/duplicate/i.test(res.error.message)) {
        t.done = was;
        if (card) card.classList.toggle("done", was);
        if (photoPaths) supabaseClient.storage.from("task-photos").remove(photoPaths);
        showToast(/TASK_PHOTO_REQUIRED/.test(res.error.message) ? tr("tsk_photo_required") : tr("toast_save_failed") + res.error.message, "error");
    } else if (t.done) { t.photo_paths = photoPaths; showToast(tr("tsk_done_toast"), "success"); }
    setTimeout(render, t.done ? 380 : 0);
}

function nextLessonDate(subject, cls) {
    const list = lessons.filter(function (x) { return String(x.subject).trim().toLowerCase() === String(subject).trim().toLowerCase() && (!cls || x.class === cls); });
    if (!list.length) return null;
    const now = new Date();
    for (let k = 1; k <= 14; k++) {
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + k);
        const dow = Lessons.isoDay(d);
        const l = Lessons.sort(list.filter(function (x) { return Number(x.day) === dow; }))[0];
        if (l) { const p = l.start_time.split(":"); d.setHours(Number(p[0]), Number(p[1])); return { date: d, lesson: l }; }
    }
    return null;
}

function openSheet(t) {
    const editing = !!t, readOnly = editing && !!t.class && t.created_by !== me.id;
    const due = editing ? new Date(t.due_at) : (function () { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(23, 59, 0, 0); return d; })();
    const w = document.createElement("div");
    w.className = "ac-wrap ac-confirm lsn-sheet tsk-sheet";
    if (readOnly) {
        const dl = Tasks.dueLabel(t);
        w.innerHTML = '<div class="ac-card">' +
            '<div class="tsk-view-top">' + (t.subject ? '<span class="tsk-subj t-' + Lessons.tone(t.subject) + '">' + esc(t.subject) + '</span>' : '') + '<span class="tsk-from">' + IC.person + esc(teacherNames[t.created_by] || tr("tsk_from_teacher")) + '</span></div>' +
            '<b class="tsk-view-title">' + esc(t.title) + '</b>' +
            '<div class="tsk-view-due g-' + groupOf(t) + '">' + IC.clock + '<span>' + esc(dl.when) + '</span><em>' + (t.done ? tr("tsk_f_done") : esc(dl.rel)) + '</em></div>' +
            (t.description ? '<p class="tsk-view-desc">' + esc(t.description).replace(/\n/g, "<br>") + '</p>' : '') +
            (t.done && t.photo_paths && t.photo_paths.length ? '<button type="button" class="tsk-photo-link">' + IC.image + '<span>' + tr("tsk_photo_view") + ' (' + t.photo_paths.length + ')</span></button>' : '') +
            (t.done ? '<p class="tsk-locked-note">' + tr("tsk_locked") + '</p>' : '') +
            '<div class="ac-actions">' + (t.done ? '<button type="button" class="ac-cancel wide">' + tr("btn_close_plain") + '</button>' : '<button type="button" class="ac-cancel">' + tr("btn_close_plain") + '</button><button type="button" class="ac-ok">' + tr("tsk_mark_done") + '</button>') + '</div></div>';
        document.body.appendChild(w);
        requestAnimationFrame(function () { w.classList.add("in"); });
        const close = function () { w.classList.add("out"); setTimeout(function () { w.remove(); }, 160); };
        w.addEventListener("click", function (e) { if (e.target === w) close(); });
        w.querySelector(".ac-cancel").addEventListener("click", close);
        const pl = w.querySelector(".tsk-photo-link");
        if (pl) pl.addEventListener("click", function () { viewPhoto(t.photo_paths); });
        const okb = w.querySelector(".ac-ok");
        if (okb) okb.addEventListener("click", function () { close(); toggleDone(t, document.querySelector('.tsk-item[data-id="' + t.id + '"]')); });
        return;
    }
    const today = new Date(), quick = [
        ["today", 0], ["tomorrow", 1], ["in2", 2], ["nextweek", 7]
    ];
    w.innerHTML = '<div class="ac-card"><div class="ac-top"><b></b></div><div class="lsn-form">' +
        (teacherMode ? '<div class="lsn-f"><span>' + tr("tsk_f_class") + '</span><div class="lsn-classes tsk-class-pick" id="tClass">' + myClasses.map(function (c) { return '<button type="button" data-class="' + esc(c) + '">' + esc(c) + '</button>'; }).join("") + '</div></div>' : '') +
        '<label class="lsn-f"><span>' + tr("tsk_f_title") + '</span><input type="text" id="tTitle" maxlength="120" autocomplete="off"></label>' +
        '<label class="lsn-f"><span>' + tr("lsn_f_subject") + ' <i>' + tr("lsn_optional") + '</i></span><input type="text" id="tSubject" list="tskSubjects" maxlength="60" autocomplete="off"></label>' +
        '<div class="lsn-f"><span>' + tr("tsk_f_due") + '</span><div class="tsk-quick" id="tQuick">' +
        quick.map(function (q) { return '<button type="button" data-add="' + q[1] + '">' + tr("tsk_q_" + q[0]) + '</button>'; }).join("") +
        '<button type="button" data-next hidden></button></div>' +
        '<div class="lsn-f-row"><input type="date" id="tDate"><input type="text" class="v2-time" id="tTime"></div></div>' +
        '<label class="lsn-f"><span>' + tr("tsk_f_note") + ' <i>' + tr("lsn_optional") + '</i></span><textarea id="tNote" rows="3" maxlength="1000"></textarea></label>' +
        '<p class="lsn-f-warn" id="tWarn" hidden></p></div>' +
        '<div class="ac-actions">' + (editing ? '<button type="button" class="ac-cancel lsn-del-btn">' + tr("btn_delete") + '</button>' : '<button type="button" class="ac-cancel">' + tr("btn_cancel_plain") + '</button>') +
        '<button type="button" class="ac-ok">' + tr("btn_save_plain") + '</button></div></div>';
    w.querySelector(".ac-top b").textContent = tr(editing ? "tsk_edit_title" : (teacherMode ? "tsk_add_title_class" : "tsk_add_title"));
    let selCls = editing ? t.class : (myClasses.length === 1 ? myClasses[0] : (myClasses.includes(myClass) ? myClass : ""));
    document.body.appendChild(w);
    const fTitle = w.querySelector("#tTitle"), fSubject = w.querySelector("#tSubject"), fDate = w.querySelector("#tDate"), fTime = w.querySelector("#tTime"), fNote = w.querySelector("#tNote"), warn = w.querySelector("#tWarn"), nextBtn = w.querySelector("[data-next]");
    fDate.value = Tasks.toDateInput(due); fTime.value = Tasks.toTimeInput(due);
    attTimeField(fTime);
    if (editing) { fTitle.value = t.title; fSubject.value = t.subject || ""; fNote.value = t.description || ""; }
    function paintQuick() {
        w.querySelectorAll("[data-add]").forEach(function (b) {
            const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + Number(b.getAttribute("data-add")));
            b.classList.toggle("on", Tasks.toDateInput(d) === fDate.value);
        });
        nextBtn.classList.toggle("on", !!nextBtn._date && Tasks.toDateInput(nextBtn._date) === fDate.value && Tasks.toTimeInput(nextBtn._date) === normalizeTime(fTime.value));
    }
    function paintClass() { w.querySelectorAll("#tClass [data-class]").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-class") === selCls); }); }
    if (teacherMode) {
        paintClass();
        w.querySelector("#tClass").addEventListener("click", function (e) { const b = e.target.closest("[data-class]"); if (b) { selCls = b.getAttribute("data-class"); paintClass(); updateNext(); } });
    }
    function updateNext() {
        const n = fSubject.value.trim() ? nextLessonDate(fSubject.value, teacherMode ? selCls : null) : null;
        nextBtn.hidden = !n;
        if (n) { nextBtn._date = n.date; nextBtn.textContent = tr("tsk_q_nextlesson").replace("{d}", Lessons.dayShort(Lessons.isoDay(n.date))).replace("{t}", Lessons.fmt(n.lesson.start_time)); }
        paintQuick();
    }
    w.querySelector("#tQuick").addEventListener("click", function (e) {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.hasAttribute("data-next")) { fDate.value = Tasks.toDateInput(b._date); fTime.value = Tasks.toTimeInput(b._date); }
        else { const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + Number(b.getAttribute("data-add"))); fDate.value = Tasks.toDateInput(d); }
        paintQuick();
    });
    fSubject.addEventListener("input", updateNext);
    fDate.addEventListener("change", paintQuick); fTime.addEventListener("change", paintQuick);
    updateNext();

    requestAnimationFrame(function () { w.classList.add("in"); if (!editing) fTitle.focus(); });
    const close = function () { w.classList.add("out"); setTimeout(function () { w.remove(); }, 160); };
    w.addEventListener("click", function (e) { if (e.target === w) close(); });
    w.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
    w.querySelector(".ac-cancel").addEventListener("click", function () { close(); if (editing) removeTask(t); });
    w.querySelector(".ac-ok").addEventListener("click", async function () {
        warn.hidden = true;
        const title = fTitle.value.trim(), time = normalizeTime(fTime.value);
        if (teacherMode && !selCls) { warn.textContent = tr("tsk_err_class"); warn.hidden = false; return; }
        if (!title) { fTitle.focus(); warn.textContent = tr("tsk_err_title"); warn.hidden = false; return; }
        if (!fDate.value || !time) { warn.textContent = tr("tsk_err_due"); warn.hidden = false; return; }
        const row = { title: title, subject: fSubject.value.trim() || null, description: fNote.value.trim() || null, due_at: Tasks.localISO(fDate.value, time), updated_at: new Date().toISOString() };
        this.disabled = true;
        const res = editing
            ? await supabaseClient.from("tasks").update(row).eq("id", t.id)
            : await supabaseClient.from("tasks").insert(Object.assign(teacherMode ? { class: selCls, created_by: me.id } : { user_id: me.id, created_by: me.id }, row));
        if (teacherMode && editing && !res.error && selCls !== t.class) await supabaseClient.from("tasks").update({ class: selCls }).eq("id", t.id);
        this.disabled = false;
        if (res.error) { warn.textContent = tr("toast_save_failed") + res.error.message; warn.hidden = false; return; }
        close();
        await load();
        showToast(tr(editing ? "tsk_saved" : "tsk_added"), "success");
    });
}

/* ===== Teacher mode: tasks given to classes + who has finished ===== */
async function tLoad() {
    const res = await supabaseClient.from("tasks").select("*").eq("created_by", me.id).not("class", "is", null).order("due_at", { ascending: true });
    if (res.error) {
        document.getElementById("tskList").innerHTML = '<div class="lsn-empty big">' + IC.empty + '<b>' + tr("tsk_setup_title") + '</b><small>' + tr("tsk_setup_text") + '</small></div>';
        document.getElementById("tskAddBtn").hidden = true;
        return;
    }
    // tasks the teacher put in the trash stay hidden from their list
    tasks = (res.data || []).filter(function (t) { return t.class && !t.archived_at; });
    const classes = Array.from(new Set(tasks.map(function (t) { return t.class; }).concat(myClasses))).filter(function (c) { return !(c in studentsByClass); });
    if (classes.length) {
        const r = await supabaseClient.from("profiles").select("id,name,class").eq("role", "murid").in("class", classes).order("name", { ascending: true });
        classes.forEach(function (c) { studentsByClass[c] = []; });
        (r.data || []).forEach(function (p) { (studentsByClass[p.class] = studentsByClass[p.class] || []).push(p); });
    }
    doneMap = {};
    if (tasks.length) {
        const d = await supabaseClient.from("task_done").select("*").in("task_id", tasks.map(function (t) { return t.id; }));
        (d.data || []).forEach(function (r) { (doneMap[r.task_id] = doneMap[r.task_id] || []).push(r); });
    }
    render();
}

function tProgress(t) {
    const studs = studentsByClass[t.class] || [], ids = studs.map(function (s) { return s.id; });
    const done = (doneMap[t.id] || []).filter(function (r) { return !ids.length || ids.indexOf(r.user_id) !== -1; });
    return { done: done.length, total: studs.length, rows: done, students: studs };
}

function tCardHTML(t) {
    const d = Tasks.dueLabel(t), g = Tasks.bucket(t) === "late" ? "past" : Tasks.bucket(t), pr = tProgress(t);
    const pct = pr.total ? Math.round(pr.done / pr.total * 100) : 0;
    const subj = t.subject ? '<span class="tsk-subj t-' + Lessons.tone(t.subject) + '">' + esc(t.subject) + '</span>' : '';
    return '<article class="tsk-item tsk-t g-' + g + (pr.total && pr.done === pr.total ? ' all-done' : '') + '" data-id="' + t.id + '">' +
        '<div class="tsk-body"><div class="tsk-top"><span class="tsk-cls">' + esc(t.class) + '</span>' + subj + '</div>' +
        '<strong class="tsk-title">' + esc(t.title) + '</strong>' +
        '<div class="tsk-due">' + IC.clock + '<span>' + esc(d.when) + '</span>' + (g === "past" ? '<em class="past">' + tr("tsk_t_closed") + '</em>' : '<em>' + esc(d.rel) + '</em>') + '</div>' +
        '<div class="tsk-prog"><div class="tsk-prog-bar"><i style="width:' + pct + '%"></i></div><span><b>' + pr.done + '</b>/' + pr.total + ' ' + tr("tsk_t_done_short") + '</span></div></div>' +
        // past deadline: the teacher can clear it from their list (the students' hand-ins stay)
        (g === "past" ? '<button type="button" class="tsk-trash" data-act="trash" aria-label="' + tr("tsk_trash") + '" title="' + tr("tsk_trash") + '">' + IC.trash + '</button>' : '') +
        '</article>';
}

function tRender() {
    const active = tasks.filter(function (t) { return Tasks.bucket(t) !== "late"; });
    document.getElementById("tskSub").textContent = tr("tsk_t_sub").replace("{n}", active.length);
    document.querySelectorAll("#tskFilters [data-f]").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-f") === filter); });
    let list = filter === "open" ? active : filter === "done" ? tasks.filter(function (t) { return Tasks.bucket(t) === "late"; }).reverse() : tasks.slice();
    const box = document.getElementById("tskList");
    if (!list.length) {
        box.innerHTML = '<div class="lsn-empty big">' + IC.empty + '<b>' + tr(filter === "done" ? "tsk_t_empty_past" : "tsk_t_empty") + '</b><small>' + tr(filter === "done" ? "tsk_t_empty_past_text" : "tsk_t_empty_text") + '</small></div>';
        return;
    }
    if (filter !== "open") { box.innerHTML = list.map(tCardHTML).join(""); return; }
    let html = "";
    ["today", "tomorrow", "week", "later"].forEach(function (g) {
        const items = list.filter(function (t) { return Tasks.bucket(t) === g; });
        if (items.length) html += '<h2 class="tsk-group g-' + g + '">' + tr("tsk_g_" + g) + ' <span>' + items.length + '</span></h2>' + items.map(tCardHTML).join("");
    });
    box.innerHTML = html;
}

function tDetail(t) {
    const pr = tProgress(t), d = Tasks.dueLabel(t), past = Tasks.bucket(t) === "late";
    const doneIds = {}, photos = {}; pr.rows.forEach(function (r) { doneIds[r.user_id] = r.done_at; if (r.photo_paths && r.photo_paths.length) photos[r.user_id] = r.photo_paths; });
    const doneList = pr.students.filter(function (s) { return doneIds[s.id]; }).sort(function (a, b) { return new Date(doneIds[a.id]) - new Date(doneIds[b.id]); });
    const notList = pr.students.filter(function (s) { return !doneIds[s.id]; });
    const fmtDone = function (iso) { const x = new Date(iso); return Tasks.dueLabel({ due_at: iso }).when + (x > new Date(t.due_at) ? " · " + tr("tsk_t_late_submit") : ""); };
    const person = function (s, extra, cls) {
        const ph = cls === "yes" && photos[s.id] ? '<button type="button" class="tsk-ph-btn" data-sid="' + esc(s.id) + '" aria-label="' + tr("tsk_photo_view") + '">' + IC.image + '<span>' + photos[s.id].length + '</span></button>' : '';
        return '<li class="' + (cls || "") + '"><span class="tsk-av">' + esc((s.name || "?").trim().charAt(0).toUpperCase()) + '</span><span class="tsk-nm">' + esc(s.name) + '</span>' + (extra ? '<small>' + esc(extra) + '</small>' : '') + ph + '</li>';
    };
    const w = document.createElement("div");
    w.className = "ac-wrap ac-confirm lsn-sheet tsk-sheet";
    w.innerHTML = '<div class="ac-card">' +
        '<div class="tsk-view-top"><span class="tsk-cls">' + esc(t.class) + '</span>' + (t.subject ? '<span class="tsk-subj t-' + Lessons.tone(t.subject) + '">' + esc(t.subject) + '</span>' : '') + '</div>' +
        '<b class="tsk-view-title">' + esc(t.title) + '</b>' +
        '<div class="tsk-view-due g-' + (past ? "late" : Tasks.bucket(t)) + '">' + IC.clock + '<span>' + esc(d.when) + '</span><em>' + (past ? tr("tsk_t_closed") : esc(d.rel)) + '</em></div>' +
        (t.description ? '<p class="tsk-view-desc">' + esc(t.description).replace(/\n/g, "<br>") + '</p>' : '') +
        '<div class="tsk-prog big"><div class="tsk-prog-bar"><i style="width:' + (pr.total ? Math.round(pr.done / pr.total * 100) : 0) + '%"></i></div><span><b>' + pr.done + '</b>/' + pr.total + ' ' + tr("tsk_t_done_short") + '</span></div>' +
        '<div class="tsk-people"><h3>' + tr("tsk_t_not_yet") + ' <span>' + notList.length + '</span></h3><ul>' + (notList.length ? notList.map(function (s) { return person(s, "", "not"); }).join("") : '<li class="none">' + tr("tsk_t_everyone") + '</li>') + '</ul>' +
        '<h3>' + tr("tsk_f_done") + ' <span>' + doneList.length + '</span></h3><ul>' + (doneList.length ? doneList.map(function (s) { return person(s, fmtDone(doneIds[s.id]), "yes"); }).join("") : '<li class="none">' + tr("tsk_t_nobody") + '</li>') + '</ul></div>' +
        '<div class="ac-actions tsk-t-actions"><button type="button" class="ac-cancel" data-a="close">' + tr("btn_close_plain") + '</button><button type="button" class="ac-ok" data-a="edit">' + tr("btn_edit_plain") + '</button></div></div>';
    document.body.appendChild(w);
    requestAnimationFrame(function () { w.classList.add("in"); });
    const close = function () { w.classList.add("out"); setTimeout(function () { w.remove(); }, 160); };
    w.addEventListener("click", function (e) {
        if (e.target === w) return close();
        const ph = e.target.closest("[data-sid]");
        if (ph) return viewPhoto(photos[ph.getAttribute("data-sid")]);
        const a = e.target.closest("[data-a]"); if (!a) return;
        close();
        if (a.getAttribute("data-a") === "edit") openSheet(t);
    });
}

// teacher trash: the task leaves the teacher's list; nothing is deleted
async function tTrashTask(t, card) {
    if (card) card.classList.add("gone");
    const res = await supabaseClient.from("tasks").update({ archived_at: new Date().toISOString() }).eq("id", t.id);
    if (res.error) {
        if (card) card.classList.remove("gone");
        showToast(tr("toast_save_failed") + res.error.message, "error");
        return;
    }
    tasks = tasks.filter(function (x) { return x !== t; });
    showToast(tr("tsk_trashed"), "success");
    setTimeout(render, 220);
}

async function removeTask(t) {
    const ok = await attConfirm({ title: tr("tsk_del_title"), text: tr("tsk_del_text").replace("{s}", t.title), ok: tr("btn_delete") });
    if (!ok) return;
    const { error } = await supabaseClient.from("tasks").delete().eq("id", t.id);
    if (error) { showToast(tr("toast_save_failed") + error.message, "error"); return; }
    tasks = tasks.filter(function (x) { return x.id !== t.id; });
    render();
    showToast(tr("tsk_deleted"), "success");
}

document.getElementById("tskAddBtn").addEventListener("click", function () { openSheet(null); });

async function init() {
    const user = await requireLogin();
    if (!user) return;
    me = user;
    const { data: prof } = await supabaseClient.from("profiles").select("class,role").eq("id", user.id).maybeSingle();
    myClass = (prof && prof.class) || "";
    teacherMode = !!prof && (prof.role === "guru" || prof.role === "admin");
    if (teacherMode) {
        document.body.classList.add("tsk-teacher");
        const fo = document.querySelector('#tskFilters [data-f="open"]'), fd = document.querySelector('#tskFilters [data-f="done"]');
        fo.setAttribute("data-i18n", "tsk_t_f_active"); fo.textContent = tr("tsk_t_f_active");
        fd.setAttribute("data-i18n", "tsk_t_f_past"); fd.textContent = tr("tsk_t_f_past");
        const h = document.querySelector(".v2-tsk h1"); h.setAttribute("data-i18n", "page_tasks_teacher"); h.textContent = tr("page_tasks_teacher");
        let q = supabaseClient.from("class_schedules").select("class,subject,day,start_time");
        q = prof.role === "admin" ? q : q.eq("teacher_id", user.id);
        const r = await q;
        lessons = r.error ? [] : (r.data || []);
        const set = new Set(lessons.map(function (x) { return x.class; }));
        if (myClass) set.add(myClass);
        if (prof.role === "admin") {
            const rs = await supabaseClient.from("profiles").select("class").eq("role", "murid");
            (rs.data || []).forEach(function (x) { if (x.class) set.add(x.class); });
        }
        myClasses = Array.from(set).filter(Boolean).sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
        const subj = Array.from(new Set(lessons.map(function (x) { return x.subject; }))).sort();
        document.getElementById("tskSubjects").innerHTML = subj.map(function (s) { return '<option value="' + esc(s) + '">'; }).join("");
    } else if (myClass) {
        const r = await supabaseClient.from("class_schedules").select("subject,day,start_time").eq("class", myClass);
        lessons = r.error ? [] : (r.data || []);
        const subj = Array.from(new Set(lessons.map(function (x) { return x.subject; }))).sort();
        document.getElementById("tskSubjects").innerHTML = subj.map(function (s) { return '<option value="' + esc(s) + '">'; }).join("");
    }
    await load();
    setInterval(render, 60000);
    useShared();
    if (new URLSearchParams(location.search).get("new") === "1") openSheet(null);
}
// ---------- photos shared from another app (Android share menu) ----------
let sharedPhotos = [];
async function useShared() {
    if (!window.attShared || !window.attShared.wanted()) return;
    window.attShared.forget();
    if (teacherMode) { window.attShared.clear(); return; }
    sharedPhotos = (await window.attShared.list()).slice(0, MAX_PHOTOS);
    if (!sharedPhotos.length) return;
    const open = tasks.filter(function (t) { return t.class && !t.done; });
    if (!open.length) { showToast(tr("tsk_shared_none"), "info"); clearShared(); return; }
    filter = "open"; render();
    const box = document.getElementById("tskShared");
    document.getElementById("tskSharedThumbs").innerHTML = sharedPhotos.slice(0, 3).map(function (b) { return '<img alt="" src="' + URL.createObjectURL(b) + '">'; }).join("");
    document.getElementById("tskSharedText").textContent = tr("tsk_shared_pick").replace("{n}", sharedPhotos.length);
    box.hidden = false;
    document.getElementById("tskSharedX").onclick = clearShared;
}
function clearShared() {
    sharedPhotos = [];
    document.getElementById("tskShared").hidden = true;
    if (window.attShared) window.attShared.clear();
}

async function pushBanner() {
    const P = window.AttPush, el = document.getElementById("tskPush");
    if (!P || teacherMode) return;
    let dismissed = false; try { dismissed = !!localStorage.getItem("attendreem-push-banner-x"); } catch (e) {}
    if (dismissed || P.permission() === "denied" || (!P.supported() && !P.isIOS())) return;
    if (await P.isEnabled()) return;
    el.hidden = false;
    el.querySelector(".x").onclick = function () { el.hidden = true; try { localStorage.setItem("attendreem-push-banner-x", "1"); } catch (e) {} };
    el.querySelector(".go").onclick = async function () {
        if (P.needsInstallFirst()) { location.href = "settings.html#appCard"; return; }
        const r = await P.enable();
        if (r.ok) { el.hidden = true; showToast(tr("push_enabled_toast"), "success"); }
        else showToast(tr(r.reason === "denied" ? "push_blocked" : "push_failed"), "error");
    };
}

init().then(function () { (function w(n) { if (window.AttPush) pushBanner(); else if (n < 40) setTimeout(function () { w(n + 1); }, 100); })(0); });
